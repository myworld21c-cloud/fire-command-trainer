· sop_notes 에는 <누락한 요소마다> 그것이 왜 필요한지 근거를 한 항목씩 쓴다.
  item 에는 요소 key 를, basis 에는 근거를 한두 문장으로 쓴다.
  근거를 쓸 때는 위 "SOP 적용 기준"의 제약을 반드시 지켜라.
· reference_used 에는 근거의 출처를 쓴다. "SOP 적용 기준"에 지시된 값을 그대로 쓴다.`;

  const SCHEMA_EVAL = {
    type:'OBJECT',
    properties:{
      checked_items:{ type:'ARRAY', items:{ type:'STRING' } },
      missed_items:{ type:'ARRAY', items:{ type:'STRING' } },
      radio_score:{ type:'INTEGER' },
      relevance_score:{ type:'INTEGER' },
      review:{ type:'STRING' },
      model_transmission:{ type:'STRING' },
      sop_notes:{ type:'ARRAY', items:{
        type:'OBJECT',
        properties:{ item:{ type:'STRING' }, basis:{ type:'STRING' } },
        required:['item','basis']
      }},
      reference_used:{ type:'STRING', enum:['uploaded_sop','general_principle'] }
    },
    required:['checked_items','missed_items','radio_score','relevance_score','review','model_transmission','sop_notes','reference_used']
  };

  /* ---- 세션 총평 ---- */
  api.evaluate = async function(sess){
    const sc = scenarioById(sess.scenarioId);
    const transcript = sess.log.map(l=>{
      if(l.who==='sys') return `[시스템] ${l.text}`;
      return (l.who==='dispatch' ? '[상황실/현장] ' : '[지휘관] ') + l.text;
    }).join('\n');
    const user =
`## 훈련 정보
${sceneBlock(sc, sess.role, sess.diff, 0, 0).split('\n').filter(l=>!l.startsWith('- 진행')).join('\n')}
- 지휘 응답 없음: ${sess.score.noResponse}회
- 지휘관 송신 횟수: ${sess.log.filter(l=>l.who==='me').length}회

${PRIORITY_BLOCK}

${sopBlock()}

## 필수 요소
${rubricBlock(sess.role)}

## 전체 무전 기록
${transcript}
${allowedDocsBlock(2800)}

위 훈련을 루브릭에 따라 채점하고 JSON으로 출력하라.`;
    return await generate(SYS_EVAL, user, SCHEMA_EVAL);
  };

  /* ---- 사용 가능한 모델 목록 조회 (ListModels) ----
     AI에게 "최신 모델이 뭐냐"고 묻지 않는다. 그러면 없는 모델을 지어낸다.
     실제 API가 돌려주는 목록만 쓴다.
     · 보내는 것: 없음(GET). 사용자 자료·훈련 내용이 나가지 않는다.
     · 받는 것: 모델 메타데이터뿐. 값은 전부 검증 후에만 저장·표시한다. */
  api.listModels = async function(){
    if(prefs.aiOffline) throw new Error('OFFLINE_MODE');
    const key = api.getKey();
    if(!key) throw new Error('NO_KEY');

    const ctl = new AbortController();
    const to  = setTimeout(()=> ctl.abort(), 15000);
    try{
      const res = await fetch(ENDPOINT.replace(/\/$/, '') + '?pageSize=200', {
        method:'GET',
        headers:{ 'x-goog-api-key': key },
        referrerPolicy:'no-referrer',
        signal: ctl.signal
      });
      if(!res.ok){
        const t = await res.text().catch(()=> '');
        const e = new Error('HTTP ' + res.status);
        e.detail = t.slice(0, 180);
        throw e;
      }
      const data = await res.json();
      const rows = Array.isArray(data && data.models) ? data.models : [];

      const out = [];
      rows.forEach(m => {
        if(!m) return;
        const methods = Array.isArray(m.supportedGenerationMethods) ? m.supportedGenerationMethods : [];
        if(methods.indexOf('generateContent') < 0) return;              // 대화 생성이 되는 것만
        const id = String(m.name || '').replace(/^models\//, '').trim();
        if(!api.validModel(id)) return;                                  // 형식 검증 통과분만
        out.push({
          id,
          label: String(m.displayName || id).slice(0, 60),
          inLimit:  Number(m.inputTokenLimit)  || 0,
          outLimit: Number(m.outputTokenLimit) || 0,
          alias: /-latest$/.test(id)
        });
      });

      /* 정렬: 별칭(-latest) 우선 → 버전 높은 순 → 이름순.
         별칭은 구글이 최신본으로 계속 갱신하므로 가장 오래 쓸 수 있다. */
      const ver = id => {
        const m = id.match(/(\d+)\.(\d+)/);
        return m ? parseInt(m[1],10) * 1000 + parseInt(m[2],10) : 0;
      };
      out.sort((a,b) =>
        (b.alias?1:0) - (a.alias?1:0) ||
        ver(b.id) - ver(a.id) ||
        a.id.localeCompare(b.id));

      return out;
    } finally {
      clearTimeout(to);
    }
  };

  /* 목록에서 권장 모델 고르기 — 훈련용으로는 응답이 빠른 flash 계열이 맞다 */
  api.recommend = function(list){
    if(!list || !list.length) return null;
    return (list.find(m => m.alias && /flash/i.test(m.id) && !/lite|thinking|image|tts|embed/i.test(m.id))
         || list.find(m => m.alias && /flash/i.test(m.id))
         || list.find(m => /flash/i.test(m.id))
         || list.find(m => m.alias)
         || list[0]).id;
  };

  /* ---- 연결 테스트 ---- */
  api.test = async function(){
    const t0 = Date.now();
    const r = await generate(
      '너는 응답 확인용 에코 서버다.',
      '{"ok":true} 형태로만 답하라.',
      { type:'OBJECT', properties:{ ok:{ type:'BOOLEAN' } }, required:['ok'] },
      true
    );
    return { ok: !!(r && r.ok), ms: Date.now() - t0 };
  };

  return api;
})();

/* 필수 요소 key 화이트리스트 검증 — AI가 엉뚱한 문자열을 보내도 점수가 깨지지 않게 */
function sanitizeItems(roleKey, arr){
  const valid = ROLES[roleKey].items.map(i=>i.key);
  const set = new Set();
  (Array.isArray(arr) ? arr : []).forEach(k=>{
    const s = String(k||'').trim();
    if(valid.includes(s)) set.add(s);
    else {                                   // 라벨로 보내온 경우 역매핑
      const hit = ROLES[roleKey].items.find(i => i.label === s || s.indexOf(i.key) >= 0);
      if(hit) set.add(hit.key);
    }
  });
  return Array.from(set);
}

/* 턴 판정 통합 진입점 — AI 우선, 실패 시 로컬 판정으로 폴백
   judgeLocal(text, roleKey, sc, turnIdx)의 시그니처와 반환 형태를 그대로 따른다. */
async function judgeTurn(text, roleKey, sc, turnIdx, run){
  if(AIRadio.enabled()){
    try{
      const r = await AIRadio.turn(text, roleKey, sc, turnIdx, run);
      const checked = sanitizeItems(roleKey, r.checked_items);
      const reply = String(r.radio_reply || '').trim();
      if(reply){
        const tr = String(r.situation_trend || '').trim();
        return {
          radio_reply: reply,
          checked_items: checked,
          missed_items: ROLES[roleKey].items.map(i=>i.key).filter(k=>!checked.includes(k)),
          next_situation: String(r.next_situation || '').trim(),
          situation_trend: ['stabilizing','holding','worsening'].indexOf(tr) >= 0 ? tr : 'holding',
          trend_reason: String(r.trend_reason || '').trim(),
          _ai: true
        };
      }
      throw new Error('EMPTY_REPLY');
    }catch(e){
      AIRadio.lastError = safeErr(e);
      logSafe('AIRadio.turn', AIRadio.lastError);
    }
  }
  /* 오프라인·실패 시 로컬 판정 — 추이는 충족 요소 수로 대신 가늠한다 */
  const local = judgeLocal(text, roleKey, sc, turnIdx);
  local.next_situation = '';
  const n = local.checked_items.length, total = ROLES[roleKey].items.length;
  local.situation_trend = n >= total - 1 ? 'stabilizing' : (n >= 2 ? 'holding' : 'worsening');
  local.trend_reason = n >= total - 1 ? '필요한 조치가 대체로 지시되어 현장이 안정되는 중입니다.'
                     : n >= 2 ? '일부 조치가 지시됐으나 아직 결정적 변화는 없습니다.'
                     : '필요한 지시가 부족해 상황이 나빠지고 있습니다.';
  local._ai = false;
  return local;
}

/* ===============================================================
   6.5 VoiceIO — 음성 입출력 모듈 (2단계 신규)
   기존 코드와 이름이 겹치지 않도록 모든 상태를 이 객체 안에 캡슐화한다.
     VoiceIO.state : 'idle' | 'listening' | 'speaking'
     VoiceIO.tts   : supported / speak / cancel / setVoice / setRate
     VoiceIO.stt   : supported / start / stop / abort / onResult / onError
   =============================================================== */
const VoiceIO = (function(){

  const SR    = window.SpeechRecognition || window.webkitSpeechRecognition || null;
  const synth = window.speechSynthesis || null;

  /* https(또는 localhost)가 아니면 마이크 권한 자체를 얻을 수 없다 */
  const secure = (location.protocol === 'https:' ||
                  location.hostname === 'localhost' ||
                  location.hostname === '127.0.0.1');

  const api = {
    state:'idle',
    secure: secure,
    micDenied:false,
    lastError:'',
    allVoices:[], koVoices:[],
    stt:{}, tts:{}
  };

  /* ---- 상태 전이 단일 지점 ---- */
  let endCbs = [];                       // 발화/인식 종료 대기 콜백 (일회성)
  function setState(s){
    if(api.state === s) return;
    api.state = s;
    refreshHint();
    if(s === 'idle') flushEndCbs();
  }
  function flushEndCbs(){
    const list = endCbs; endCbs = [];
    list.forEach(fn => { try{ fn(); }catch(e){ logSafe('VoiceIO', (e && e.name) || 'CB_ERROR'); } });
  }
  /* TTS/STT가 모두 끝난 시점에 콜백 실행 (이미 idle이면 즉시) */
  function whenIdle(cb){
    if(api.state === 'idle'){ cb(); return; }
    endCbs.push(cb);
  }

  /* =============== TTS =============== */
  const ttsSupported = !!(synth && window.SpeechSynthesisUtterance);
  let watchdog = null, speakSeq = 0;

  function loadVoices(){
    if(!ttsSupported) return;
    let list = [];
    try{ list = synth.getVoices() || []; }catch(e){ list = []; }
    api.allVoices = list;
    api.koVoices  = list.filter(v => /^ko([-_]|$)/i.test(v.lang || ''));
    if(typeof window.__onVoicesReady === 'function') window.__onVoicesReady();
  }
  if(ttsSupported){
    loadVoices();
    try{ synth.addEventListener('voiceschanged', loadVoices); }catch(e){ synth.onvoiceschanged = loadVoices; }
    /* voiceschanged가 끝내 안 오는 안드로이드 빌드 대비 재시도 */
    [120, 500, 1500, 3000].forEach(ms => setTimeout(loadVoices, ms));
  }

  function pickVoice(){
    if(!api.allVoices.length) return null;
    if(prefs.voiceURI){
      const hit = api.allVoices.find(v => v.voiceURI === prefs.voiceURI);
      if(hit) return hit;
    }
    return api.koVoices[0] || null;      // 없으면 null → 브라우저 기본 음성
  }

  /* Chrome은 한 번에 15초쯤 넘게 말하면 도중에 끊긴다.
     그래서 한 조각을 45자(약 7초) 이하로 잘라 순서대로 이어 읽는다.
     예전에는 110자로 잘라 조각 하나가 15초를 넘겨 뒷부분이 잘렸다. */
  const TTS_CHUNK = 45;
  function splitText(t){
    const clean = String(t || '').replace(/\s+/g, ' ').trim();
    if(!clean) return [];
    /* 문장 → 쉼표/접속 단위까지 쪼개, 조각이 길어지지 않게 한다 */
    const parts = [];
    (clean.match(/[^.!?…]+[.!?…]*/g) || [clean]).forEach(s => {
      s = s.trim(); if(!s) return;
      if(s.length <= TTS_CHUNK){ parts.push(s); return; }
      let buf = '';
      s.split(/(?<=[,·、])\s*/).forEach(seg => {
        seg = seg.trim(); if(!seg) return;
        if((buf + ' ' + seg).trim().length > TTS_CHUNK){
          if(buf) parts.push(buf.trim());
          buf = seg;
        } else buf = (buf + ' ' + seg).trim();
      });
      if(buf) parts.push(buf.trim());
    });
    /* 그래도 긴 조각은 글자수로 강제 분할 */
    const out = [];
    parts.forEach(p => {
      while(p.length > TTS_CHUNK + 15){
        let cut = p.lastIndexOf(' ', TTS_CHUNK);
        if(cut < 12) cut = TTS_CHUNK;
        out.push(p.slice(0, cut).trim());
        p = p.slice(cut).trim();
      }
      if(p) out.push(p);
    });
    return out.length ? out : [clean];
  }

  /* 예전 워치독은 7초마다 pause()/resume() 을 걸었는데,
     안드로이드에서는 이 조작 자체가 남은 말을 잘라먹는다.
     이제는 "멈춰 있으면 풀어주기"만 하고 건드리지 않는다. */
  function startWatchdog(){
    stopWatchdog();
    watchdog = setInterval(()=>{
      if(!synth) return;
      try{ if(synth.paused) synth.resume(); }catch(e){}
    }, 3000);
  }
  function stopWatchdog(){ if(watchdog){ clearInterval(watchdog); watchdog = null; } }

  /* 한 조각을 읽는 데 걸릴 시간 추정 (말이 끝났는데 onend 가 안 오는 기기 대비) */
  function chunkMs(s){
    const rate = Math.min(2, Math.max(0.5, parseFloat(prefs.rate) || 1));
    return Math.round(String(s).length * 260 / rate) + 3500;
  }

  api.tts.supported = ttsSupported;
  api.tts.enabled   = ()=> ttsSupported && !!prefs.voiceFeedback;
  api.tts.setVoice  = uri => { prefs.voiceURI = uri || ''; savePrefs(); };
  api.tts.setRate   = r   => { prefs.rate = Math.min(2, Math.max(0.5, parseFloat(r) || 1)); savePrefs(); };

  api.tts.speak = function(text, onDone){
    const finish = ()=>{ if(typeof onDone === 'function') onDone(); };
    if(!api.tts.enabled() || !text){ setTimeout(finish, 0); return; }
    if(api.state === 'listening'){ setTimeout(finish, 0); return; }  // 인식 중에는 발화하지 않음(에코 차단)

    try{ synth.cancel(); }catch(e){}                                  // 이전 큐 비우기
    const chunks = splitText(text);
    if(!chunks.length){ setTimeout(finish, 0); return; }

    const seq = ++speakSeq;
    let i = 0, ended = false, guardTimer = null;
    setState('speaking');
    startWatchdog();

    const done = ()=>{
      if(ended || seq !== speakSeq) return;
      ended = true;
      clearTimeout(guardTimer);
      stopWatchdog();
      if(api.state === 'speaking') setState('idle');
      finish();
    };

    /* 조각 단위로 넘어간다. 전체 발화에 하나의 타이머를 걸면
       추정이 조금만 짧아도 아직 읽는 중인데 끝난 것으로 처리돼
       뒷부분이 잘렸다. 이제는 조각마다 개별 안전망을 둔다. */
    const next = ()=>{
      if(seq !== speakSeq) return;                                    // cancel/재발화로 무효화
      clearTimeout(guardTimer);
      if(i >= chunks.length){ done(); return; }

      const piece = chunks[i++];
      let advanced = false;
      const step = ()=>{ if(advanced || seq !== speakSeq) return; advanced = true; next(); };

      const u = new SpeechSynthesisUtterance(piece);
      const v = pickVoice();
      if(v) u.voice = v;
      u.lang   = (v && v.lang) || 'ko-KR';
      u.rate   = Math.min(2, Math.max(0.5, parseFloat(prefs.rate) || 1));
      u.pitch  = 1; u.volume = 1;
      u.onend   = step;
      u.onerror = step;                                               // 에러도 다음으로 넘겨 앱이 멈추지 않게
      try{ synth.speak(u); }
      catch(e){ done(); return; }

      /* onend 가 오지 않는 기기 대비 — 아직 읽는 중이면 계속 기다리고,
         정말 멈춰 있을 때만 다음 조각으로 넘어간다. */
      const deadline = Date.now() + chunkMs(piece) * 3;
      const arm = ms => {
        guardTimer = setTimeout(()=>{
          if(seq !== speakSeq || advanced) return;
          let busy = false;
          try{ busy = synth.speaking || synth.pending; }catch(e){}
          if(busy && Date.now() < deadline){ arm(1200); return; }      // 아직 읽는 중
          step();
        }, ms);
      };
      arm(chunkMs(piece));
    };
    next();
  };

  api.tts.cancel = function(){
    speakSeq++;                       // 진행 중 발화 무효화
    stopWatchdog();
    if(synth){ try{ synth.cancel(); }catch(e){} }
    if(api.state === 'speaking') setState('idle');
  };
  api.isSpeaking = ()=> api.state === 'speaking';

  /* =============== STT =============== */
  const sttAvailable = !!SR;
  let rec = null, running = false, discard = false;

  /*
     Android Chrome SpeechRecognition 안정화용 상태.
     핵심 원칙:
     1) interim 결과를 최종 문자열에 누적하지 않는다.
     2) 한 recognition 세션 안에서는 resultIndex별 결과를 보관하고
        같은 결과가 다시 전달되어도 한 번만 반영한다.
     3) recognition.onend가 한 번의 구간을 확정하는 유일한 지점이다.
     4) PTT 한 번의 입력에 대해 api.stt.onResult()는 정확히 한 번만 호출한다.
     5) Android의 자동 재시작은 '새 구간'으로 취급하되, 각 구간은 onend에서
        한 번만 sessionText에 합친다.
  */
  let holding = false, stopping = false, restartTimer = null, sessionText = '';
  let segmentResults = new Map();       // recognition 결과 index -> { text, final }
  let segmentInterim = '';
  let segmentDelivered = false;         // 현재 PTT 전체 입력의 최종 전달 여부
  let segmentSeq = 0;                   // recognition 구간 식별자
  let activeSegmentSeq = 0;

  api.stt.supported = sttAvailable && secure;
  api.stt.onResult  = null;
  api.stt.onError   = null;

  function resetSegment(){
    segmentResults = new Map();
    segmentInterim = '';
    activeSegmentSeq = ++segmentSeq;
  }

  function getSegmentFinal(){
    return Array.from(segmentResults.entries())
      .sort((a,b)=>a[0]-b[0])
      .filter(([,v])=>v && v.final)
      .map(([,v])=>v.text || '')
      .join(' ')
      .replace(/\s+/g,' ')
      .trim();
  }

  /* 문장 전체를 단순 replace하지 않고, 새 구간이 이전 구간의 일부를
     반복해서 돌려주는 Android 음성인식 특성을 고려해 경계 중복만 제거한다. */
  function appendSegment(base, piece){
    base = (base || '').replace(/\s+/g,' ').trim();
    piece = (piece || '').replace(/\s+/g,' ').trim();
    if(!piece) return base;
    if(!base) return piece;
    if(base === piece) return base;

    /* 완전 포함 관계: 같은 구간이 다시 온 경우 */
    if(piece.startsWith(base)) return piece;
    if(base.endsWith(piece)) return base;

    /* 앞/뒤 경계가 겹치는 경우에만 가장 긴 overlap 제거 */
    const max = Math.min(base.length, piece.length);
    for(let n=max; n>=8; n--){
      if(base.slice(-n) === piece.slice(0,n)){
        return (base + ' ' + piece.slice(n)).replace(/\s+/g,' ').trim();
      }
    }
    return (base + ' ' + piece).replace(/\s+/g,' ').trim();
  }

  function build(){
    if(rec) return rec;
    rec = new SR();
    rec.lang = 'ko-KR';
    /* Android에서는 장시간 continuous 세션이 자주 종료되므로 자동 재시작한다.
       단, 결과 누적은 Web Speech의 results 배열을 기준으로 별도 관리한다. */
    rec.continuous = true;
    rec.interimResults = true;
    rec.maxAlternatives = 1;

    rec.onstart = ()=>{
      running = true;
      setState('listening');
    };

    rec.onresult = e => {
      if(discard) return;

      /* resultIndex 이후의 결과만 갱신한다. 동일 index가 다시 전달되면
         Map에서 교체되므로 같은 문장이 중복 누적되지 않는다. */
      for(let i = e.resultIndex; i < e.results.length; i++){
        const result = e.results[i];
        const t = (result && result[0] && result[0].transcript || '')
          .replace(/\s+/g,' ').trim();
        if(!t) continue;
        segmentResults.set(i, { text:t, final:!!result.isFinal });
      }

      /* 현재 구간에서 아직 final이 아닌 가장 최근 결과만 화면에 표시한다. */
      let latestInterim = '';
      for(let i=e.results.length-1; i>=0; i--){
        const result=e.results[i];
        if(result && !result.isFinal){
          latestInterim=(result[0] && result[0].transcript || '').replace(/\s+/g,' ').trim();
          break;
        }
      }
      segmentInterim = latestInterim;

      const preview = appendSegment(sessionText, getSegmentFinal());
      showInterim((preview + (segmentInterim ? ' ' + segmentInterim : '')).trim());
    };

    rec.onerror = e => {
      const code = (e && e.error) || 'unknown';
      api.lastError = code;
      if(code === 'no-speech'){
        hint('음성이 감지되지 않았습니다. 버튼을 길게 누른 채 말씀하십시오.', false);
      }else if(code === 'aborted'){
        /* 사용자가 취소한 경우 조용히 종료 */
      }else if(code === 'not-allowed' || code === 'service-not-allowed'){
        api.micDenied = true;
        prefs.sttEnabled = false; savePrefs();
        hint('마이크 권한이 거부되었습니다. 아래 입력창으로 송신하십시오.', true);
      }else if(code === 'audio-capture'){
        api.micDenied = true;
        hint('마이크를 찾을 수 없습니다. 텍스트로 입력하십시오.', true);
      }else if(code === 'network'){
        hint('음성인식 네트워크 오류입니다. 텍스트로 입력하십시오.', true);
      }else{
        hint('음성인식 오류(' + code + '). 텍스트로 입력하십시오.', true);
      }
      if(typeof api.stt.onError === 'function') api.stt.onError(code);
    };

    rec.onend = ()=>{
      running = false;

      /* 이 recognition 구간의 결과를 딱 한 번만 확정한다. */
      const thisSeq = activeSegmentSeq;
      const finalPiece = getSegmentFinal();
      const piece = finalPiece || segmentInterim;

      if(thisSeq === activeSegmentSeq && piece && !discard){
        sessionText = appendSegment(sessionText, piece);
      }
      resetSegment();

      /* 버튼을 아직 누르고 있다면 다음 구간을 시작한다. */
      if(holding && !stopping && !discard){
        clearTimeout(restartTimer);
        restartTimer = setTimeout(()=>{
          if(!holding || stopping || discard) return;
          resetSegment();
          try{ build().start(); }
          catch(e){ /* Android가 아직 이전 세션을 정리 중이면 다음 이벤트에서 재시도 */ }
          showInterim(sessionText);
        }, 160);
        return;
      }

      stopping = false;
      if(api.state === 'listening') setState('idle');

      const txt = sessionText.trim();
      sessionText = '';
      segmentInterim = '';
      if(discard){
        discard = false;
        showInterim('');
        return;
      }
      showInterim('');

      /* PTT 한 번당 결과 전달은 정확히 한 번 */
      if(!segmentDelivered){
        segmentDelivered = true;
        if(typeof api.stt.onResult === 'function') api.stt.onResult(txt);
      }
    };
    return rec;
  }

  api.stt.start = function(){
    if(!api.stt.supported || api.micDenied) return false;
    if(api.state === 'speaking') api.tts.cancel();

    /* 새로운 PTT 시작 */
    holding = true;
    stopping = false;
    discard = false;
    segmentDelivered = false;
    clearTimeout(restartTimer);
    sessionText = '';
    resetSegment();

    if(running) return true;
    try{
      build().start();
      return true;
    }catch(e){
      if(String(e && e.name) !== 'InvalidStateError'){
        running = false;
        hint('음성인식을 시작할 수 없습니다. 텍스트로 입력하십시오.', true);
        return false;
      }
      return true;
    }
  };

  /* 버튼에서 손을 뗐다. 결과 확정은 onend 한 곳에서만 수행한다. */
  api.stt.stop = function(){
    holding = false;
    stopping = true;
    clearTimeout(restartTimer);

    if(running && rec){
      try{ rec.stop(); }catch(e){
        /* stop 실패 시에도 결과를 직접 전송하지 않는다.
           onend가 최종 확정의 단일 진입점이다. */
      }
      return;
    }

    /* 이미 recognition이 끝난 직후인 경우에는 sessionText가 남아 있을 수 있다.
       이때만 한 번 직접 마무리하되, 이미 전달한 PTT는 절대 재전달하지 않는다. */
    const txt = sessionText.trim();
    sessionText = '';
    stopping = false;
    if(api.state === 'listening') setState('idle');
    showInterim('');
    if(txt && !segmentDelivered){
      segmentDelivered = true;
      if(typeof api.stt.onResult === 'function') api.stt.onResult(txt);
    }
  };

  api.stt.abort = function(){
    holding = false;
    discard = true;
    stopping = false;
    clearTimeout(restartTimer);
    sessionText = '';
    segmentInterim = '';
    segmentResults = new Map();
    segmentDelivered = true;
    if(running && rec){
      try{ rec.abort(); }catch(e){}
    }
    showInterim('');
  };
  api.stt.holding = ()=> holding;
  api.isListening = ()=> api.state === 'listening';

  /* =============== 화면 힌트 =============== */
  function hintEl(){ return document.getElementById('pttHint'); }
  let hintTimer = null;
  function hint(msg, isErr){
    const el = hintEl(); if(!el) return;
    el.className = 'ptt-hint' + (isErr ? ' err' : '');
    el.textContent = msg || '';
    clearTimeout(hintTimer);
    if(msg) hintTimer = setTimeout(()=>{ if(hintEl() === el && el.textContent === msg) refreshHint(); }, 4000);
  }
  function showInterim(t){
    const el = hintEl(); if(!el) return;
    if(!t){ refreshHint(); return; }
    clearTimeout(hintTimer);
    el.className = 'ptt-hint';
    el.innerHTML = '<span class="it">' + esc(t) + '</span>';
  }
  function refreshHint(){
    const el = hintEl(); if(!el) return;
    clearTimeout(hintTimer);
    el.className = 'ptt-hint';
    if(api.state === 'listening')      el.textContent = '듣는 중… 버튼을 누른 채 말씀하십시오';
    else if(api.state === 'speaking')  el.textContent = api.usingMic()
                                          ? '상황실 송신 중 — 누르면 끊고 바로 말할 수 있습니다'
                                          : '상황실 송신 중 — 누르면 즉시 중단합니다';
    else if(!api.usingMic())           el.textContent = api.micReason();
    else                               el.textContent = '';
    const b = document.getElementById('pttBtn');
    if(b) b.classList.toggle('rec', api.state === 'listening');
  }
  api.refreshHint = refreshHint;

  /* 현재 마이크 입력을 쓰는 상태인가 */
  /* micBlocked: 대외비 훈련용 텍스트 전용 모드 — 마이크를 아예 쓰지 않는다 */
  api.usingMic = ()=> !!(api.stt.supported && prefs.sttEnabled && !prefs.micBlocked && !api.micDenied);
  /* 지원 불가 사유 (설정·홈 안내용 — 사용자 on/off와 무관) */
  api.unsupportedReason = function(){
    if(!sttAvailable) return '이 브라우저는 음성인식을 지원하지 않습니다';
    if(!secure)       return '음성인식은 https 접속에서만 작동합니다 (현재 ' + location.protocol + ')';
    if(api.micDenied) return '마이크 권한이 거부되었습니다';
    if(!api.stt.supported) return '이 환경에서는 음성인식을 사용할 수 없습니다';
    return '';
  };
  /* PTT 하단 힌트용 — 사용자가 직접 끈 경우는 안내하지 않는다 */
  api.micReason = function(){
    if(prefs.micBlocked) return '🔒 마이크 차단 중 — 텍스트로만 송신합니다';
    if(!prefs.sttEnabled) return '';
    const r = api.unsupportedReason();
    return r ? (r + ' — 텍스트로 입력하십시오') : '';
  };
  api.hint = function(enabled){
    if(!enabled) return '대기 중';
    return api.usingMic() ? '길게 눌러 말하기' : '눌러서 입력';
  };
  api.whenIdle = whenIdle;

  return api;
})();

/* ---------------------------------------------------------------
   6.6 음성 ↔ 훈련 루프 연결 (기존 함수는 건드리지 않고 여기서 조립)
   --------------------------------------------------------------- */

/* 지휘 대기 카운트다운 일시정지 / 재개 — 사용자가 말하는 동안 시간이 깎이지 않게 */
function pauseAwaitBar(){
  const r = S.run;
  if(!r || !r.bar) return;
  if(r.state === 'await'){ r.awaitLeft = r.bar.left; stopBar(); }
  else if(r.state === 'gap'){ r.gapLeft = r.bar.left; stopBar(); }   // 새 상황 접수 카운트다운도 멈춘다
}
function resumeAwaitBar(){
  const r = S.run;
  if(!r || r.bar) return;
  if(r.state === 'await' && r.awaitStart){
    const left = (typeof r.awaitLeft === 'number') ? r.awaitLeft : r.awaitWindow;
    r.awaitLeft = null;
    r.awaitStart(Math.max(3, Math.round(left)));
  }else if(r.state === 'gap'){
    const left = (typeof r.gapLeft === 'number') ? r.gapLeft : DIFFS[r.diff].gap;
    r.gapLeft = null;
    startGap(Math.max(2, Math.round(left)));
  }
}

/* 인식 결과 확인 단계: 1.2초 노출 후 자동 전송, 탭하면 수정 */
let confirmTimer = null, confirmRAF = null;
function cancelConfirm(){
  clearInterval(confirmRAF); confirmRAF = null;
  clearTimeout(confirmTimer); confirmTimer = null;
  confirmChanges = null;
  const box = document.getElementById('pttConfirm');
  if(box) box.classList.remove('on');
}
let confirmChanges = null, confirmPlain = '';
function showConfirm(text, changes){
  confirmPlain = text;
  const box = document.getElementById('pttConfirm');
  const txt = document.getElementById('confirmText');
  const fill= document.getElementById('confirmFill');
  if(!box || !txt || !fill){ submitCommand(text, changes); return; }
  cancelConfirm();
  confirmChanges = changes || null;
  /* 무엇을 어떻게 알아들었는지 전송 전에 보여준다 */
  txt.innerHTML = esc(text) +
    (changes && changes.length ? `<div class="subs"><span class="hd">기기 인식</span>${changesSummary(changes)}</div>` : '');
  fill.style.width = '0%';
  box.classList.add('on');

  /* 치환이 있었으면 확인할 시간을 조금 더 준다 */
  const DUR = (changes && changes.length) ? 2200 : 1200;
  const t0 = Date.now();
  confirmRAF = setInterval(()=>{
    const p = Math.min(1, (Date.now() - t0) / DUR);
    fill.style.width = (p * 100) + '%';
  }, 60);
  confirmTimer = setTimeout(()=>{
    const ch = confirmChanges;
    cancelConfirm();
    submitCommand(text, ch);
  }, DUR);
}
function editConfirm(){
  const val = confirmPlain || '';
  cancelConfirm();
  const inp = document.getElementById('pttText');
  if(inp){ inp.value = val; inp.focus(); try{ inp.setSelectionRange(val.length, val.length); }catch(e){} }
  resumeAwaitBar();
}

VoiceIO.stt.onResult = function(text){
  const t = (text || '').trim();
  if(!t){ resumeAwaitBar(); VoiceIO.refreshHint(); return; }
  /* 어느 단계에서 말했든 받아준다. 처리 순서는 submitCommand 가 정한다. */
  if(!S.run){ VoiceIO.refreshHint(); return; }
  buzz(15);
  const r = prepareTransmission(t);          // STEP4: 기기 내 교정·약어 치환
  showConfirm(r.text, r.changes);
};
VoiceIO.stt.onError = function(){ resumeAwaitBar(); };

/* PTT 제스처 — 기존 핸들러는 그대로 두고 리스너를 추가로 등록한다 */
(function bindVoicePTT(){
  const btn = document.getElementById('pttBtn');
  if(!btn) return;
  let pressAt = 0, pressing = false;
  const MIN_PRESS = 150;   // 오작동 방지

  btn.addEventListener('contextmenu', e => e.preventDefault());

  btn.addEventListener('pointerdown', e => {
    if(btn.disabled) return;
    cancelConfirm();
    VoiceIO.tts.cancel();                 // barge-in: AI 발화 즉시 중단
    if(!VoiceIO.usingMic()){ VoiceIO.refreshHint(); return; }
    pressing = true; pressAt = Date.now();
    try{ btn.setPointerCapture(e.pointerId); }catch(err){}
    pauseAwaitBar();
    VoiceIO.stt.start();
  });

  function release(cancelled){
    if(!pressing) return;
    pressing = false;
    const dur = Date.now() - pressAt;
    btn.classList.remove('rec');
    if(cancelled || dur < MIN_PRESS){
      VoiceIO.stt.abort();                // 결과 버림
      resumeAwaitBar();
      if(!cancelled) VoiceIO.refreshHint();
    }else{
      VoiceIO.stt.stop();                 // 최종 결과 수신
    }
  }
  btn.addEventListener('pointerup',     ()=> release(false));
  btn.addEventListener('pointercancel', ()=> release(true));
  btn.addEventListener('pointerleave',  ()=> release(false));
})();

/* 확인 단계 버튼 */
(function bindConfirm(){
  const box = document.getElementById('pttConfirm');
  const btn = document.getElementById('confirmEdit');
  if(btn) btn.addEventListener('click', e => { e.stopPropagation(); editConfirm(); });
  if(box) box.addEventListener('click', editConfirm);
})();

/* ---------------------------------------------------------------
   7. 렌더 — 홈
   --------------------------------------------------------------- */
function aggregate(){
  const n = sessions.length;
  const avg = n ? Math.round(sessions.reduce((a,s)=>a+s.score.total,0)/n) : 0;
  const dur = sessions.reduce((a,s)=>a+s.durationSec,0);
  const missCount = {};
  sessions.forEach(s => (s.score.missed||[]).forEach(k => missCount[k]=(missCount[k]||0)+1));
  const top = Object.entries(missCount).sort((a,b)=>b[1]-a[1]).slice(0,3);
  return {n, avg, dur, top};
}
function labelOf(key){
  for(const r of Object.values(ROLES)){
    const it = r.items.find(i=>i.key===key);
    if(it) return it.label;
  }
  return key;
}

      : `<div class="empty">아직 훈련 기록이 없습니다.<br>훈련을 시작해 보세요.</div>`}

                        : (prefs.aiGrading ? '' : `<br><span style="color:#ffb877">AI 채점 꺼짐 — 무전 기록 전문은 전송되지 않습니다.</span>`)}

   8. 렌더 — 훈련 설정

function renderTrainSetup(){
  const cfg = S.cfg;
  const types = allTypes();
  if(!types.some(t=>t.key===cfg.type)) cfg.type = types[0].key;
  const list = scenariosOfType(cfg.type);
  if(!list.length){
    cfg.scenarioId = null;
  }else if(!list.some(s=>s.id===cfg.scenarioId)){
    cfg.scenarioId = list[0].id;
  }

  $('#view-train').innerHTML = `
    <div class="sect">1. 직무 선택 <span style="color:var(--red)">*</span></div>
    <div class="chips" id="roleChips">
      ${Object.entries(ROLES).map(([k,r])=>`<button class="chip grow ${cfg.role===k?'on':''}" data-role="${k}">${r.name}</button>`).join('')}
    </div>
    <div class="muted xsmall" style="margin-top:6px">${esc(ROLES[cfg.role].desc)}</div>

    <div class="sect">2. 상황 유형</div>
    <div class="chips" id="typeChips">
      ${types.map(t=>`<button class="chip ${cfg.type===t.key?'on':''}" data-type="${esc(t.key)}">${t.emoji?esc(t.emoji)+' ':''}${esc(t.name)}${t.origin==='user'?' <span class="pill user" style="margin-left:5px">내가 만든</span>':''}</button>`).join('')}
      <button class="chip" id="mgTypeBtn" style="border-style:dashed">＋ 유형 관리</button>
    </div>

    <div class="sect">3. 시나리오</div>
    <div id="scList">
      ${list.length ? list.map(s=>`
        <button class="sc-item ${cfg.scenarioId===s.id?'on':''}" data-sc="${esc(s.id)}">
          <div class="t">${esc(s.title)}${s.origin==='user'?' <span class="pill user">내가 만든</span>':''}</div>
          <div class="d">${esc(s.detail)}${s.place?`<br><span style="color:#7d8792">📍 ${esc(s.place)} <span style="font-size:11px">(이 기기에만 표시)</span></span>`:''}</div>
        </button>`).join('')
        : `<div class="empty">이 유형에는 아직 시나리오가 없습니다.<br>아래에서 새로 만들어 주세요.</div>`}
      <div style="height:8px"></div>
      <button class="btn ghost sm" id="newScBtn" style="width:100%;border-style:dashed">＋ 이 유형에 새 시나리오 만들기</button>
      <div style="height:6px"></div>
      <button class="btn ghost sm" id="mgScBtn" style="width:100%">내 시나리오 관리 (검색·수정·복제)</button>
    </div>

    <div class="sect">4. 난이도</div>
    <div class="chips" id="diffChips">
      ${Object.entries(DIFFS).map(([k,d])=>`
        <button class="chip grow ${cfg.diff===k?'on':''}" data-diff="${k}" style="flex-direction:column;padding:8px 10px;min-height:60px">
          <span>${d.name}</span><span class="xsmall muted">${d.sub}</span>
        </button>`).join('')}
    </div>
    <div class="muted xsmall" style="margin-top:6px">후속 상황 간격 ${DIFFS[cfg.diff].gap}초 · 지휘 응답 제한 ${respWindowFor(cfg.diff)}초${prefs.respWindowMode==='custom'?' (설정에서 지정)':''}</div>

    <div class="sect">필수 요소 (채점 기준)</div>
    <div class="card">
      ${ROLES[cfg.role].items.map((it,i)=>`<div class="row small" style="min-height:34px"><b style="color:var(--amber);width:20px">${'①②③④⑤'[i]}</b><span>${esc(it.label)}</span></div>`).join('')}
    </div>

    <div style="height:16px"></div>
    <button class="btn primary" id="startRun" style="min-height:64px;font-size:18px" ${cfg.scenarioId?'':'disabled'}>훈련 시작</button>

  $$('#roleChips [data-role]').forEach(b=> b.onclick=()=>{ S.cfg.role=b.dataset.role; buzz(10); renderTrainSetup(); });
  $$('#typeChips [data-type]').forEach(b=> b.onclick=()=>{ S.cfg.type=b.dataset.type; buzz(10); renderTrainSetup(); });
  $$('#scList [data-sc]').forEach(b=> b.onclick=()=>{ S.cfg.scenarioId=b.dataset.sc; buzz(10); renderTrainSetup(); });
  $$('#diffChips [data-diff]').forEach(b=> b.onclick=()=>{ S.cfg.diff=b.dataset.diff; buzz(10); renderTrainSetup(); });

   8.5 내 자료 관리 — 상황유형 / 시나리오 (STEP2 신규)

S.mg = { view:'scenarios', q:'', sort:'recent', edit:null };

function openManage(view){
  S.mg.view = view || 'scenarios';
  S.mg.edit = null;
  setTab('manage');
}
function closeManage(){
  S.mg.edit = null;
  S.trainStage = 'setup';
  setTab('train');
}

function renderManage(){
  if(S.mg.edit) return renderEditor();
  const v = S.mg.view;
  const el = $('#view-manage');

  const head = `
    <div class="mg-head">
      <button class="iconbtn" id="mgBack">‹</button>
      <div class="ttl">내 자료 관리</div>
      ${v!=='docs' ? `<button class="iconbtn" id="mgAdd">＋</button>` : ''}
    </div>
    <div class="chips" style="margin-bottom:12px;flex-wrap:nowrap">
      <button class="chip grow ${v==='types'?'on':''}" data-mgv="types" style="padding:0 8px;font-size:14px">상황유형</button>
      <button class="chip grow ${v==='scenarios'?'on':''}" data-mgv="scenarios" style="padding:0 8px;font-size:14px">시나리오</button>
      <button class="chip grow ${v==='docs'?'on':''}" data-mgv="docs" style="padding:0 8px;font-size:14px">자료</button>
      <button class="chip grow ${v==='terms'?'on':''}" data-mgv="terms" style="padding:0 8px;font-size:14px">용어</button>
    </div>`;

  el.innerHTML = head + (
    v==='types' ? manageTypesBody() :
    v==='docs'  ? manageDocsBody()  :
    v==='terms' ? manageTermsBody() : manageScenariosBody());

  $('#mgBack').onclick = closeManage;
  const add = $('#mgAdd');
  if(add) add.onclick = ()=>{ buzz(10); v==='types' ? openTypeEditor(null) : openScenarioEditor(null, S.cfg.type); };
  $$('#view-manage [data-mgv]').forEach(b=> b.onclick=()=>{ S.mg.view=b.dataset.mgv; S.mg.q=''; buzz(8); renderManage(); });

  if(v==='types') bindTypeList();
  else if(v==='docs') bindDocList();
  else if(v==='terms') bindTermsList();
  else bindScenarioList();
}

/* ---------- 용어: 등록 약어 + 음성 교정 규칙 ---------- */
function manageTermsBody(){
  const abbrs = Array.from(abbrevMap.entries());
  const mine = corrections.filter(c => !c.builtin);
  const base = corrections.filter(c => c.builtin);
  return `
    <div class="okbox" style="margin-bottom:12px">
      🔒 약어 해석과 오인식 교정은 <b>전부 이 기기 안에서</b> 일어납니다.
      바뀐 문장만 AI로 전달되고, 약어집 원문은 나가지 않습니다.
    </div>

    <div class="sect" style="margin-top:0">등록된 약어 (${abbrs.length}개)</div>
    ${abbrs.length ? `
      <div class="abbrev-tbl">
        <div class="r head"><div class="a">약어</div><div class="f">정식 용어</div></div>
        ${abbrs.map(([a, list])=>`<div class="r">
          <div class="a">${esc(a)}</div>
          <div class="f">${esc(list[0].full)}
            ${list.length>1?`<div class="n">뜻 ${list.length}개 — 상황에 따라 자동 선택: ${esc(list.map(x=>x.full).join(' / '))}</div>`:''}
          </div></div>`).join('')}
      </div>
      <div class="muted xsmall" style="margin-top:8px">약어는 <b>자료 탭</b>에서 약어집 파일을 올리면 등록됩니다.</div>
      <div class="warnbox" style="margin-top:10px">두 글자 약어는 일반 낱말과 겹칠 수 있습니다.
        (예: «요구»를 약어로 등록하면 "요구 사항"도 바뀝니다)<br>
        바꾼 내용은 송신 전에 항상 화면에 표시되니, 이상하면 <b>눌러서 고친 뒤</b> 보내십시오.</div>`
      : `<div class="empty">등록된 약어가 없습니다.<br><b>자료</b> 탭에서 무전 약어집을 올려 주세요.</div>`}

    <div class="sect">음성 오인식 교정 규칙</div>
    <div class="notice" style="margin-bottom:10px">
      음성인식이 소방 용어를 잘못 알아들을 때 쓰는 규칙입니다.
      훈련하다 틀리게 인식된 말이 있으면 그때그때 추가하십시오.
    </div>
    <div class="card" style="margin-bottom:12px">
      <label class="f">새 규칙 추가</label>
      <div class="addrule">
        <input class="inp" id="ruleFrom" placeholder="잘못 들린 말" autocomplete="off" maxlength="30">
        <span class="ar">→</span>
        <input class="inp" id="ruleTo" placeholder="올바른 말" autocomplete="off" maxlength="40">
      </div>
      <div style="height:8px"></div>
      <button class="btn sm primary" id="ruleAdd" style="width:100%">규칙 추가</button>
    </div>

    ${mine.length ? `<div class="muted xsmall" style="margin:10px 0 6px">내가 추가한 규칙 ${mine.length}개</div>` +
      mine.map(c=>ruleRow(c)).join('') : ''}

    <div class="muted xsmall" style="margin:14px 0 6px">기본 제공 규칙 ${base.length}개 (필요 없으면 지우셔도 됩니다)</div>
    ${base.map(c=>ruleRow(c)).join('')}
    <div style="height:24px"></div>`;
}
function ruleRow(c){
  return `<div class="rule-item">
    <div class="rr"><span class="from">${esc(c.from)}</span> → <span class="to">${esc(c.to)}</span>
      ${c.builtin?`<div class="meta">기본 제공</div>`:''}</div>
    <button class="x" data-ruledel="${esc(c.id)}">✕</button>
  </div>`;
}
function bindTermsList(){
  const add = $('#ruleAdd');
  if(add) add.onclick = async ()=>{
    const from = ($('#ruleFrom').value || '').trim();
    const to   = ($('#ruleTo').value || '').trim();
    if(!from || !to){ notify('두 칸을 모두 채워 주십시오.', 'err'); return; }
    if(from === to){ notify('같은 말은 규칙이 되지 않습니다.', 'err'); return; }
    if(corrections.some(c => c.from === from)){ notify(`«${from}» 규칙이 이미 있습니다.`, 'err'); return; }
    corrections.unshift({ id:'C'+Date.now(), from, to, builtin:false, enabled:true });
    await saveCorrections();
    buzz(20); notify('규칙을 추가했습니다.', 'ok');
    renderManage();
  };
  $$('#view-manage [data-ruledel]').forEach(b => b.onclick = async ()=>{
    const c = corrections.find(x => x.id === b.dataset.ruledel);
    if(!c) return;
    if(!confirm(`«${c.from} → ${c.to}» 규칙을 삭제합니다. 계속할까요?`)) return;
    corrections = corrections.filter(x => x.id !== c.id);
    await saveCorrections();
    buzz(20); notify('삭제했습니다.', 'ok');
    renderManage();
  });
}

function bindDocList(){
  const f = $('#upFile');
  if(f) f.onchange = async e => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if(file) openUploadModal(file);
  };
  $$('#view-manage [data-docai]').forEach(b => b.onclick = ()=>{
    const d = userDocs.find(x => x.id === b.dataset.docai);
    if(!d) return;
    if(d.aiAllowed){                                   // 끄는 것은 즉시
      setDocAllowed(d.id, false).then(()=>{ buzz(15); notify('전송을 차단했습니다.', 'ok'); renderManage(); });
    }else{
      openAllowModal(d);                               // 켜는 것은 경고 모달을 거친다
    }
  });
  $$('#view-manage [data-docview]').forEach(b => b.onclick = ()=>{
    const d = userDocs.find(x => x.id === b.dataset.docview);
    if(d) openDocViewer(d);
  });
  $$('#view-manage [data-docdel]').forEach(b => b.onclick = async ()=>{
    const d = userDocs.find(x => x.id === b.dataset.docdel);
    if(!d) return;
    if(!confirm(`«${d.name}» 을 삭제합니다. 계속할까요?`)) return;
    await removeDocument(d.id);
    buzz(30); notify('삭제했습니다.', 'ok');
    renderManage();
  });
}

/* ---------- 모달 공용 ---------- */
function openModal(html, bind){
  closeModal();
  const bd = document.createElement('div');
  bd.className = 'modal-bd'; bd.id = 'modalBd';
  bd.innerHTML = `<div class="modal">${html}</div>`;
  bd.addEventListener('click', ev => { if(ev.target === bd) closeModal(); });
  document.body.appendChild(bd);
  if(bind) bind(bd);
}
function closeModal(){
  const bd = document.getElementById('modalBd');
  if(bd) bd.remove();
}

/* ---------- 업로드 모달 (유형 선택 + 파싱 미리보기) ---------- */
function openUploadModal(file){
  let kind = /약어|abbr/i.test(file.name) ? 'abbrev' : (/sop|절차/i.test(file.name) ? 'sop' : 'ref');
  const ext = String(file.name.split('.').pop()||'').toLowerCase();

  const render = async () => {
    let preview = '', parsed = '';
    try{
      const text = await file.text();
      preview = text.slice(0, 600);
      if(kind === 'abbrev'){
        const es = parseAbbrev(text, ext);
        parsed = es.length
          ? `<div class="okbox" style="margin-top:10px">약어 <b>${es.length}개</b>를 인식했습니다.</div>
             <div class="abbrev-tbl">
               <div class="r head"><div class="a">약어</div><div class="f">정식 용어</div></div>
               ${es.slice(0,6).map(e=>`<div class="r"><div class="a">${esc(e.abbr)}</div><div class="f">${esc(e.full)}</div></div>`).join('')}
               ${es.length>6?`<div class="r"><div class="a"></div><div class="f n">외 ${es.length-6}개 …</div></div>`:''}
             </div>`
          : `<div class="warnbox" style="margin-top:10px">약어를 인식하지 못했습니다.<br>
               <b>약어,정식용어,설명</b> 형식(쉼표·탭·= 구분)으로 저장한 뒤 다시 올려 주십시오.<br>
               예: <code>현착,현장 도착,대원이 현장에 도착함</code></div>`;
      }
    }catch(e){ preview = '(미리보기를 읽지 못했습니다)'; }

    openModal(`
      <h3>자료 올리기</h3>
      <div class="muted small" style="margin-bottom:14px">${esc(file.name)} · ${fmtBytes(file.size)}</div>
      <div class="field" style="margin-bottom:12px">
        <label>자료 유형</label>
        <div class="chips">
          ${Object.keys(DOC_KINDS).map(k=>`<button class="chip grow ${kind===k?'on':''}" data-kind="${k}" style="flex-direction:column;min-height:62px;padding:8px 6px">
            <span>${DOC_KINDS[k].emoji} ${DOC_KINDS[k].name}</span></button>`).join('')}
        </div>
        <div class="hint" style="margin-top:8px">${DOC_KINDS[kind].hint}</div>
      </div>
      ${parsed}

const MG_SORTS = [
  {k:'recent', n:'최근 수정순'},
  {k:'name',   n:'이름순'},
  {k:'fav',    n:'즐겨찾기'},
  {k:'used',   n:'많이 쓴 순'}
];
function manageScenarioList(){
  const q = S.mg.q.trim().toLowerCase();
  let list = userScens.slice();
  if(q){
    list = list.filter(s => [s.title, s.overview, s.report, s.hazards, s.place]
      .some(v => String(v||'').toLowerCase().indexOf(q) >= 0));
  }
  const by = S.mg.sort;
  list.sort((a,b)=>{
    if(by==='name') return String(a.title||'').localeCompare(String(b.title||''), 'ko');
    if(by==='used') return (b.usedCount||0) - (a.usedCount||0) || (b.updatedAt||0) - (a.updatedAt||0);
    if(by==='fav')  return (b.favorite?1:0) - (a.favorite?1:0) || (b.updatedAt||0) - (a.updatedAt||0);
    return (b.updatedAt||0) - (a.updatedAt||0);
  });
  return list;
}

  const list = manageScenarioList();
  return `

/* ---------- 시나리오 편집기 (단계별) ---------- */
const SC_STEPS = [
  { t:'기본 정보',  d:'어떤 훈련인지 알아볼 수 있게' },
  { t:'현장 상황',  d:'무엇이 어떻게 벌어졌는지' },
  { t:'조건과 자원', d:'지휘 판단에 영향을 주는 요소' },
  { t:'확인 후 저장', d:'입력한 내용을 확인하십시오' }
];

function blankScenario(typeKey){
  return {
    id:'SC'+Date.now(), typeKey: typeKey || TYPES[0].key,
    title:'', place:'', overview:'', report:'', occupants:'',
    weather:'', hazards:'', resources:'', variants:'',
    favorite:false, usedCount:0, origin:'user',
    createdAt: Date.now(), updatedAt: Date.now()
  };
}
function openScenarioEditor(sc, typeKey){
  S.mg.edit = {
    kind:'scenario', step:0, isNew: !sc,
    data: sc ? Object.assign(blankScenario(typeKey), sc) : blankScenario(typeKey)
  };
  setTab('manage');
  if(!sc) checkDraft();
}
async function checkDraft(){
  const d = await loadDraft();
  if(!d || d.kind !== 'scenario' || !d.data) return;
  const t = String(d.data.title||'').trim();
  const has = t || String(d.data.overview||'').trim();
  if(!has) { clearDraft(); return; }
  if(!S.mg.edit || !S.mg.edit.isNew) return;
  S.mg.edit.draft = d;
  renderEditor();
}

function renderEditor(){
  if(S.mg.edit.kind === 'type') return renderTypeEditor();
  const e = S.mg.edit, d = e.data, step = e.step;

  const body = [scEditStep0, scEditStep1, scEditStep2, scEditStep3][step](d);

  $('#view-manage').innerHTML = `
    <div class="mg-head">
      <button class="iconbtn" id="edBack">‹</button>
      <div class="ttl">${e.isNew?'새 시나리오':'시나리오 수정'}</div>
      <span class="badge">${step+1}/4</span>
    </div>
    <div class="steps">${SC_STEPS.map((s,i)=>`<i class="${i===step?'on':(i<step?'done':'')}"></i>`).join('')}</div>
    <div class="stepttl"><b>${SC_STEPS[step].t}</b>${SC_STEPS[step].d}</div>
    ${e.draft ? `<div class="draft-bar">
        작성하다 만 내용이 있습니다 (${fmtDate(e.draft.savedAt)}).
        <div style="height:8px"></div>
        <div class="row" style="gap:8px">
          <button class="btn sm" id="draftUse" style="flex:1">이어서 작성</button>
          <button class="btn sm ghost" id="draftDrop" style="flex:1">새로 시작</button>
        </div>
      </div>` : ''}
    ${body}
    <div class="navrow">
      ${step>0 ? `<button class="btn ghost" id="edPrev">이전</button>` : `<button class="btn ghost" id="edCancel">취소</button>`}
      ${step<3 ? `<button class="btn primary" id="edNext">다음</button>`
               : `<button class="btn primary" id="edSave">저장</button>`}
    </div>
    ${(!e.isNew && step===3) ? `
      <div style="height:10px"></div>
      <button class="btn ghost" id="edDup">이 시나리오 복제해서 새로 만들기</button>
      <div style="height:8px"></div>
      <button class="btn danger" id="edDel">삭제</button>` : ''}
    <div style="height:28px"></div>`;

  bindEditorFields(d);

  $('#edBack').onclick = ()=>{
    if(step>0){ e.step--; renderEditor(); return; }
    if(hasContent(d) && !confirm('작성 중인 내용이 임시저장됩니다. 목록으로 돌아갈까요?')) return;
    S.mg.edit=null; S.mg.view='scenarios'; renderManage();
  };
  const cancel = $('#edCancel');
  if(cancel) cancel.onclick = ()=>{
    if(hasContent(d) && !confirm('작성 중인 내용이 임시저장됩니다. 나가시겠습니까?')) return;
    S.mg.edit=null; S.mg.view='scenarios'; renderManage();
  };
  const prev = $('#edPrev'); if(prev) prev.onclick = ()=>{ e.step--; buzz(8); renderEditor(); };
  const next = $('#edNext'); if(next) next.onclick = ()=>{
    if(step===0 && !String(d.title||'').trim()){ notify('시나리오 이름을 입력해 주십시오.', 'err'); return; }
    if(step===1 && !String(d.overview||'').trim()){ notify('대상물 개요를 입력해 주십시오.', 'err'); return; }
    e.step++; buzz(8); renderEditor(); window.scrollTo(0,0);
  };
  const save = $('#edSave'); if(save) save.onclick = ()=> saveScenario();
  const dup  = $('#edDup');  if(dup)  dup.onclick  = ()=>{
    const copy = Object.assign({}, d, {
      id:'SC'+Date.now(), title: (d.title||'') + ' (복제)',
      favorite:false, usedCount:0, createdAt:Date.now(), updatedAt:Date.now()
    });
    S.mg.edit = { kind:'scenario', step:0, isNew:true, data:copy };
    buzz(15); notify('복제했습니다. 내용을 수정한 뒤 저장하십시오.');
    renderEditor(); window.scrollTo(0,0);
  };
  const del = $('#edDel'); if(del) del.onclick = async ()=>{
    if(!confirm(`«${d.title||'제목 없음'}» 시나리오를 삭제합니다. 계속할까요?`)) return;
    await Store.remove('scenarios', d.id);
    await loadUserData();
    buzz(30); notify('삭제했습니다.', 'ok');

/* 사용 횟수 집계 */
function bumpUsage(id){
  const u = userScens.find(s=>s.id===id);
  if(!u) return;

  u.updatedAt = Date.now();

/* ---------------------------------------------------------------
   9. 훈련 진행 — 상태 머신
      states: brief(상황부여) → await(지휘대기) → judge(AI판정) → gap(대기타이머) → …
   --------------------------------------------------------------- */
const TOTAL_TURNS_MIN = 5;

function startRun(){
  const sc = scenarioById(S.cfg.scenarioId);
  if(!sc){ notify('시나리오를 선택해 주십시오.', 'err'); return; }
  bumpUsage(sc.id);                       // STEP2: 사용자 시나리오 사용 횟수 집계
  const d = DIFFS[S.cfg.diff];
  S.run = {
    id: 'S'+Date.now(),
    role:S.cfg.role, diff:S.cfg.diff, scenario:sc,
    startedAt: Date.now(), elapsed:0,
    turn:0, totalTurns: Math.min(sc.turns.length+1, 6),
    worseIdx:0, noResponse:0,
    log:[],                 // {who:'dispatch'|'me'|'sys', text, ts}
    myTexts:[],
    checkedAll:new Set(), missedAll:new Set(),
    state:'idle', timers:{}
  };
  S.trainStage='run';
  renderTrainRun();
  setTab('train');
  buzz(30);

  // 최초 상황 부여
  const f = sc.facts;
  pushLog('dispatch', `상황실입니다. ${sc.detail} 출동대 현장 도착했습니다. ${ROLES[S.cfg.role].name}님, 지휘 바랍니다.`);
  startAwait();
  startClock();
}

function pushLog(who, text){
  S.run.log.push({who, text, ts:Date.now()});
  if(who==='me') S.run.myTexts.push(text);
  renderLog();
  if(who==='dispatch') VoiceIO.tts.speak(text);   // 2단계 추가: 상황실 메시지 음성 출력
}

function startClock(){
  clearInterval(S.run.timers.clock);
  S.run.timers.clock = setInterval(()=>{
    if(!S.run) return;
    S.run.elapsed = Math.floor((Date.now()-S.run.startedAt)/1000);
    const el = $('#clock'); if(el) el.textContent = mmss(S.run.elapsed);
  }, 1000);
}

/* 지휘 응답 대기 (제한시간 내 미송신 → 악화 상황) */
function startAwait(){
  const r = S.run; if(!r) return;
  r.state='await';

  // 응답 없음 처리 (기존 로직 그대로)
  const onTimeout = ()=>{
    const rr = S.run; if(!rr) return;
    rr.noResponse++;
    pushLog('sys', '⚠ 지휘 응답 없음 — 상황이 악화됩니다');
    buzz([40,60,40]);
    const w2 = rr.scenario.worse[rr.worseIdx % rr.scenario.worse.length]; rr.worseIdx++;
    rr.turn++;
    pushLog('dispatch', w2);
    /* STEP5: 무응답도 인과의 하나 — 추이에 남겨 다음 전개에 반영한다 */
    rr.trends = rr.trends || [];
    rr.trends.push({ trend:'worsening', reason:'지휘 응답이 없어 조치가 이루어지지 않음' });
    const lw = rr.log[rr.log.length-1];
    if(lw) lw.trend = { trend:'worsening', reason:'지휘 응답이 없어 필요한 조치가 이루어지지 않았습니다.' };
    renderLog();
    if(rr.turn >= rr.totalTurns) return finishRun();
    startAwait();
  };

  // 2단계: 제한시간을 설정값에서 읽고, 일시정지/재개가 가능하도록 시작 함수를 보관
  r.awaitWindow = respWindowFor(r.diff);
  r.awaitLeft   = null;
  r.awaitStart  = sec => { if(S.run === r && r.state==='await') runBar('지휘 응답 대기 — 송신하십시오', sec, true, onTimeout); };

  setPTTEnabled(true);

  // AI 발화가 끝난 뒤 카운트다운 시작 (설정에서 끌 수 있음)
  if(prefs.waitAfterSpeech && VoiceIO.state !== 'idle'){
    VoiceIO.whenIdle(()=>{ if(S.run === r && r.state==='await' && !r.bar) r.awaitStart(r.awaitWindow); });
  }else{
    r.awaitStart(r.awaitWindow);
  }
}

/* 대기 중 부여할 상황을 줄 세운다.
   지휘관이 대기 중에 먼저 송신하면 그 송신을 먼저 처리하고,
   밀린 상황은 그 다음에 순서대로 부여한다. */
function enqueueSituation(text, trend){
  const r = S.run; if(!r || !text) return;
  r.sitQueue = r.sitQueue || [];
  r.sitQueue.push({ text, trend: trend || null });
}
function deliverSituation(){
  const r = S.run; if(!r) return false;
  r.sitQueue = r.sitQueue || [];
  let item = r.sitQueue.shift();
  if(!item){
    const idx = Math.min(Math.max(r.turn-1, 0), r.scenario.turns.length-1);
    item = { text: r.scenario.turns[idx], trend: r.pendingTrend || null };
    r.pendingTrend = null;
  }
  pushLog('dispatch', item.text);
  if(item.trend){
    const last = r.log[r.log.length-1];
    if(last) last.trend = item.trend;
    renderLog();
  }
  buzz(25);
  return true;
}

/* 후속 상황까지의 대기 — 이 동안에도 마이크는 살아 있다 */
function startGap(sec){
  const r = S.run; if(!r) return;
  r.state='gap';
  setPTTEnabled(true);                                       // ← 대기 중에도 송신 가능
  const ti=$('#turnInd'); if(ti) ti.textContent = Math.min(r.turn+1, r.totalTurns);
  runBar('현장에서 새로운 상황 접수 중... (지금 송신해도 됩니다)', sec || DIFFS[r.diff].gap, false, ()=>{
    if(!S.run) return;
    if(r.turn >= r.totalTurns) return finishRun();
    deliverSituation();
    startAwait();
  });
}

/* 진행바 공용 */
function runBar(caption, seconds, urgent, done){
  const r = S.run; if(!r) return;
  clearInterval(r.timers.bar);
  r.bar = {caption, total:seconds, left:seconds, urgent};
  renderWait();
  r.timers.bar = setInterval(()=>{
    if(!S.run){ clearInterval(r.timers.bar); return; }
    r.bar.left = Math.max(0, r.bar.left - 0.1);
    updateWaitBar();
    if(r.bar.left <= 0){ clearInterval(r.timers.bar); r.bar=null; renderWait(); done(); }
  }, 100);
}
function stopBar(){ if(S.run){ clearInterval(S.run.timers.bar); S.run.bar=null; renderWait(); } }

function renderTrainRun(){
  const r = S.run, sc = r.scenario;

    <div class="run-head">

        <div class="mt">${ROLES[r.role].name} · ${DIFFS[r.diff].name} · <span id="turnInd">1</span>/${r.totalTurns}턴${

        }${prefs.micBlocked ? ' · <span style="color:var(--ok)">🔒 마이크차단</span>' : ''}${

function renderLog(){
  const box = $('#log'); if(!box || !S.run) return;
  box.innerHTML = S.run.log.map(m=>{
    const who = m.who==='dispatch' ? '상황실 / 현장' : m.who==='me' ? '나 (지휘)' : '';
    if(m.who==='sys') return `<div class="msg sys">${esc(m.text)}</div>`;
    return `<div class="msg ${m.who}"><span class="who">${who}</span>${trendBadge(m.trend)}${esc(m.text)}${
      m.changes && m.changes.length ? `<div class="subs"><span class="hd">기기 인식</span>${changesSummary(m.changes)}</div>` : ''
    }</div>`;
  }).join('');
  const t = $('#turnInd'); if(t) t.textContent = Math.min(S.run.turn+1, S.run.totalTurns);
  window.scrollTo({top:document.body.scrollHeight, behavior:'smooth'});
}

function renderWait(){
  const z = $('#waitZone'); if(!z || !S.run) return;
  const b = S.run.bar;
  if(!b){ z.innerHTML=''; return; }
  z.innerHTML = `
    <div class="waitbar">
      <div class="cap"><span>${esc(b.caption)}</span><span id="barLeft">${Math.ceil(b.left)}초</span></div>
      <div class="track ${b.urgent?'urgent':''}"><i id="barFill" style="width:${b.urgent? (b.left/b.total*100) : (100-b.left/b.total*100)}%"></i></div>
    </div>`;
}
function updateWaitBar(){
  const b = S.run && S.run.bar; if(!b) return;
  const fill = $('#barFill'), left = $('#barLeft');
  if(fill) fill.style.width = (b.urgent ? (b.left/b.total*100) : (100-b.left/b.total*100)) + '%';
  if(left) left.textContent = Math.ceil(b.left)+'초';
}

/* 송신 처리
   changes: STEP4에서 추가한 선택 인자 — 기기 내 약어 치환 내역(표시용) */
function submitCommand(text, changes){
  const r = S.run;
  if(!r) return;
  text = (text||'').trim();
  if(!text) return;

  /* 상황실이 판정 중이면 지금 처리할 수 없다. 버리지 말고 줄을 세워
     판정이 끝나는 즉시 이어서 처리한다. */
  if(r.state === 'judge'){
    r.queuedCommand = { text, changes };
    notify('송신을 접수했습니다. 상황실 응답 직후 처리됩니다.', null, 3000);
    return;
  }
  /* 새 상황을 기다리는 중이라도 송신이 우선이다.
     대기 타이머를 멈추고, 아직 부여하지 않은 상황은 줄에 그대로 남겨 둔다. */
  if(r.state === 'gap'){
    stopBar();
    r.state = 'await';
  }
  if(r.state !== 'await') return;
  stopBar();
  VoiceIO.tts.cancel();                                 // 상황실이 말하는 중이면 즉시 멈추고 내 송신을 받는다
  buzz(20);
  pushLog('me', text);
  if(changes && changes.length){                        // 로그 항목에 치환 내역을 붙인다
    const last = r.log[r.log.length-1];
    if(last && last.who === 'me'){ last.changes = changes; renderLog(); }
  }

  r.state='judge';
  const th = document.createElement('div');
  th.className='msg thinking';
  th.textContent = AIRadio.enabled() ? '상황실 응답 중... (AI 판정)' : '상황실 응답 중...';
  $('#log').appendChild(th);
  window.scrollTo({top:document.body.scrollHeight, behavior:'smooth'});

  // 3단계: AI 판정 우선, 실패 시 로컬 판정으로 자동 폴백
  const t0 = Date.now();
  judgeTurn(text, r.role, r.scenario, r.turn, r).then(res=>{
    if(!S.run || S.run !== r) return;                       // 도중에 훈련이 끝났으면 폐기
    const wait = Math.max(0, 500 - (Date.now() - t0));      // 너무 즉답이면 부자연스러우므로 최소 대기
    setTimeout(()=>{
      if(!S.run || S.run !== r) return;
      (res.checked_items||[]).forEach(k=>r.checkedAll.add(k));
      r.missedAll = new Set(ROLES[r.role].items.map(i=>i.key).filter(k=>!r.checkedAll.has(k)));
      if(res._ai) r.aiTurns = (r.aiTurns||0) + 1;
      /* STEP5: 지휘 결과에 따른 상황 추이를 기록해 다음 턴 인과에 이어 쓴다 */
      let tr = null;
      if(res.situation_trend){
        tr = { trend: res.situation_trend, reason: res.trend_reason || '' };
        r.trends = r.trends || [];
        r.trends.push(tr);
      }
      th.remove();
      pushLog('dispatch', res.radio_reply);          // 복명복창
      /* 새 후속 상황은 줄 맨 뒤에 붙인다. 앞서 밀린 상황이 있으면 그것이 먼저 나간다. */
      if(res.next_situation) enqueueSituation(res.next_situation, tr);
      else r.pendingTrend = tr;
      r.turn++;
      if(r.turn >= r.totalTurns) return finishRun();

      /* 판정 중에 들어온 송신이 있으면 그것부터 처리한다 */
      const queued = r.queuedCommand; r.queuedCommand = null;
      if(queued){
        r.state = 'await';
        submitCommand(queued.text, queued.changes);
        return;
      }
      startGap();
    }, wait);
  });
}

function setPTTEnabled(on){
  const b=$('#pttBtn'), i=$('#pttText'), s=$('#pttSend');
  if(!b) return;
  /* 훈련이 돌아가는 동안 마이크는 언제나 살아 있어야 한다.
     상황실이 말하는 중이든 새 상황을 기다리는 중이든, 지휘관은
     끼어들어 지시할 수 있어야 실제 무전과 같다. */
  const live = !!S.run;
  const enable = on || live;
  b.disabled=!enable; i.disabled=!enable; s.disabled=!enable;
  $('#pttSub').textContent = VoiceIO.hint(enable);
  if(!enable){ cancelConfirm(); VoiceIO.stt.abort(); }
  VoiceIO.refreshHint();
}

/* ---------------------------------------------------------------
   10. 종료 및 결과 리포트
   --------------------------------------------------------------- */
function finishRun(){
  const r = S.run; if(!r) return;
  clearInterval(r.timers.clock); clearInterval(r.timers.bar);
  VoiceIO.tts.cancel(); VoiceIO.stt.abort(); cancelConfirm();   // 2단계: 음성 정리
  $('#pttDock').classList.remove('on');

  const items = ROLES[r.role].items;
  const checked = items.map(i=>i.key).filter(k=>r.checkedAll.has(k));
  const missed  = items.map(i=>i.key).filter(k=>!r.checkedAll.has(k));
  const base = Math.round(checked.length/items.length*70);
  const radio = radioRuleScore(r.myTexts);
  const rel = relevanceScore(r.myTexts, r.scenario);
  let total = base+radio+rel;
  total = Math.max(0, total - r.noResponse*5);  // 무응답 패널티

  const sess = {
    id:r.id, role:r.role, diff:r.diff,
    scenarioId:r.scenario.id, scenarioTitle:r.scenario.title,
    startedAt:r.startedAt, durationSec:Math.max(1, Math.floor((Date.now()-r.startedAt)/1000)),
    log:r.log.slice(),
    score:{ total, base, radio, rel, checked, missed, noResponse:r.noResponse, itemCount:items.length },
    review: buildReview(r, checked, missed, total),
    modelText: modelTransmission(r.role, r.scenario)
  };
  sess.aiTurns = r.aiTurns || 0;
  /* AI 채점을 끄면 무전 로그가 외부로 나가지 않는다 (보안 감사 승인 사항) */
  sess.aiPending = AIRadio.enabled() && prefs.aiGrading && sess.log.some(l=>l.who==='me');
  sessions.push(sess);
  persistSession(sess);          // 4단계-STEP1: IndexedDB 영구 저장
  S.run = null;
  S.trainStage='result';
  S.viewingSession = sess.id;
  renderResult(sess);
  buzz([30,50,30]);
  if(sess.aiPending) enhanceSessionWithAI(sess);   // 3단계: AI 채점·총평 (비동기, 실패해도 로컬 결과 유지)
}

/* AI 총평으로 결과를 덮어쓴다. 실패하면 로컬 채점 결과가 그대로 남는다. */
async function enhanceSessionWithAI(sess){
  try{
    const r = await AIRadio.evaluate(sess);
    const items   = ROLES[sess.role].items;
    const checked = sanitizeItems(sess.role, r.checked_items);
    const missed  = items.map(i=>i.key).filter(k=>!checked.includes(k));
    const base    = Math.round(checked.length / items.length * 70);
    const radio   = Math.max(0, Math.min(20, parseInt(r.radio_score, 10) || 0));
    const rel     = Math.max(0, Math.min(10, parseInt(r.relevance_score, 10) || 0));

    sess.score.checked = checked;
    sess.score.missed  = missed;
    sess.score.base    = base;
    sess.score.radio   = radio;
    sess.score.rel     = rel;
    sess.score.total   = Math.max(0, base + radio + rel - sess.score.noResponse * 5);
    if(String(r.review||'').trim())             sess.review    = String(r.review).trim();
    if(String(r.model_transmission||'').trim()) sess.modelText = String(r.model_transmission).trim();
    /* STEP5: SOP 근거 — 화이트리스트 검증을 거친 요소만 남긴다 */
    const valid = items.map(i=>i.key);
    sess.sopNotes = (Array.isArray(r.sop_notes) ? r.sop_notes : [])
      .map(n => ({ item: String((n && n.item) || '').trim(), basis: String((n && n.basis) || '').trim() }))
      .filter(n => n.basis && (valid.indexOf(n.item) >= 0 || n.item === ''))
      .slice(0, 8);
    sess.referenceUsed = (r.reference_used === 'uploaded_sop') ? 'uploaded_sop' : 'general_principle';
    sess.sopLabel = String(prefs.sopLabel || '').trim();
    sess.aiGraded = true;
  }catch(e){
    AIRadio.lastError = safeErr(e);
    logSafe('AIRadio.evaluate', AIRadio.lastError);
    sess.aiError = AIRadio.lastError;
  }finally{
    sess.aiPending = false;
    persistSession(sess);        // 채점 결과까지 반영해 다시 저장
    if(S.tab==='train' && S.trainStage==='result' && S.viewingSession===sess.id) renderResult(sess);
    else if(S.tab==='log' && S.viewingSession===sess.id) renderSessionDetail(sess);
    else if(S.tab==='home') renderHome();
  }
}

function buildReview(r, checked, missed, total){
  const lines=[];
  lines.push(total>=85 ? '전반적으로 체계적인 지휘였습니다.' : total>=70 ? '기본 골격은 갖췄으나 일부 요소가 빠졌습니다.' : '필수 요소 누락이 많습니다. 표준 양식부터 숙달이 필요합니다.');
  if(missed.length) lines.push(`특히 ${missed.map(labelOf).join(', ')} 항목이 확인되지 않았습니다.`);
  if(r.noResponse) lines.push(`지휘 응답 없음이 ${r.noResponse}회 발생했습니다. 판단이 늦어지면 상황은 계속 악화됩니다.`);
  if(r.myTexts.length && r.myTexts.reduce((a,t)=>a+t.length,0)/r.myTexts.length > 200) lines.push('무전 문장이 깁니다. 핵심만 2~3문장으로 끊어 송신하십시오.');
  if(!/이상|바랍니다|바람/.test(r.myTexts.join(' '))) lines.push('무전 종료어(이상)와 복창 유도 표현을 사용하십시오.');
  return lines.join(' ');
}

/* STEP5: SOP 근거 블록 (결과 화면·기록 상세 공용) */
function sopNotesBlock(s){
  if(!s.sopNotes || !s.sopNotes.length) return '';
  const ref = s.referenceUsed === 'uploaded_sop'
    ? `<span class="refbadge doc">✅ 올린 SOP 문서를 근거로 사용${s.sopLabel?` · ${esc(s.sopLabel)}`:''}</span>`
    : `<span class="refbadge gen">일반 원칙 기준 — 조문 인용 없음${s.sopLabel?` · 기준: ${esc(s.sopLabel)}`:''}</span>`;
  return `
    <div class="sect">근거 (왜 필요한가)</div>
    <div class="card">
      ${s.sopNotes.map(n=>`<div class="sop-note">
        ${n.item?`<div class="si">${esc(labelOf(n.item))}</div>`:''}
        <div class="sb">${esc(n.basis)}</div>
      </div>`).join('')}
      ${ref}
      ${s.referenceUsed !== 'uploaded_sop'
        ? `<div class="muted xsmall" style="margin-top:8px">현행 개정본의 구체 조문으로 확인하시려면 설정 ▸ 자료에서 <b>SOP 원문을 올리고 전송을 허용</b>하십시오.</div>` : ''}
    </div>`;
}
function gradeBadge(s){
  if(s.aiPending) return `<span class="badge">AI 채점 중…</span>`;
  if(s.aiGraded)  return `<span class="badge red">AI 채점 · ${esc(prefs.model)}</span>`;
  if(s.aiError)   return `<span class="badge">로컬 임시 채점 (AI 오류: ${esc(String(s.aiError).slice(0,40))})</span>`;
  if(prefs.aiOffline) return `<span class="badge">로컬 채점 · 🔒 오프라인 훈련 모드</span>`;
  if(!prefs.aiGrading) return `<span class="badge">로컬 채점 · AI 채점 꺼짐</span>`;
  return `<span class="badge">로컬 임시 채점 · API 키 미설정</span>`;
}
function bar(label, val, max, note){
  return `<div class="bar-row">

  </div>`;
}

      </div>

        이는 브라우저가 제공하는 기능이라 앱에서 막을 수 없습니다.<br>
