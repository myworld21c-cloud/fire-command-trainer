<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0e0f12">
<!-- ============================================================
     보안: 콘텐츠 보안 정책 (CSP)
     · connect-src 를 Gemini 한 곳으로 못박아, 코드가 어떻게 바뀌든
       그 외 주소로는 데이터를 내보낼 수 없게 한다. (유출·백도어 차단)
     · 외부 스크립트/프레임/플러그인을 원천 금지한다.
     · 이 앱은 외부 리소스를 하나도 쓰지 않는다. 필요해지더라도 여기를
       먼저 열어야 하므로, 무심코 외부 코드가 섞여드는 일을 막는다.
     ============================================================ -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' 'unsafe-inline';
  style-src 'self' 'unsafe-inline';
  img-src 'self' data:;
  font-src 'self';
  connect-src 'self' https://generativelanguage.googleapis.com;
  media-src 'none';
  object-src 'none';
  frame-src 'none';
  worker-src 'none';
  base-uri 'none';
  form-action 'none';
">
<meta name="referrer" content="no-referrer">
<title>지휘멘트 훈련</title>
<meta name="description" content="소방 현장지휘관 지휘멘트 반복 숙달 훈련 앱">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="지휘멘트 훈련">
<style>
/* ============================================================
   디자인 토큰 — 다크 테마 / 소방 레드 / 야간·장갑 착용 고려
   ============================================================ */
:root{
  --bg:#0e0f12;
  --surface:#171a20;
  --surface-2:#1f242c;
  --line:#2b323c;
  --red:#E23B3B;
  --red-dim:#8f2020;
  --amber:#F5842B;
  --text:#EDEFF2;
  --muted:#98A1AD;
  --ok:#3FBF6A;
  --nav-h:64px;
  --tap:56px;          /* 최소 터치 영역 */
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR","Malgun Gothic",sans-serif;
  font-size:16px;line-height:1.5;overscroll-behavior:none;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}

#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;position:relative}

/* ---------- 상단 바 ---------- */
.topbar{
  position:sticky;top:0;z-index:20;background:rgba(14,15,18,.94);backdrop-filter:blur(8px);
  padding:calc(var(--sat) + 10px) 16px 10px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;min-height:52px;
}
.topbar h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.3px}
.topbar .spacer{flex:1}
.badge{font-size:12px;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.badge.red{background:rgba(226,59,59,.15);color:#ff8f8f;border-color:var(--red-dim)}

/* ---------- 뷰 ---------- */
main{flex:1;padding:16px 16px calc(var(--nav-h) + var(--sab) + 24px)}
.view{display:none;animation:fade .18s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- 공통 컴포넌트 ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.card + .card{margin-top:12px}
.sect{margin:22px 0 10px;font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.4px}
.sect:first-child{margin-top:6px}
.row{display:flex;align-items:center;gap:10px}
.muted{color:var(--muted)}
.small{font-size:13px}
.xsmall{font-size:12px}

.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  min-height:var(--tap);padding:0 18px;border-radius:12px;
  background:var(--surface-2);border:1px solid var(--line);font-weight:600;width:100%;
}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{background:transparent}
.btn.danger{background:transparent;border-color:var(--red-dim);color:#ff8f8f}
.btn.sm{min-height:44px;font-size:14px;padding:0 14px;width:auto}
.btn[disabled]{opacity:.45;pointer-events:none}

.big-start{
  min-height:120px;border-radius:18px;background:linear-gradient(160deg,#E23B3B,#a82323);
  color:#fff;font-size:22px;font-weight:800;letter-spacing:-.5px;flex-direction:column;gap:4px;
  box-shadow:0 8px 30px rgba(226,59,59,.28);border:0;
}
.big-start small{font-weight:500;font-size:13px;opacity:.9}

/* 통계 카드 */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center}
.stat b{display:block;font-size:22px;font-weight:800;letter-spacing:-.5px}
.stat span{font-size:11px;color:var(--muted)}

/* 리스트 */
.list-item{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:var(--tap);
}
.list-item + .list-item{margin-top:8px}
.list-item .grow{flex:1;min-width:0}
.list-item .t{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-item .s{font-size:12px;color:var(--muted);margin-top:2px}
.score-chip{font-weight:800;font-size:18px;min-width:46px;text-align:right}

/* 선택 칩 */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  padding:0 14px;min-height:48px;display:flex;align-items:center;border-radius:12px;
  background:var(--surface);border:1px solid var(--line);font-size:15px;font-weight:600;
}
.chip.on{background:rgba(226,59,59,.16);border-color:var(--red);color:#ffb2b2}
.chip.grow{flex:1;justify-content:center}

/* 시나리오 선택 카드 */
.sc-item{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.sc-item + .sc-item{margin-top:8px}
.sc-item.on{border-color:var(--red);background:rgba(226,59,59,.1)}
.sc-item .t{font-weight:700;font-size:15px}
.sc-item .d{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.45}

/* 폼 */
label.f{display:block;font-size:13px;color:var(--muted);margin:0 0 6px}
.inp,select.inp{
  width:100%;min-height:var(--tap);background:var(--surface-2);border:1px solid var(--line);
  border-radius:12px;padding:0 14px;outline:none;
}
.inp:focus{border-color:var(--red)}
textarea.inp{padding:12px 14px;min-height:80px;resize:none;line-height:1.5}
.switch{display:flex;align-items:center;justify-content:space-between;min-height:var(--tap);gap:12px}
.switch .lbl{font-weight:600;font-size:15px}
.toggle{width:56px;height:32px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);position:relative;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#6b7480;transition:.16s}
.toggle.on{background:rgba(226,59,59,.3);border-color:var(--red)}
.toggle.on::after{left:27px;background:var(--red)}
.range{width:100%;accent-color:var(--red);height:44px}

/* ---------- 훈련 진행 ---------- */
.run-head{
  position:sticky;top:0;z-index:15;margin:-16px -16px 12px;padding:10px 14px;
  background:rgba(14,15,18,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;
}
.run-head .info{flex:1;min-width:0}
.run-head .nm{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.run-head .mt{font-size:11px;color:var(--muted)}
.clock{font-variant-numeric:tabular-nums;font-weight:800;font-size:19px;letter-spacing:-.5px}

#log{display:flex;flex-direction:column;gap:10px;padding-bottom:8px}
.msg{border-radius:12px;padding:11px 13px;font-size:15px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.msg .who{display:block;font-size:11px;font-weight:700;letter-spacing:.5px;margin-bottom:4px;opacity:.85}
.msg.dispatch{background:rgba(245,132,43,.08);border:1.5px solid var(--amber);color:#ffe3c9}
.msg.dispatch .who{color:var(--amber)}
.msg.me{background:var(--surface-2);border:1px solid var(--line);margin-left:28px}
.msg.me .who{color:var(--muted)}
.msg.sys{background:transparent;border:1px dashed var(--red-dim);color:#ff9a9a;font-size:13px;text-align:center;padding:8px}
.msg.thinking{background:var(--surface);border:1px solid var(--line);color:var(--muted);font-size:14px}

.waitbar{margin-top:4px}
.waitbar .cap{font-size:12px;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between}
.track{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.track > i{display:block;height:100%;background:var(--amber);width:0%;transition:width .2s linear}
.track.urgent > i{background:var(--red)}

/* PTT 영역 — 화면 하단 1/4 */
.ptt-dock{
  position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + var(--sab));z-index:18;
  max-width:560px;margin:0 auto;padding:10px 16px 12px;
  background:linear-gradient(to top,var(--bg) 55%,rgba(14,15,18,0));
  display:none;
}
.ptt-dock.on{display:block}
.ptt-wrap{display:flex;flex-direction:column;align-items:center;gap:8px}
.ptt{
  width:min(25vh,150px);height:min(25vh,150px);border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#f05a5a,#c02626 70%);
  color:#fff;font-weight:800;font-size:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  box-shadow:0 0 0 6px rgba(226,59,59,.16),0 10px 28px rgba(0,0,0,.5);
  border:0;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
}
.ptt small{font-size:11px;font-weight:600;opacity:.9}
.ptt.active{background:radial-gradient(circle at 35% 30%,#ff8080,#e23b3b 70%);box-shadow:0 0 0 12px rgba(226,59,59,.25)}
.ptt[disabled]{filter:grayscale(.6);opacity:.5}
.ptt-input{display:flex;gap:8px;width:100%}
.ptt-input .inp{flex:1;min-height:52px}
.ptt-input .btn{width:auto;min-width:76px;min-height:52px}

/* ---- 2단계 추가: 음성 상태 UI ---- */
.ptt.rec{
  background:radial-gradient(circle at 35% 30%,#ff9a9a,#e23b3b 70%);
  animation:pttPulse 1.1s ease-out infinite;
}
@keyframes pttPulse{
  0%{box-shadow:0 0 0 8px rgba(226,59,59,.35),0 10px 28px rgba(0,0,0,.5)}
  70%{box-shadow:0 0 0 26px rgba(226,59,59,0),0 10px 28px rgba(0,0,0,.5)}
  100%{box-shadow:0 0 0 8px rgba(226,59,59,0),0 10px 28px rgba(0,0,0,.5)}
}
.ptt-hint{
  min-height:20px;font-size:13px;color:var(--muted);text-align:center;line-height:1.4;
  width:100%;padding:0 4px;word-break:break-word;
}
.ptt-hint.err{color:#ff9a9a}
.ptt-hint .it{color:#c8ced6}
.ptt-confirm{
  display:none;width:100%;background:var(--surface);border:1px solid var(--amber);
  border-radius:12px;padding:10px 12px;
}
.ptt-confirm.on{display:block}
.ptt-confirm .ct{font-size:15px;line-height:1.45;word-break:break-word}
.ptt-confirm .cc{display:flex;align-items:center;gap:10px;margin-top:8px}
.ptt-confirm .cc .track{flex:1}
.ptt-confirm .cc .track > i{background:var(--amber);transition:width .1s linear}
.ptt-confirm .cbtn{font-size:13px;font-weight:700;color:var(--amber);padding:6px 10px;border:1px solid var(--line);border-radius:8px;flex:none}
.mic-off{opacity:.5}

/* 결과 리포트 */
.score-hero{text-align:center;padding:18px 14px}
.score-hero .n{font-size:56px;font-weight:900;line-height:1;letter-spacing:-2px}
.score-hero .g{font-size:14px;color:var(--muted);margin-top:6px}
.bar-row{margin-top:12px}
.bar-row .l{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--red)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:13px;padding:6px 10px;border-radius:8px;margin:0 6px 6px 0}
.tag.ok{background:rgba(63,191,106,.12);color:#7ee2a0;border:1px solid rgba(63,191,106,.3)}
.tag.miss{background:rgba(226,59,59,.12);color:#ff9a9a;border:1px solid var(--red-dim)}
.model-line{background:var(--surface-2);border-left:3px solid var(--amber);border-radius:0 10px 10px 0;padding:10px 12px;font-size:14px;line-height:1.6;margin-top:8px;white-space:pre-wrap}

/* ---------- 하단 탭 ---------- */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;max-width:560px;margin:0 auto;
  background:rgba(20,22,27,.97);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:var(--sab);
}
nav button{height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11px;font-weight:600}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--red)}

.empty{text-align:center;color:var(--muted);padding:34px 12px;font-size:14px;line-height:1.7}

/* ---- 4단계(STEP1) 추가: 토스트 / 저장소 현황 / 경고 ---- */
#toast{
  position:fixed;left:12px;right:12px;bottom:calc(var(--nav-h) + var(--sab) + 14px);z-index:60;
  max-width:536px;margin:0 auto;display:flex;flex-direction:column;gap:8px;pointer-events:none;
}
.toast{
  background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;
  font-size:14px;line-height:1.5;box-shadow:0 8px 24px rgba(0,0,0,.5);animation:tIn .18s ease;
}
.toast.err{border-color:var(--red);background:rgba(226,59,59,.14);color:#ffc4c4}
.toast.ok{border-color:rgba(63,191,106,.5);background:rgba(63,191,106,.12);color:#a9ecc2}
@keyframes tIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:40px;font-size:14px}
.kv + .kv{border-top:1px solid var(--line)}
.kv .k{color:var(--muted)}
.kv .v{font-weight:700;font-variant-numeric:tabular-nums}
.kv .del{font-size:12px;font-weight:700;color:#ff9a9a;border:1px solid var(--red-dim);border-radius:8px;padding:6px 10px;flex:none}
.meter{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.meter > i{display:block;height:100%;background:var(--amber)}

.warnbox{
  border:1px solid var(--amber);background:rgba(245,132,43,.10);color:#ffdcbc;
  border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.65;
}
.warnbox b{color:#ffb877}
.okbox{
  border:1px solid rgba(63,191,106,.4);background:rgba(63,191,106,.09);color:#b6ecc9;
  border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.65;
}
.filebtn{position:relative;overflow:hidden}
.filebtn input[type=file]{position:absolute;inset:0;opacity:0;font-size:0}

/* ---- STEP2 추가: 내 자료 관리 / 단계별 편집기 ---- */
.mg-head{
  position:sticky;top:0;z-index:16;margin:-16px -16px 12px;padding:10px 14px;
  background:rgba(14,15,18,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;min-height:56px;
}
.mg-head .ttl{flex:1;font-size:16px;font-weight:700;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:18px;flex:none}

.searchbar{display:flex;gap:8px;margin-bottom:10px}
.searchbar .inp{flex:1;min-height:48px}
.sortbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;-webkit-overflow-scrolling:touch}
.sortbar button{flex:none;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;color:var(--muted)}
.sortbar button.on{background:rgba(226,59,59,.16);border-color:var(--red);color:#ffb2b2}

.mg-item{display:flex;align-items:stretch;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mg-item + .mg-item{margin-top:8px}
.mg-item.user{border-left:3px solid var(--red)}
.mg-item.builtin{border-left:3px solid var(--line)}
.mg-item .body{flex:1;min-width:0;padding:12px 14px;text-align:left}
.mg-item .body .t{font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px}
.mg-item .body .s{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mg-item .fav{width:52px;display:flex;align-items:center;justify-content:center;font-size:20px;border-left:1px solid var(--line);flex:none}
.mg-item .fav.on{color:var(--amber)}
.mg-item .fav:not(.on){color:#4a525d}
.pill{font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;letter-spacing:.3px;flex:none}
.pill.user{background:rgba(226,59,59,.18);color:#ff9a9a;border:1px solid var(--red-dim)}
.pill.builtin{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}

/* 단계 표시 */
.steps{display:flex;gap:6px;margin-bottom:14px}
.steps > i{flex:1;height:5px;border-radius:999px;background:var(--surface-2)}
.steps > i.on{background:var(--red)}
.steps > i.done{background:var(--red-dim)}
.stepttl{font-size:13px;color:var(--muted);margin-bottom:12px}
.stepttl b{color:var(--text);font-size:16px;display:block;margin-bottom:3px}

.field{margin-bottom:16px}
.field label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.field label .req{color:var(--red);margin-left:3px}
.field .hint{font-size:12px;color:var(--muted);margin-bottom:8px;line-height:1.5}
.field .lock{font-size:11px;color:var(--ok);margin-top:6px}
.field textarea.inp{min-height:96px}
.field .cnt{text-align:right;font-size:11px;color:var(--muted);margin-top:4px}

.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.emoji-grid button{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:22px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2)}
.emoji-grid button.on{border-color:var(--red);background:rgba(226,59,59,.18)}

.navrow{display:flex;gap:8px;margin-top:18px}
.navrow .btn{flex:1}
.draft-bar{background:rgba(245,132,43,.12);border:1px solid var(--amber);border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:13px;line-height:1.6}
.review-row{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.review-row .rk{width:104px;flex:none;color:var(--muted);font-size:13px}
.review-row .rv{flex:1;white-space:pre-wrap;word-break:break-word}
.review-row .rv.empty{color:#5c646f}

/* ---- STEP3 추가: 자료 업로드 ---- */
.doc-item{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:12px;padding:12px 14px}
.doc-item + .doc-item{margin-top:8px}
.doc-item.allowed{border-left-color:var(--amber)}
.doc-item .dt{font-weight:700;font-size:15px;word-break:break-all;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.doc-item .dm{font-size:12px;color:var(--muted);margin-top:4px}
.doc-item .drow{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.doc-item .drow .lbl{flex:1;font-size:13px;font-weight:600}
.toggle.sm{width:48px;height:28px}
.toggle.sm::after{width:20px;height:20px}
.toggle.sm.on::after{left:25px}
.kindtag{font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;flex:none}
.kindtag.abbrev{background:rgba(63,191,106,.15);color:#7ee2a0;border:1px solid rgba(63,191,106,.35)}
.kindtag.sop{background:rgba(245,132,43,.15);color:#ffb877;border:1px solid rgba(245,132,43,.35)}
.kindtag.ref{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.sendtag{font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;flex:none}
.sendtag.no{background:rgba(63,191,106,.14);color:#7ee2a0;border:1px solid rgba(63,191,106,.3)}
.sendtag.yes{background:rgba(245,132,43,.18);color:#ffc08a;border:1px solid var(--amber)}

.abbrev-tbl{margin-top:10px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.abbrev-tbl .r{display:flex;gap:8px;padding:8px 10px;font-size:13px;align-items:baseline}
.abbrev-tbl .r + .r{border-top:1px solid var(--line)}
.abbrev-tbl .r .a{width:74px;flex:none;font-weight:800;color:#ffb2b2}
.abbrev-tbl .r .f{flex:1;word-break:break-word}
.abbrev-tbl .r .n{font-size:11px;color:var(--muted)}
.abbrev-tbl .r.head{background:var(--surface-2);font-weight:700;color:var(--muted);font-size:11px}

.modal-bd{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;justify-content:center;padding:0}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:560px;
  padding:20px 18px calc(20px + var(--sab));max-height:88vh;overflow-y:auto;animation:mUp .2s ease}
@keyframes mUp{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.modal h3{margin:0 0 10px;font-size:18px}
.modal .mrow{display:flex;gap:8px;margin-top:16px}
.modal .mrow .btn{flex:1}
.pre{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12px;
  line-height:1.6;max-height:180px;overflow:auto;white-space:pre-wrap;word-break:break-all;color:#c8ced6}
.chk{display:flex;align-items:flex-start;gap:10px;padding:10px 0;font-size:14px;line-height:1.5}
.chk .box{width:26px;height:26px;border-radius:7px;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900}
.chk .box.on{background:var(--red);border-color:var(--red);color:#fff}

/* ---- STEP4 추가: 약어 해석 / 교정 규칙 ---- */
.subs{
  margin-top:6px;padding-top:6px;border-top:1px dashed #39414c;
  font-size:11.5px;color:#8f98a3;line-height:1.6;display:flex;flex-wrap:wrap;gap:4px 10px;
}
.subs .s{white-space:nowrap}
.subs .s b{color:#c6ced8;font-weight:700}
.subs .s.amb b{color:var(--amber)}
.subs .hd{color:#6f7884}
.msg.me .subs{border-top-color:#333b45}

.rule-item{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.rule-item + .rule-item{margin-top:6px}
.rule-item .rr{flex:1;min-width:0;font-size:14px;word-break:break-word}
.rule-item .rr .from{color:#ff9a9a;font-weight:700}
.rule-item .rr .to{color:#7ee2a0;font-weight:700}
.rule-item .rr .meta{font-size:11px;color:var(--muted);margin-top:2px}
.rule-item .x{width:38px;height:38px;flex:none;border-radius:9px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:#ff9a9a}
.addrule{display:flex;gap:6px;align-items:center}
.addrule .inp{flex:1;min-width:0;min-height:48px;padding:0 10px}
.addrule .ar{color:var(--muted);flex:none;font-size:16px}

/* ---- STEP5 추가: 상황 추이 / SOP 근거 ---- */
.trend{
  display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;
  padding:3px 9px;border-radius:999px;margin-bottom:7px;
}
.trend.worsening{background:rgba(226,59,59,.18);color:#ff9a9a;border:1px solid var(--red-dim)}
.trend.stabilizing{background:rgba(63,191,106,.14);color:#7ee2a0;border:1px solid rgba(63,191,106,.35)}
.trend.holding{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.trend-why{font-size:11.5px;color:#a6aeb8;line-height:1.55;margin:-3px 0 7px;font-style:normal}

.sop-note{border-left:3px solid var(--amber);background:var(--surface-2);border-radius:0 10px 10px 0;padding:9px 12px;margin-top:8px}
.sop-note .si{font-size:13px;font-weight:700;color:#ffb877;margin-bottom:3px}
.sop-note .sb{font-size:13px;line-height:1.6;color:#dbe0e6}
.refbadge{display:inline-block;font-size:11px;padding:4px 10px;border-radius:999px;margin-top:8px}
.refbadge.doc{background:rgba(63,191,106,.14);color:#7ee2a0;border:1px solid rgba(63,191,106,.35)}
.refbadge.gen{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}

/* ---- v0.9 추가: 모델 목록 / 보안 점검 ---- */
.mdl{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:52px}
.mdl + .mdl{margin-top:6px}
.mdl.on{border-color:var(--red);background:rgba(226,59,59,.13)}
.mdl .mi{flex:1;min-width:0}
.mdl .mn{font-size:14px;font-weight:700;word-break:break-all}
.mdl .md{font-size:11px;color:var(--muted);margin-top:2px}
.mdl .mk{flex:none;font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px}
.mdl .mk.rec{background:rgba(63,191,106,.16);color:#7ee2a0;border:1px solid rgba(63,191,106,.35)}
.mdl .mk.alias{background:rgba(245,132,43,.15);color:#ffb877;border:1px solid rgba(245,132,43,.35)}
.mdl .mk.cur{background:rgba(226,59,59,.18);color:#ff9a9a;border:1px solid var(--red-dim)}

.sec-row{display:flex;align-items:flex-start;gap:9px;padding:8px 0;font-size:13px;line-height:1.55}
.sec-row + .sec-row{border-top:1px solid var(--line)}
.sec-row .ic{flex:none;width:18px;text-align:center}
.sec-row .tx{flex:1}
.sec-row .tx b{display:block;font-size:13.5px;margin-bottom:1px}
.sec-row .tx span{color:var(--muted);font-size:12px}
.hr{height:1px;background:var(--line);margin:14px 0}
.notice{font-size:12px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;line-height:1.6}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <h1 id="topTitle">지휘멘트 훈련</h1>
    <span class="spacer"></span>

  <main>

  <div id="toast"></div>

  <nav>

  </nav>
</div>

<script>
/* ==========================================================================
   지휘멘트 훈련 웹앱 — 1단계 (골격 + 시나리오 + 텍스트 PTT + 상태머신)
   2단계: 음성인식/합성  3단계: Gemini 연동+채점  4단계: IndexedDB 저장·약점분석
   ========================================================================== */
'use strict';

/* ---------------------------------------------------------------
   1. 직무별 루브릭 (필수 요소 + 키워드 판정 규칙)
   --------------------------------------------------------------- */
const ROLES = {
  first: {
    name:'선착대장',
    desc:'최초 도착대 지휘관 — 초기 상황보고와 판단',
    items:[
      {key:'도착보고', label:'도착 보고(호출부호+현장도착)', re:/(도착|현착|현장\s*도착|진입로|여기는)/},
      {key:'현장개요', label:'건물·현장 개요(용도·층수·규모)', re:/(층|건물|주택|공장|상가|용도|규모|평|㎡|동|아파트|차량|산림|지하)/},
      {key:'연소범위', label:'연소·상황 범위', re:/(연소|화염|불길|연기|확대|확산|전소|외벽|천장|누출|전복|매몰|침수)/},
      {key:'인명정보', label:'인명 정보(요구조자 유무)', re:/(요구조자|인명|대피|미확인|갇힘|고립|거주자|재실|부상|사상|환자|구조대상)/},
      {key:'지원요청', label:'추가 지원 요청 여부', re:/(지원|증원|추가\s*출동|응원|구조대\s*요청|구급대\s*요청|대응\s*[1-3]|굴절|사다리차\s*요청)/}
    ]
  },
  cmd: {
    name:'지휘대장',
    desc:'현장지휘관 — 지휘권 인수와 전술 지시',
    items:[
      {key:'지휘권인수', label:'지휘권 인수 선언', re:/(지휘권|지휘\s*인수|지휘\s*개시|현장지휘|지휘를\s*맡|본인이\s*지휘)/},
      {key:'임무부여', label:'대원 임무 부여(진입·검색·급수 등)', re:/(진입|검색|급수|배연|방수|관창|사다리|중계|전개|팀은|대는|반은|담당)/},
      {key:'안전관리', label:'안전관리 지시(퇴로·붕괴·잔압)', re:/(퇴로|붕괴|잔압|공기호흡기|안전|2인\s*1조|철수|낙하|감전|백드래프트|플래시오버)/},
      {key:'검색우선', label:'인명검색 우선순위 지정', re:/(우선|먼저|최우선|층부터|순위|집중\s*검색|우선\s*검색)/},
      {key:'재평가', label:'상황 변화 시 재평가·전략 전환', re:/(재평가|전환|방어|외부\s*방수|전략|변경|재보고|상황\s*재확인|공세|수세)/}
    ]
  },
  chief: {
    name:'통제단장',
    desc:'긴급구조통제단장 — 총괄 지휘와 대외 조정',
    items:[
      {key:'통제단가동', label:'통제단 가동 선언', re:/(통제단|가동|대응\s*[1-3]\s*단계|비상\s*발령|전면\s*발령)/},
      {key:'유관기관', label:'유관기관 협조 요청', re:/(경찰|한전|가스|시청|군청|구청|의료|보건소|군|유관기관|협조|지자체|산림청)/},
      {key:'자원배분', label:'자원 총괄 배분', re:/(자원|배분|투입|배치|펌프|탱크|굴절|헬기|인력|장비|편성|가용)/},
      {key:'대외보고', label:'대외 상황보고(본부·언론)', re:/(본부|소방본부|보고|언론|브리핑|공보|대외|상황실\s*보고|119종합상황실)/},
      {key:'장기전', label:'장기전 대비(교대·보급)', re:/(교대|보급|급식|휴식|장기|연료|주유|공기통|대기\s*인력|로테이션)/}
    ]
  }
};

const DIFFS = {
  basic:  {name:'초급', sub:'기본 상황',      gap:20, window:40},
  inter:  {name:'중급', sub:'복합 상황',      gap:15, window:30},
  adv:    {name:'고급', sub:'긴급·돌발 상황', gap:10, window:20}
};

/* ---------------------------------------------------------------
   2. 시나리오 데이터
   facts  : 모범 지휘멘트 생성 재료
   turns  : 정상 진행 시 부여되는 후속 상황
   worse  : 지휘 응답 없음일 때 부여되는 악화 상황
   --------------------------------------------------------------- */
const TYPES = [
  {key:'bld',   name:'일반건물', emoji:'🏢'},
  {key:'high',  name:'고층건물', emoji:'🏬'},
  {key:'under', name:'지하공간', emoji:'🕳️'},
  {key:'fores', name:'산불',     emoji:'🌲'},
  {key:'traf',  name:'교통사고', emoji:'🚗'},
  {key:'resc',  name:'구조',     emoji:'🧗'},
  {key:'ems',   name:'구급',     emoji:'🚑'}
];

/* 유형별 기본 전술(모범멘트 생성용) */
const TACTICS = {
  bld:   {tasks:'1소대 1층 주방 관창 진입, 2소대 2층 인명검색, 3소대 후면 급수 및 연소확대 저지',
          safety:'진입대는 퇴로 확보하고 공기호흡기 잔압 100 이하 즉시 보고, 2인 1조 유지',
          prio:'발화층과 직상층 우선 검색, 화장실·베란다 집중',
          agencies:'경찰 교통통제, 한전 전기차단, 도시가스 밸브차단 요청',
          res:'펌프차 3, 탱크차 2, 구조 1, 구급 2 배치, 예비 관창조 대기'},
  high:  {tasks:'1소대 비상용승강기로 발화층 직하층 집결 후 진입, 2소대 직상층 검색, 3소대 연결송수관 송수',
          safety:'제연설비 작동 확인, 계단실 퇴로 확보, 공기호흡기 예비용기 직하층 전진 배치',
          prio:'발화층·직상층·최상층 순 우선 검색, 피난약자 세대 우선',
          agencies:'경찰 통제선, 한전 전기차단, 관리사무소 방재실 협조',

/* ===============================================================
   4.5 안전 로깅 / 토스트 (4단계-STEP1 신규)
   보안 정책: 사용자 발화·문서 내용·API 응답 본문은 절대 콘솔에 남기지 않는다.
             오류 코드, 상태, 건수, 소요시간만 기록한다.
   =============================================================== */
function logSafe(tag, code){
  try{ console.warn('[' + tag + '] ' + String(code || '').replace(/\s+/g,' ').slice(0,60)); }catch(e){}
}
/* 오류에서 사용자 데이터가 섞일 수 있는 부분(응답 본문 등)을 제거하고 코드만 남긴다 */
function safeErr(e){
  const m = String((e && e.message) || e || 'UNKNOWN');
  const http = m.match(/HTTP \d{3}/);
  if(http) return http[0];
  if(/abort/i.test(m)) return 'TIMEOUT';
  if(/fetch|network/i.test(m)) return 'NETWORK';
  if(/JSON/i.test(m)) return 'BAD_JSON';
  return m.slice(0, 40).replace(/[^\wA-Z_]/g, '_');
}
function notify(msg, kind, ms){
  const box = document.getElementById('toast');
  if(!box){ return; }
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' ' + kind : '');
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; setTimeout(()=> el.remove(), 220); }, ms || (kind==='err' ? 6000 : 3200));
}

/* ===============================================================
   4.55 네트워크 차단 관문 (보안)
   CSP가 브라우저 차원에서 막고, 여기서 한 겹 더 막는다.
   · 나갈 수 있는 곳은 이 앱 자신과 Gemini 한 곳뿐이다.
   · fetch / XHR / sendBeacon / WebSocket / EventSource 를 모두 덮는다.
   · 차단 시 조용히 넘기지 않고 사용자에게 알리고 횟수를 남긴다.
   =============================================================== */
const NET_ALLOW = ['generativelanguage.googleapis.com'];
const NetGuard = { blocked: 0, lastBlockedAt: 0, allow: NET_ALLOW.slice() };

(function installNetGuard(){
  function hostOf(u){
    try{ return new URL(String(u), location.href).hostname; }catch(e){ return ''; }
  }
  function permitted(u){
    const h = hostOf(u);
    if(!h || h === location.hostname) return true;      // 같은 출처(앱 자신)
    return NET_ALLOW.indexOf(h) >= 0;
  }
  function deny(u, how){
    NetGuard.blocked++;
    NetGuard.lastBlockedAt = Date.now();
    logSafe('NetGuard', 'BLOCKED ' + how + ' ' + (hostOf(u) || 'unknown'));
    notify('허용되지 않은 외부 주소로 나가려는 통신을 차단했습니다. (' + esc(hostOf(u) || '알 수 없음') + ')', 'err', 9000);
  }

  const rawFetch = window.fetch ? window.fetch.bind(window) : null;
  if(rawFetch){
    window.fetch = function(input, init){
      const url = (typeof input === 'string') ? input : (input && input.url) || '';
      if(!permitted(url)){ deny(url, 'fetch'); return Promise.reject(new Error('BLOCKED_HOST')); }
      return rawFetch(input, init);
    };
  }

  if(window.XMLHttpRequest){
    const open = XMLHttpRequest.prototype.open;
    XMLHttpRequest.prototype.open = function(method, url){
      if(!permitted(url)){ deny(url, 'xhr'); throw new Error('BLOCKED_HOST'); }
      return open.apply(this, arguments);
    };
  }

  if(navigator.sendBeacon){
    const beacon = navigator.sendBeacon.bind(navigator);
    navigator.sendBeacon = function(url, data){
      if(!permitted(url)){ deny(url, 'beacon'); return false; }
      return beacon(url, data);
    };
  }

  if(window.WebSocket){
    const WS = window.WebSocket;
    window.WebSocket = function(url, protocols){
      deny(url, 'websocket');                    // 이 앱은 웹소켓을 쓰지 않는다
      throw new Error('BLOCKED_HOST');
    };
    window.WebSocket.prototype = WS.prototype;
  }

  if(window.EventSource){
    const ES = window.EventSource;
    window.EventSource = function(url){
      deny(url, 'eventsource');
      throw new Error('BLOCKED_HOST');
    };
    window.EventSource.prototype = ES.prototype;
  }
})();

/* ===============================================================
   4.6 Store — IndexedDB 영구 저장소 (4단계-STEP1 신규)
   · 사용자 데이터는 전부 이 기기 안에만 남는다. 외부 전송 경로 없음.
   · 저장 실패는 조용히 넘기지 않고 반드시 사용자에게 알린다.
   =============================================================== */
const Store = (function(){
  const DB_NAME = 'fireCommandTrainer';
  const DB_VER  = 1;
  const NAMES   = ['situationTypes','scenarios','documents','sessions','settings'];

  const api = {
    names: NAMES,
    available: !!window.indexedDB,
    ready: false,
    failed: false,
    persisted: false,
    lastError: ''
  };

  let dbp = null;

  function open(){
    if(dbp) return dbp;
    dbp = new Promise((resolve, reject)=>{
      if(!api.available){ reject(new Error('NO_INDEXEDDB')); return; }
      let req;
      try{ req = indexedDB.open(DB_NAME, DB_VER); }
      catch(e){ reject(e); return; }

      req.onupgradeneeded = ev => {
        const db = ev.target.result;
        if(!db.objectStoreNames.contains('situationTypes')) db.createObjectStore('situationTypes', {keyPath:'id'});
        if(!db.objectStoreNames.contains('scenarios')){
          const s = db.createObjectStore('scenarios', {keyPath:'id'});
          s.createIndex('byType', 'typeKey', {unique:false});
        }
        if(!db.objectStoreNames.contains('documents')){
          const d = db.createObjectStore('documents', {keyPath:'id'});
          d.createIndex('byKind', 'kind', {unique:false});
        }
        if(!db.objectStoreNames.contains('sessions')){
          const x = db.createObjectStore('sessions', {keyPath:'id'});
          x.createIndex('byDate', 'startedAt', {unique:false});
        }
        if(!db.objectStoreNames.contains('settings')) db.createObjectStore('settings', {keyPath:'key'});
      };
      req.onsuccess = ()=>{
        const db = req.result;
        db.onversionchange = ()=>{ try{ db.close(); }catch(e){} dbp = null; api.ready = false; };
        api.ready = true;
        resolve(db);
      };
      req.onerror   = ()=> reject(req.error || new Error('DB_OPEN_FAILED'));
      req.onblocked = ()=> reject(new Error('DB_BLOCKED'));
    }).catch(err=>{
      api.failed = true;
      api.lastError = String((err && err.name) || err);
      logSafe('Store', 'open ' + api.lastError);
      dbp = null;
      throw err;
    });
    return dbp;
  }

  function tx(name, mode, fn){
    return open().then(db => new Promise((resolve, reject)=>{
      let t;
      try{ t = db.transaction(name, mode); }
      catch(e){ reject(e); return; }
      const st = t.objectStore(name);
      let out;
      try{ out = fn(st); }
      catch(e){ reject(e); return; }
      t.oncomplete = ()=> resolve(out && out.__req ? out.__req.result : out);
      t.onerror    = ()=> reject(t.error || new Error('TX_FAILED'));
      t.onabort    = ()=> reject(t.error || new Error('TX_ABORTED'));
    }));
  }
  const wrap = req => ({ __req: req });

  /* 저장 실패는 반드시 표면화한다 */
  function fail(op, err){
    api.lastError = String((err && err.name) || err);
    logSafe('Store', op + ' ' + api.lastError);
    const msg = api.lastError === 'QuotaExceededError'
      ? '저장 공간이 부족해 저장하지 못했습니다. 설정에서 오래된 훈련 기록을 정리해 주십시오.'
      : '데이터 저장에 실패했습니다(' + api.lastError + '). 설정 ▸ 데이터 보관 현황을 확인해 주십시오.';
    notify(msg, 'err', 8000);
    throw err;
  }

  api.put    = (name, val)   => tx(name, 'readwrite', st => wrap(st.put(val))).catch(e => fail('put:'+name, e));
  api.putAll = (name, arr)   => tx(name, 'readwrite', st => { (arr||[]).forEach(v=> st.put(v)); return arr.length; }).catch(e => fail('putAll:'+name, e));
  api.get    = (name, key)   => tx(name, 'readonly',  st => wrap(st.get(key))).catch(()=> null);
  api.getAll = (name)        => tx(name, 'readonly',  st => wrap(st.getAll())).catch(()=> []);
  api.remove = (name, key)   => tx(name, 'readwrite', st => wrap(st.delete(key))).catch(e => fail('delete:'+name, e));
  api.clear  = (name)        => tx(name, 'readwrite', st => wrap(st.clear())).catch(e => fail('clear:'+name, e));
  api.count  = (name)        => tx(name, 'readonly',  st => wrap(st.count())).catch(()=> 0);

  api.clearAll = async function(){
    for(const n of NAMES){ await api.clear(n); }
  };

  /* 브라우저 자동 정리로부터 데이터 보호 */
  api.requestPersist = async function(){
    try{
      if(!navigator.storage || !navigator.storage.persist) return false;
      if(await navigator.storage.persisted()){ api.persisted = true; return true; }
      api.persisted = await navigator.storage.persist();
      return api.persisted;
    }catch(e){ logSafe('Store', 'persist ' + (e && e.name)); return false; }
  };
  api.checkPersisted = async function(){
    try{
      if(!navigator.storage || !navigator.storage.persisted) return false;
      api.persisted = await navigator.storage.persisted();
      return api.persisted;
    }catch(e){ return false; }
  };
  api.estimate = async function(){
    try{
      if(!navigator.storage || !navigator.storage.estimate) return null;
      const e = await navigator.storage.estimate();
      return { usage: e.usage || 0, quota: e.quota || 0 };
    }catch(e){ return null; }
  };

  return api;
})();

function fmtBytes(n){
  if(!n && n !== 0) return '-';
  if(n < 1024) return n + ' B';
  if(n < 1024*1024) return (n/1024).toFixed(1) + ' KB';
  if(n < 1024*1024*1024) return (n/1024/1024).toFixed(1) + ' MB';
  return (n/1024/1024/1024).toFixed(2) + ' GB';
}

/* ===============================================================
   4.7 Backup — 백업 내보내기 / 복원 (4단계-STEP1 신규)
   · API 키는 절대 백업에 포함하지 않는다.
   · 파일명에 .local. 을 강제로 넣어 .gitignore 에 자동으로 걸리게 한다.
   =============================================================== */
const Backup = (function(){
  const FORMAT = 'fire-command-trainer-backup';
  const VERSION = 1;
  const api = {};

  api.build = async function(){
    const data = {};
    for(const n of Store.names){ data[n] = await Store.getAll(n); }
    return {
      format: FORMAT,
      version: VERSION,
      exportedAt: new Date().toISOString(),
      app: 'v1.0',
      note: '이 파일에는 기기에 저장된 훈련 데이터가 들어 있습니다. 공개 저장소나 단체 대화방에 올리지 마십시오. API 키는 포함되어 있지 않습니다.',
      prefs: Object.assign({}, prefs),
      data
    };
  };

  api.filename = function(){
    const d = new Date(), p = n => String(n).padStart(2,'0');
    return `지휘훈련_백업_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}.local.json`;
  };

  api.export = async function(){
    const payload = await api.build();
    const json = JSON.stringify(payload, null, 2);
    /* 안전장치: 백업에 키가 섞여 들어가지 않았는지 최종 확인 */
    if(/AIza[0-9A-Za-z_-]{20,}/.test(json) || /"gemini_api_key"/.test(json)){
      notify('백업 생성을 중단했습니다. 파일에 API 키로 보이는 값이 포함되어 안전하지 않습니다.', 'err', 9000);
      return null;
    }
    const blob = new Blob([json], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = api.filename();
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=> URL.revokeObjectURL(url), 4000);
    const counts = Object.keys(payload.data).reduce((s,k)=> s + payload.data[k].length, 0);
    return { bytes: blob.size, records: counts, name: a.download };
  };

  api.restore = async function(file, mode){
    const text = await file.text();
    let obj;
    try{ obj = JSON.parse(text); }
    catch(e){ throw new Error('파일을 읽을 수 없습니다. 이 앱에서 내보낸 백업 파일이 맞는지 확인해 주십시오.'); }
    if(!obj || obj.format !== FORMAT) throw new Error('이 앱의 백업 파일이 아닙니다.');
    if(!obj.data) throw new Error('백업 파일에 데이터가 없습니다.');

    if(mode === 'replace'){ await Store.clearAll(); }

    let restored = 0;
    for(const n of Store.names){
      const rows = Array.isArray(obj.data[n]) ? obj.data[n] : [];
      if(rows.length){ await Store.putAll(n, rows); restored += rows.length; }
    }
    /* 설정 복원 — API 키 관련 항목은 어떤 경우에도 받지 않는다 */
    if(obj.prefs && typeof obj.prefs === 'object'){
      Object.keys(obj.prefs).forEach(k=>{
        if(/key|token|secret/i.test(k)) return;
        if(k in prefs) prefs[k] = obj.prefs[k];
      });
      savePrefs();
    }
    return { restored, exportedAt: obj.exportedAt || '' };
  };

  return api;
})();

/* 폼 데이터 → 훈련 실행용 시나리오
   place(발생 장소)는 화면 표시 전용으로만 두고, 무전 로그·AI 요청에는 넣지 않는다. */
function toRuntimeScenario(u){
  const detail = [firstLine(u.weather), firstLine(u.report)].filter(Boolean).join(' / ') || '상황 정보 없음';
  return {
    id: u.id, type: u.typeKey, title: u.title || '제목 없음',
    detail,
    origin: 'user',
    place: u.place || '',            // ← AI 전송 금지 (화면 표시 전용)
    variants: u.variants || '',      // ← AI 전송 금지 (내부 메모)
    hazards: u.hazards || '',
    facts: {
      call: '○○1호차',
      overview: u.overview || '대상물 개요 미입력',
      fire: firstLine(u.report) || '상황 진행 중',
      life: u.occupants || '재실자 정보 미확인',
      support: u.resources ? ('가용 자원 ' + firstLine(u.resources) + ' 기준으로 추가 지원 검토') : '추가 지원 요청 여부 판단'
    },
    turns: genericTurns(u),
    worse: genericWorse(u)
  };
}
function rebuildRuntime(){
  userRuntime = new Map();
  userScens.forEach(u => userRuntime.set(u.id, toRuntimeScenario(u)));
}

/* ---- CSV 한 줄 분해 (따옴표 처리) ---- */
function splitCsvLine(line){
  const out = []; let cur = '', q = false;
  for(let i = 0; i < line.length; i++){
    const c = line[i];
    if(q){
      if(c === '"'){ if(line[i+1] === '"'){ cur += '"'; i++; } else q = false; }
      else cur += c;
    }
    else if(c === '"') q = true;
    else if(c === ','){ out.push(cur); cur = ''; }
    else cur += c;
  }
  out.push(cur);
  return out.map(s => s.trim());
}

/* ---- 약어집 파싱 — csv / tsv / json / 자유형식 모두 받아준다 ---- */
function parseAbbrev(text, ext){
  const entries = [], seen = new Set();
  const push = (a, f, n) => {
    a = String(a == null ? '' : a).trim();
    f = String(f == null ? '' : f).trim();
    n = String(n == null ? '' : n).trim();
    if(!a || !f) return;
    if(a.length > 20 || f.length > 80) return;      // 표 오인식 방지
    const key = a + '␀' + f;                   // 같은 약어의 다른 뜻은 살린다 (다의어 지원)
    if(seen.has(key)) return;
    seen.add(key);
    entries.push({ abbr:a, full:f, note:n });
  };

  if(ext === 'json'){
    try{
      const o = JSON.parse(text);
      if(Array.isArray(o)){
        o.forEach(r => {
          if(typeof r === 'string'){ const p = r.split(/[,\t:=]/); push(p[0], p[1], p[2]); }
          else if(r) push(r.abbr || r.약어 || r.a, r.full || r.정식용어 || r.f, r.note || r.설명 || r.n);
        });
      } else if(o && typeof o === 'object'){
        Object.keys(o).forEach(k => {
          const v = o[k];
          if(typeof v === 'string') push(k, v, '');
          else if(v) push(k, v.full || v.정식용어, v.note || v.설명);
        });
      }
      if(entries.length) return entries;
    }catch(e){ /* JSON이 아니면 아래 줄 단위 파싱으로 */ }
  }

  String(text).split(/\r?\n/).forEach(raw => {
    const s = raw.trim();
    if(!s || s[0] === '#' || s.slice(0,2) === '//') return;
    if(/^(약어|줄임말|abbr\w*)\s*[,\t]/i.test(s)) return;        // 헤더 행
    let parts = null;
    if(s.indexOf('\t') >= 0)      parts = s.split('\t').map(x=>x.trim());
    else if(s.indexOf(',') >= 0)  parts = splitCsvLine(s);
    else if(/(=>|→|->|\s=\s|\s:\s|:)/.test(s)) parts = s.split(/\s*(?:=>|→|->|=|:)\s*/).map(x=>x.trim());
    if(!parts || parts.length < 2) return;
    push(parts[0], parts[1], parts[2]);
  });
  return entries;
}

/* ---- 전송 금지 자료 대조 ----
   요청 본문에서 30자 창을 15자 간격으로 훑어, 전송 금지 자료의 원문에 그 창이
   들어 있는지 확인한다. 자료 쪽에서 조각을 뽑으면 인용 위치가 어긋날 때 놓치므로
   반대로 요청 쪽을 훑는다.
   보장: 공백을 지운 기준으로 34자 이상 연속으로 원문이 실리면 반드시 걸린다.
   30자를 사람이 우연히 똑같이 말할 일은 거의 없어 오탐도 사실상 없다.
   (창을 더 줄이면 지휘관이 SOP 문구를 그대로 복창했을 때 오탐이 나고,
    간격을 1로 좁히면 대용량 자료에서 매 호출 300ms 이상 지연되어 5로 정했다.) */
const FP_W = 30;            // 대조 창 크기 (공백 제거 기준)
const FP_STEP = 5;          // 요청 본문 주사 간격
const FP_DOC_CAP = 400000;  // 자료당 대조 대상 최대 길이

function normText(s){ return String(s || '').replace(/\s+/g, ''); }

/* 요청 본문은 JSON 문자열이라 줄바꿈이 \n 두 글자로 들어 있다.
   이스케이프를 먼저 풀지 않으면 원문이 그대로 실려도 창이 어긋나 못 잡는다. */
function normPayload(s){
  return normText(String(s || '')
    .replace(/\\u[0-9a-fA-F]{4}/g, ' ')
    .replace(/\\[nrtbfv]/g, ' ')
    .replace(/\\(.)/g, '$1'));
}

function rebuildDocDerived(){
  /* 약어 매핑 — 전송 허용 여부와 무관하게 기기 안에서는 항상 쓴다 */
  abbrevMap = new Map();
  userDocs.filter(d => d.kind === 'abbrev').forEach(d => {
    (d.entries || []).forEach(e => {
      const cur = abbrevMap.get(e.abbr) || [];
      cur.push({ full:e.full, note:e.note, docId:d.id });
      abbrevMap.set(e.abbr, cur);
    });
  });
  /* 전송 금지 자료의 정규화 원문 (대조용, 메모리에만 유지) */
  blockedPrints = userDocs
    .filter(d => !d.aiAllowed)
    .map(d => ({ name: d.name, norm: normText(d.text).slice(0, FP_DOC_CAP) }))
    .filter(d => d.norm.length >= FP_W);
}

async function loadDocs(){
  const rows = await Store.getAll('documents');
  userDocs = Array.isArray(rows) ? rows : [];
  userDocs.sort((a,b)=> (b.addedAt||0) - (a.addedAt||0));
  rebuildDocDerived();
  return userDocs.length;
}

async function addDocument(file, kind){
  const ext = String(file.name.split('.').pop() || '').toLowerCase();
  if(DOC_EXT.indexOf(ext) < 0) throw new Error('지원하지 않는 형식입니다. txt · md · csv · json 파일만 올릴 수 있습니다.');
  if(file.size > DOC_MAX)      throw new Error(`파일이 너무 큽니다. 최대 ${fmtBytes(DOC_MAX)}까지 올릴 수 있습니다.`);
  const used = userDocs.reduce((s,d)=> s + (d.size||0), 0);
  if(used + file.size > DOC_TOTAL_MAX) throw new Error('자료 보관 용량이 가득 찼습니다. 오래된 자료를 지운 뒤 다시 시도하십시오.');

  const text = await file.text();
  if(!text.trim()) throw new Error('내용이 비어 있는 파일입니다.');

  const doc = {
    id: 'D' + Date.now(),
    name: file.name,
    kind: kind || 'ref',
    ext, size: file.size,
    text,
    aiAllowed: false,               // ← 기본값 OFF. 사용자가 명시적으로 켜야만 전송된다.
    addedAt: Date.now(), updatedAt: Date.now()
  };
  if(doc.kind === 'abbrev'){
    doc.entries = parseAbbrev(text, ext);
    doc.entryCount = doc.entries.length;
  }
  await Store.put('documents', doc);
  await loadDocs();
  return doc;
}

async function setDocAllowed(id, allowed){
  const d = userDocs.find(x => x.id === id);
  if(!d) return;
  d.aiAllowed = !!allowed;
  d.updatedAt = Date.now();
  await Store.put('documents', d);
  await loadDocs();
}
async function removeDocument(id){
  await Store.remove('documents', id);
  await loadDocs();
}
function allowedDocs(){ return userDocs.filter(d => d.aiAllowed); }

/* ---- 전송 직전 최종 필터 (외부로 나가는 모든 요청이 이 관문을 지난다) ---- */
function assertNoBlockedContent(payloadText){
  if(!blockedPrints.length) return;
  const flat = normPayload(payloadText);
  if(flat.length < FP_W) return;
  for(let i = 0; i + FP_W <= flat.length; i += FP_STEP){
    const w = flat.slice(i, i + FP_W);
    for(let j = 0; j < blockedPrints.length; j++){
      if(blockedPrints[j].norm.indexOf(w) >= 0){
        const e = new Error('BLOCKED_CONTENT');
        e.docName = blockedPrints[j].name;
        throw e;
      }
    }
  }
}

/* ---- 전송을 허용한 자료만 프롬프트에 넣는다 (파일명은 보내지 않는다) ---- */
function allowedDocsBlock(maxChars){
  const list = allowedDocs();
  if(!list.length) return '';
  const cap = maxChars || 2800;
  const share = Math.max(500, Math.floor(cap / list.length));
  const parts = list.map(d => `### ${DOC_KINDS[d.kind].name}\n${String(d.text).slice(0, share)}`);
  return '\n\n## 지휘관이 전송을 허용한 참고 자료\n' +
         '아래는 이 조직에서 실제 사용하는 자료다. 판단과 피드백에 우선 반영하라.\n' +
         parts.join('\n\n');
}

/* ===============================================================
   4.10 무전 약어 해석 엔진 (STEP4 신규) — 1단: 기기 내 치환
   · 음성인식 오인식을 먼저 교정한 뒤, 등록된 약어를 정식 용어로 바꾼다.
   · 모든 처리는 이 기기 안에서만 일어난다. 약어집 원문은 전송되지 않는다.
   · 무엇을 어떻게 바꿨는지 항상 화면에 남겨 사용자가 즉시 확인·수정할 수 있게 한다.
   =============================================================== */

/* 기본 제공 교정 규칙 — 어디까지나 출발점이다.

let corrections = [];      // {id, from, to, builtin, enabled}

/* 약어 뒤에 붙어도 같은 낱말로 볼 수 있는 글자 — 조사만 넣는다.
   '한/했/하' 같은 용언 어미까지 넣으면 "지원을 요구한다"의 '요구'가
   약어로 잡혀 "요구조자한다"가 되는 사고가 난다. 어미가 붙은 형태
   ("현착했습니다")는 2단 AI 문맥 추정에 맡긴다. */
const FOLLOW_OK = new Set(('이가은는을를와과도만에의로으부까랑님측쪽').split(''));
const isHangul = ch => !!ch && /[가-힣]/.test(ch);

/* 같은 약어에 뜻이 여럿이면 현재 시나리오와 직전 무전을 근거로 고른다 */
function pickMeaning(list, ctx){
  if(list.length === 1) return { pick:list[0], ambiguous:false };
  const hay = ((ctx && ctx.scenarioText) || '') + ' ' + ((ctx && ctx.lastDispatch) || '');
  let best = list[0], bestScore = -1;
  list.forEach(c => {
    const words = ((c.full || '') + ' ' + (c.note || '')).match(/[가-힣]{2,}/g) || [];
    let score = 0;
    words.forEach(w => { if(hay.indexOf(w) >= 0) score++; });
    if(score > bestScore){ bestScore = score; best = c; }
  });
  return { pick:best, ambiguous:true, alts:list.map(x => x.full) };
}

/* 해석 본체 — 원문을 받아 치환된 문장과 변경 내역을 돌려준다 */
function interpretText(raw, ctx){
  let text = String(raw || '');
  const changes = [];
  if(!text.trim()) return { text, changes };

  /* (1) 음성인식 오인식 교정 */
  corrections.forEach(c => {
    if(!c || c.enabled === false || !c.from || !c.to) return;
    if(c.from === c.to) return;
    let i = text.indexOf(c.from), guard = 0;
    while(i >= 0 && guard++ < 50){
      text = text.slice(0, i) + c.to + text.slice(i + c.from.length);
      changes.push({ from:c.from, to:c.to, kind:'fix' });
      i = text.indexOf(c.from, i + c.to.length);
    }
  });

  /* (2) 약어 → 정식 용어 (긴 약어부터 처리해 부분 일치를 막는다) */
  const abbrs = Array.from(abbrevMap.keys()).sort((a,b) => b.length - a.length);
  abbrs.forEach(a => {
    if(!a) return;
    let i = 0, guard = 0;
    while(guard++ < 50){
      const idx = text.indexOf(a, i);
      if(idx < 0) break;
      const prev = idx > 0 ? text[idx-1] : '';
      const next = text[idx + a.length] || '';
      /* 앞은 한글이 아니어야 하고, 뒤는 경계이거나 조사·어미여야 한다 */
      const okPrev = !isHangul(prev);
      const okNext = !isHangul(next) || FOLLOW_OK.has(next);
      if(!okPrev || !okNext){ i = idx + 1; continue; }
      const m = pickMeaning(abbrevMap.get(a) || [], ctx);
      if(!m.pick || !m.pick.full){ i = idx + 1; continue; }
      /* 이미 정식 용어로 말했으면 다시 펼치지 않는다
         (예: "공기호흡기 잔압" → "공기호흡기 공기호흡기 잔압" 방지) */
      const ws = Math.max(0, idx - m.pick.full.length);
      if(text.slice(ws, idx + a.length + m.pick.full.length).indexOf(m.pick.full) >= 0){
        i = idx + a.length; continue;
      }
      text = text.slice(0, idx) + m.pick.full + text.slice(idx + a.length);
      changes.push({ from:a, to:m.pick.full, kind:'abbrev', ambiguous:m.ambiguous, alts:m.alts });
      i = idx + m.pick.full.length;
    }
  });

  return { text: text.replace(/\s{2,}/g, ' ').trim(), changes };
}

/* 현재 훈련 상황을 해석 문맥으로 만든다 */
function interpretCtx(){
  const r = S.run;
  if(!r) return {};
  const sc = r.scenario || {};
  const f = sc.facts || {};
  const lastD = (r.log || []).filter(l => l.who === 'dispatch').slice(-1)[0];
  return {
    scenarioText: [sc.title, sc.detail, sc.hazards, f.overview, f.fire, f.life, typeName(sc.type)].filter(Boolean).join(' '),
    lastDispatch: lastD ? lastD.text : ''
  };
}

const TREND_LABEL = {
  worsening:   { t:'🔻 상황 악화', c:'worsening' },

  const m = TREND_LABEL[tr.trend]; if(!m) return '';
  return `<span class="trend ${m.c}">${m.t}</span>` +
         (tr.reason ? `<div class="trend-why">${esc(tr.reason)}</div>` : '');
}

/* 화면에 보여줄 변경 요약 */
function changesSummary(changes){
  if(!changes || !changes.length) return '';
  const seen = new Set(), out = [];
  changes.forEach(c => {
    const k = c.from + '>' + c.to;
    if(seen.has(k)) return;
    seen.add(k);
    out.push(c);
  });
  return out.map(c =>
    `<span class="s ${c.ambiguous?'amb':''}">${esc(c.from)} → <b>${esc(c.to)}</b>${c.ambiguous?' (?)':''}</span>`
  ).join('');
}

/* ---------------------------------------------------------------
   6. 판정 엔진 (1단계 = 로컬 규칙 기반 목업)
       → 3단계에서 Gemini 호출로 교체 (동일 시그니처 유지)
   --------------------------------------------------------------- */
function judgeLocal(text, roleKey, sc, turnIdx){
  const items = ROLES[roleKey].items;
  const checked=[], missed=[];
  items.forEach(it => (it.re.test(text) ? checked : missed).push(it.key));

  /* 무전 응답 생성 — 복명복창만 한다.
     빠진 요소를 다시 말해 달라고 요구하면 훈련이 제자리를 돌게 되므로,
     누락은 채점에만 반영하고 여기서는 지적하지 않는다. */
  let reply;
  if(checked.length === 0){
    /* 알아들을 내용이 없을 때만 재송신을 요청한다 (무전 감도 문제) */
    reply = '상황실입니다. 감도 불량으로 내용 확인이 어렵습니다. 재송신 바랍니다.';
  }else{
    /* 실제로 지시된 것을 골라 복창한다 */
    const ackOf = {
      '도착보고':'현장 도착 접수했습니다',
      '현장개요':'대상물 개요 접수했습니다',
      '연소범위':'연소 범위 접수했습니다',
      '인명정보':'인명 정보 접수했습니다',
      '지원요청':'추가 지원 요청 접수했습니다',
      '지휘권인수':'지휘권 인수 확인했습니다',
      '임무부여':'임무 하달 수신, 각 대 복창합니다',
      '안전관리':'안전관리 지시 수신했습니다',
      '검색우선':'검색 우선순위 수신했습니다',
      '재평가':'전략 재평가 지시 수신했습니다',
      '통제단가동':'통제단 가동 접수했습니다',
      '유관기관':'유관기관 협조 요청하겠습니다',
      '자원배분':'자원 배치 수신했습니다',
      '대외보고':'상황보고 체계 수신했습니다',
      '장기전':'교대·보급 계획 수신했습니다'
    };
    const acks = checked.map(k => ackOf[k]).filter(Boolean).slice(0, 2);
    reply = `${sc.facts.call} 수신. ${acks.join(', ') || '지시 접수했습니다'}. 지시대로 시행하겠습니다. 이상.`;
  }
  return { radio_reply: reply, checked_items: checked, missed_items: missed };
}

/* 무전 규칙(20) + 상황 적합성(10) — 1단계 로컬 산출 */
function radioRuleScore(texts){
  if(!texts.length) return 0;
  let s = 0;
  const all = texts.join(' ');
  const avgLen = texts.reduce((a,t)=>a+t.length,0)/texts.length;
  if(avgLen <= 160) s += 8; else if(avgLen <= 240) s += 5; else s += 2;      // 간결성
  if(/(호차|지휘|본부|상황실|구조\d|구급\d|여기는|소대)/.test(all)) s += 7;   // 호출부호
  if(/(이상|바람|바랍니다|복창|시행하라|확인하라|보고하라)/.test(all)) s += 5; // 복창 유도
  return Math.min(20, s);
}
function relevanceScore(texts, sc){
  if(!texts.length) return 0;
  const all = texts.join(' ');
  const t = tacticsFor(sc.type);
  const bag = (sc.title+' '+sc.detail+' '+(sc.hazards||'')+' '+t.tasks+' '+t.safety).match(/[가-힣]{2,}/g) || [];
  const uniq = Array.from(new Set(bag)).slice(0,60);
  const hit = uniq.filter(w => all.includes(w)).length;
  return Math.min(10, Math.round(hit/Math.max(6,uniq.length*0.18)*10));
}

/* ===============================================================
   6.4 AIRadio — Gemini 연동 (3단계 신규)
   · API 키는 코드에 없다. 설정 화면에서 입력받아 sessionStorage에만 보관한다.
   · 실패하면 예외를 던지지 않고 로컬 판정(judgeLocal)으로 되돌아간다.
   =============================================================== */
const AIRadio = (function(){
  const ENDPOINT = 'https://generativelanguage.googleapis.com/v1beta/models/';
  const KEY_NAME = 'gemini_api_key';
  const TIMEOUT  = 25000;

  const api = { lastError:'', lastLatency:0, callCount:0 };

  const DEFAULT_MODEL = 'gemini-flash-latest';
  /* 모델명은 요청 URL의 경로에 들어간다. 형식을 좁게 못박아
     이상한 값이 경로를 바꾸거나 다른 곳을 가리키지 못하게 한다. */
  const MODEL_RE = /^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$/;
  api.validModel = m => MODEL_RE.test(String(m == null ? '' : m).trim());

  api.getKey  = ()=> (sessionStorage.getItem(KEY_NAME) || '').trim();
  api.setKey  = v => { v ? sessionStorage.setItem(KEY_NAME, String(v).trim()) : sessionStorage.removeItem(KEY_NAME); };
  /* 오프라인 훈련 모드가 켜져 있으면 키가 있어도 AI를 호출하지 않는다.
     외부 전송 차단의 최종 관문이므로 generate() 진입부에서도 한 번 더 확인한다. */
  api.enabled = ()=> !!api.getKey() && !prefs.aiOffline;
  api.model   = ()=> {
    const m = String(prefs.model || '').trim();
    return api.validModel(m) ? m : DEFAULT_MODEL;
  };
  api.defaultModel = DEFAULT_MODEL;

  /* ---- 저수준 호출 ---- */
  async function generate(systemText, userText, schema, isConnTest){
    /* 최종 관문: 오프라인 훈련 모드에서는 어떤 경로로 호출되어도 밖으로 나가지 않는다
       (연결 테스트는 사용자가 직접 누른 것이고 고정 더미 문장만 보내므로 예외) */
    if(prefs.aiOffline && !isConnTest) throw new Error('OFFLINE_MODE');
    const key = api.getKey();
    if(!key) throw new Error('NO_KEY');

    const ctl = new AbortController();
    const to  = setTimeout(()=> ctl.abort(), TIMEOUT);
    const t0  = Date.now();
    try{
      const body = {
        systemInstruction:{ parts:[{ text: systemText }] },
        contents:[{ role:'user', parts:[{ text: userText }] }],
        generationConfig:{
          temperature: 0.85,
          maxOutputTokens: 1200,
          responseMimeType: 'application/json',
          responseSchema: schema
        },
        safetySettings:[
          'HARM_CATEGORY_HARASSMENT','HARM_CATEGORY_HATE_SPEECH',
          'HARM_CATEGORY_SEXUALLY_EXPLICIT','HARM_CATEGORY_DANGEROUS_CONTENT'
        ].map(c=>({ category:c, threshold:'BLOCK_ONLY_HIGH' }))
      };
      /* 전송 직전 최종 필터 — 전송을 허용하지 않은 자료의 내용이 섞였으면 여기서 멈춘다 */
      const bodyText = JSON.stringify(body);
      try{
        assertNoBlockedContent(bodyText);
      }catch(be){
        logSafe('AIRadio', 'BLOCKED_CONTENT');
        notify('전송을 중단했습니다. 전송을 허용하지 않은 자료 «' + (be.docName || '알 수 없음') + '» 의 내용이 요청에 포함되어 있습니다.', 'err', 10000);
        throw be;
      }

      /* 키는 URL 쿼리스트링이 아니라 헤더로 보낸다 (브라우저 히스토리·리퍼러·프록시 로그 노출 방지) */
      const res = await fetch(ENDPOINT + encodeURIComponent(api.model()) + ':generateContent', {
        method:'POST',
        headers:{ 'Content-Type':'application/json', 'x-goog-api-key': key },
        referrerPolicy:'no-referrer',
        body: bodyText, signal: ctl.signal
      });
      if(!res.ok){
        /* 응답 본문에는 요청 내용이 되비칠 수 있으므로 오류 객체에만 담고 로그·기록에는 남기지 않는다 */
        const t = await res.text().catch(()=> '');
        const err = new Error('HTTP ' + res.status);
        err.detail = t.slice(0, 180);
        throw err;
      }
      const data = await res.json();
      const cand = (data.candidates || [])[0] || {};
      const parts = ((cand.content || {}).parts || []);
      let txt = parts.map(p => p.text || '').join('').trim();
      if(!txt) throw new Error('EMPTY_RESPONSE');
      txt = txt.replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '').trim();
      api.lastLatency = Date.now() - t0;
      api.callCount++;
      return JSON.parse(txt);
    } finally {
      clearTimeout(to);
    }
  }

  /* ---- STEP5: 판단 기준의 우선순위 ---- */
  const PRIORITY_BLOCK =
`## 판단 기준의 우선순위
1순위 — 대한민국 소방청 재난현장 표준작전절차(SOP)와 국내 소방 지휘 관행
2순위 — 미국 NIMS / ICS 및 NFPA 계열 지휘 원칙
3순위 — 일본 소방 재해현장 활동 기준

· 국내 기준으로 충분히 설명되는 사항에 해외 체계를 굳이 끌어들이지 마라.`;

  /* ---- STEP5: SOP 인용 제약 ----

  /* ---- 공통 프롬프트 조각 ---- */
  function rubricBlock(roleKey){

    return `[${r.name}] 필수 요소 — checked_items / missed_items 에는 반드시 아래 key 문자열만 사용한다.\n` +

  /* 사용자 정의 시나리오는 식별 정보(시나리오명·발생 장소·변형 메모)를 빼고

  function sceneBlock(sc, roleKey, diffKey, turn, total){

  const SYS_TURN =
`당신은 대한민국 소방 현장지휘 무전 훈련 시뮬레이터다. 두 가지 역할을 동시에 수행한다.

[역할 1 — 상황실 / 현장대원]
지휘관의 무전을 받은 상황실 또는 현장 대원으로서 응답한다.
· 실제 무전처럼 간결하게, 반드시 2~3문장 이내.
· <지시받은 내용을 복명복창한다.>
  (예: "○○1호차 수신. 2층 인명검색 실시하겠습니다. 이상.")
· 반드시 존댓말 무전체를 쓰고 "이상." 또는 "지시 바랍니다."로 끝맺는다.
· 소설처럼 묘사하지 말고 무전 문장만 쓴다.

[역할 1의 절대 금지 — 훈련이 제자리를 돌지 않게 한다]
· <빠진 필수 요소를 다시 말해 달라고 요구하지 마라.>
  "요구조자 유무는 어떻게 됩니까?", "추가 지원이 필요합니까?" 같은 되물음은 금지다.
  누락은 채점에만 반영되고, 훈련 중에는 지적하지 않는다.
· 대신 <그 누락이 현장에서 어떤 결과를 낳는지>를 next_situation 으로 보여줘라.
  (예: 인명 정보를 확인하지 않았다 → "2층에서 요구조자가 뒤늦게 발견됐습니다")
· 이미 지나간 턴의 지시를 다시 확인받으려 하지 마라. 상황은 항상 앞으로만 간다.
· 되물음은 <말을 알아듣지 못했을 때만> 쓴다. 내용이 부족하다는 이유로는 되묻지 않는다.

[위기 가중 — 지시 이행을 어렵게 만든다]
지휘관의 대응 능력을 끌어올려야 할 때는, 요구를 반복하는 대신 <지시 이행이 어려운 상황>을 만든다.
· 지시한 자원이 부족하거나 늦는다. (예: "급수 중계 차량이 진입로 정체로 10분 지연됩니다")
· 지시한 경로·수단이 막힌다. (예: "지정하신 진입로가 적재물로 막혀 있습니다")
· 지시를 수행하던 대원에게 문제가 생긴다. (예: "진입대 잔압이 80까지 떨어졌습니다")
· 새로운 요구가 동시에 발생한다. (예: "인접 건물 주민이 대피를 거부하고 있습니다")
이때도 <지휘관에게 무엇을 하라고 알려주지 마라.> 사실만 보고하고 판단은 지휘관에게 맡긴다.

[역할 2 — 평가자]
지휘관의 이번 송신이 직무별 필수 요소 중 무엇을 충족했는지 판정한다.
· 표현이 달라도 의미가 충족되면 인정한다(예: "현착"=도착보고).
· 이번 송신만 기준으로 판단하고, 과거 턴은 고려하지 않는다.
· 제시된 key 문자열 외에는 절대 사용하지 않는다.

[해석 지침 — 알아듣기 어려운 말이 있을 때]
지휘관의 무전은 음성인식을 거쳐 들어오므로 낱말이 잘못 들어오거나 줄임말이 섞일 수 있다.
· 뜻이 통하지 않는 낱말이 있으면 먼저 현재 상황과 직전 무전의 맥락으로 의미를 추정하라.
  (예: 화재 현장에서 "관장 전개"는 "관창 전개"로 본다)
· 맥락으로 추정이 되면 그 뜻으로 받아들이고 정상적으로 응답하되,
  radio_reply 안에서 확인하듯 되짚어라. (예: "관창 전개로 수신했습니다.")
· 추정이 어려우면 지어내지 말고 실제 무전처럼 되물어라.
  (예: "감도 불량입니다. 재송신 바랍니다." / "○○ 부분 다시 말씀해 주십시오.")
· 되물을 때는 checked_items 를 비우지 말고, 알아들은 부분까지는 정상적으로 판정하라.

[역할 3 — 상황 전개 : 인과적으로 전개한다]
next_situation 에 다음 턴에 부여할 후속 상황을 쓴다.
· 상황실 또는 현장 대원의 무전 형식, 2~3문장.
· <무작위 돌발을 넣지 마라.> 직전 지휘 조치의 결과로 현장이 어떻게 달라졌는지를 쓴다.
· 지휘가 적절했으면 그 부분은 안정되고, 그 다음에 드러나는 과제를 제시한다.
· 필요한 조치가 빠졌으면, 빠진 조치 때문에 생기는 결과를 구체적인 인과로 전개한다.
  (예: 배연 지시 없음 → 내부 열기·연기 축적 → 진입대 시야 상실·후퇴)
· 난이도 초급은 인과가 한 단계, 중급은 두 요인이 겹치게, 고급은 인과 전개를 빠르게 한다.
  고급이라도 <까닭 없는 사고는 만들지 마라.>
· 이번이 마지막 턴이면 빈 문자열("")로 둔다.

[상황 추이 판정]
· situation_trend 에 stabilizing(안정) / holding(현상유지) / worsening(악화) 중 하나를 쓴다.
· trend_reason 에 그렇게 판단한 까닭을 지휘 조치와 연결해 한 문장으로 쓴다.
  (예: "급수 중계를 지정하지 않아 관창 압력이 떨어지고 있음")`;

  const SCHEMA_TURN = {
    type:'OBJECT',
    properties:{
      radio_reply:{ type:'STRING' },
      checked_items:{ type:'ARRAY', items:{ type:'STRING' } },
      missed_items:{ type:'ARRAY', items:{ type:'STRING' } },
      next_situation:{ type:'STRING' },
      situation_trend:{ type:'STRING', enum:['stabilizing','holding','worsening'] },
      trend_reason:{ type:'STRING' }
    },
    required:['radio_reply','checked_items','missed_items','next_situation','situation_trend','trend_reason']
  };

  /* ---- 턴 판정 + 무전 응답 ---- */
  api.turn = async function(text, roleKey, sc, turnIdx, run){
    const lastDispatch = (run && run.log) ? (run.log.filter(l=>l.who==='dispatch').slice(-1)[0]||{}).text || '' : '';
    const trendHist = (run && run.trends || []).slice(-3)
      .map((t,i)=> `${i+1}) ${t.trend} — ${t.reason}`).join('\n');
    const user =
`## 훈련 정보
${sceneBlock(sc, roleKey, run ? run.diff : 'basic', turnIdx, run ? run.totalTurns : 6)}

${PRIORITY_BLOCK}

${sopBlock()}

## 필수 요소
${rubricBlock(roleKey)}

## 직전 상황실/현장 무전
${lastDispatch || '(없음)'}
${trendHist ? `\n## 지금까지의 상황 추이 (인과를 이어서 전개하라)\n${trendHist}` : ''}

## 지휘관의 무전 (평가 대상)
"""${text}"""
${allowedDocsBlock(1800)}

위 지휘관 무전에 대해 radio_reply, checked_items, missed_items, next_situation, situation_trend, trend_reason 을 JSON으로 출력하라.`;
    return await generate(SYS_TURN, user, SCHEMA_TURN);
  };

  const SYS_EVAL =
`당신은 대한민국 소방 현장지휘 훈련의 평가관이다. 아래 채점 루브릭에 따라 엄정하게 채점하고 피드백한다.

## 채점 루브릭
· 필수 요소 충족 70점 = (충족 요소 수 / 필수 요소 수) × 70  → checked_items / missed_items 로 판정
· 무전 규칙 준수 20점 = 간결성(1회 송신 2~3문장), 호출부호 사용, 복창 유도 표현("이상", "~하라", "보고 바람")
· 상황 적합성 10점 = 해당 시나리오의 위험요인과 전술에 맞는 지시였는가

## 출력 규칙
· checked_items / missed_items 는 제시된 key 문자열만 사용한다. 두 배열의 합집합은 전체 필수 요소와 같아야 한다.
· review(총평)는 3~5문장. 반드시 누락한 요소를 명시하고, 왜 위험한지 실무적으로 지적한다. 존댓말.
· model_transmission 은 이 시나리오와 직무에 맞는 모범 지휘멘트다.
  실제 무전으로 그대로 읽을 수 있게 쓰고, 호출부호·구체적 임무 지정·안전관리를 포함한다.
