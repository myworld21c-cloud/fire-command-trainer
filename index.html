      <div class="kv"><span class="k">무전 기록 전문(종료 시)</span><span class="v small" style="color:${(AIRadio.enabled()&&prefs.aiGrading)?'#ffb877':'var(--ok)'}">${(AIRadio.enabled()&&prefs.aiGrading)?'Gemini':'전송 안 함'}</span></div>
      <div class="kv"><span class="k">시나리오 이름·장소·메모</span><span class="v small" style="color:var(--ok)">전송 안 함</span></div>
      <div class="kv"><span class="k">업로드 자료 (${userDocs.length}건)</span><span class="v small" style="color:${(allowedDocs().length&&!prefs.aiOffline)?'#ffb877':'var(--ok)'}">${
        userDocs.length===0 ? '없음'
        : prefs.aiOffline ? '전송 안 함 (오프라인)'
        : allowedDocs().length ? `${allowedDocs().length}건 전송 허용됨` : '전송 안 함'
      }</span></div>

      <div class="hr"></div>
      <div class="switch"><span class="lbl">🔒 마이크 차단 (텍스트 전용)</span><button class="toggle ${prefs.micBlocked?'on':''}" id="tgMicBlock"></button></div>
      <div class="muted xsmall">켜면 음성인식을 쓰지 않아 <b>음성이 외부로 나가지 않습니다.</b></div>

      <div class="hr"></div>
      <div class="switch"><span class="lbl">🔒 오프라인 훈련 모드</span><button class="toggle ${prefs.aiOffline?'on':''}" id="tgOffline"></button></div>
      <div class="muted xsmall">켜면 AI를 <b>일절 호출하지 않습니다.</b> 지휘멘트도 무전 기록도 나가지 않으며, 미리 준비된 시나리오와 로컬 채점으로 훈련합니다.</div>

      <div class="hr"></div>
      <div class="switch" style="${prefs.aiOffline?'opacity:.45':''}"><span class="lbl">AI 채점 사용</span><button class="toggle ${prefs.aiGrading?'on':''}" id="tgAiGrade" ${prefs.aiOffline?'disabled':''}></button></div>
      <div class="muted xsmall">끄면 훈련 종료 시 <b>무전 기록 전문</b>이 전송되지 않습니다. (매 턴 지휘멘트는 계속 전송됩니다 — 완전히 막으려면 위 오프라인 모드를 켜십시오)</div>
    </div>

    <div class="sect">데이터 보관 현황</div>
    <div class="card">
      <div class="okbox" style="margin-bottom:12px">
        🔒 아래 데이터는 <b>이 기기에만</b> 저장되며 서버로 전송되지 않습니다.<br>
        저장 위치: 이 브라우저의 IndexedDB
      </div>
      <div id="storeStatus" class="muted small">저장소 상태 확인 중…</div>
      <div class="hr"></div>
      <div id="storeCounts"><div class="muted small">집계 중…</div></div>
      <div class="hr"></div>
      <div class="kv"><span class="k">Gemini API 키</span><span class="v small">${AIRadio.getKey() ? '임시 보관 (탭 종료 시 삭제)' : '없음'}</span></div>
    </div>

    <div class="sect">백업 / 복원</div>
    <div class="card">
      <button class="btn ghost" id="expBtn">전체 백업 내보내기</button>
      <div style="height:8px"></div>
      <div class="btn ghost filebtn" id="impBtn">백업에서 복원<input type="file" id="impFile" accept=".json,application/json"></div>
      <div style="height:10px"></div>
      <div class="warnbox">
        내보낸 백업 파일에는 <b>훈련 기록과 사용자 자료 전체</b>가 들어 있습니다.
        기기 안에만 두고, <b>공개 저장소·단체 대화방에 올리지 마십시오.</b>
        파일 이름에 <code>.local.</code> 이 들어가 실수로 업로드되는 것을 막습니다.
        (API 키는 백업에 포함되지 않습니다)
      </div>
    </div>

    <div class="sect">데이터 삭제</div>
    <div class="card">
      <button class="btn danger" id="clearBtn">훈련 기록 전체 삭제</button>
      <div style="height:8px"></div>
      <button class="btn danger" id="wipeBtn">모든 데이터 초기화</button>
      <div class="muted xsmall" style="margin-top:8px">초기화는 되돌릴 수 없습니다. 먼저 백업을 내보내는 것을 권합니다.</div>
    </div>
    <div style="height:20px"></div>
    <div class="muted xsmall" style="text-align:center">지휘멘트 훈련 v1.0 · 무전 흐름 개선<br>접속 방식: ${esc(location.protocol)}${VoiceIO.secure?' (음성인식 가능)':' (음성인식 불가 — https 필요)'}</div>
    <div style="height:20px"></div>
  `;

  const on = (sel, ev, fn) => { const el = $(sel); if(el) el[ev] = fn; };

  const apiMsg = (t, err) => { const el = $('#apiMsg'); if(el){ el.textContent = t; el.style.color = err ? '#ff9a9a' : 'var(--ok)'; } };

  on('#apiKey','onchange', e => { AIRadio.setKey(e.target.value); apiMsg(e.target.value.trim() ? '키를 저장했습니다. 연결 테스트를 눌러 확인하십시오.' : '키를 삭제했습니다.'); });
  on('#apiClear','onclick', ()=>{ AIRadio.setKey(''); buzz(20); renderSettings(); });
  on('#apiTest','onclick', async e => {
    const b = e.currentTarget;
    if(!AIRadio.enabled()){ apiMsg('먼저 API 키를 입력하십시오.', true); return; }
    b.disabled = true; apiMsg('연결 확인 중...');
    try{
      const r = await AIRadio.test();
      apiMsg(r.ok ? `연결 정상 · 응답 ${r.ms}ms · 모델 ${AIRadio.model()}` : '응답이 올바르지 않습니다.', !r.ok);
    }catch(err){
      /* 이 호출은 고정된 더미 프롬프트만 보내므로 응답 본문을 보여줘도 사용자 자료가 노출되지 않는다 */
      const m = String((err && err.message) || err);
      const d = String((err && err.detail) || '');
      apiMsg(m.indexOf('HTTP 400')>=0 ? '키 또는 모델명이 올바르지 않습니다. ' + d.slice(0,80)
           : m.indexOf('HTTP 403')>=0 ? '키 권한이 없습니다. Google AI Studio에서 키를 다시 확인하십시오.'
           : m.indexOf('HTTP 429')>=0 ? '요청 한도를 초과했습니다. 잠시 후 다시 시도하십시오.'
           : '연결 실패: ' + safeErr(err), true);
    }finally{ b.disabled = false; }
  });
  on('#modelName','onchange', e => {
    const v = e.target.value.trim() || AIRadio.defaultModel;
    if(!AIRadio.validModel(v)){
      apiMsg('모델명에 쓸 수 없는 문자가 있습니다. 영문·숫자·점·밑줄·붙임표만 됩니다.', true);
      e.target.value = prefs.model || AIRadio.defaultModel;
      return;
    }
    prefs.model = v; savePrefs();
    apiMsg('모델을 변경했습니다. 연결 테스트를 권장합니다.');
    renderSettings();
  });

  /* ---- 모델 목록 새로고침 ---- */
  const mdlMsg = (t, err) => { const el = $('#mdlMsg'); if(el){ el.textContent = t; el.style.color = err ? '#ff9a9a' : 'var(--ok)'; } };
  on('#mdlRefresh','onclick', async e => {
    const b = e.currentTarget;
    if(prefs.aiOffline){ mdlMsg('오프라인 훈련 모드에서는 조회하지 않습니다. 먼저 해제하십시오.', true); return; }
    if(!AIRadio.enabled()){ mdlMsg('먼저 API 키를 입력하십시오.', true); return; }
    b.disabled = true; mdlMsg('조회 중...');
    try{
      const list = await AIRadio.listModels();
      if(!list.length){ mdlMsg('사용 가능한 모델을 찾지 못했습니다. 키 권한을 확인하십시오.', true); return; }
      modelList = list; modelListAt = Date.now();
      await saveModelList();
      const rec = AIRadio.recommend(list);
      const cur = AIRadio.model();
      mdlMsg(`${list.length}개 확인 · 권장 ${rec}${cur===rec?' (이미 사용 중)':''}`);
      buzz(20);
      notify(`모델 ${list.length}개를 확인했습니다.${cur===rec?'' : ` 권장 모델은 ${rec} 입니다.`}`, 'ok', 6000);
      renderSettings();
    }catch(err){
      const m = String((err && err.message) || err);
      const d = String((err && err.detail) || '');
      mdlMsg(m.indexOf('HTTP 400')>=0 ? '키가 올바르지 않습니다. ' + d.slice(0,60)
           : m.indexOf('HTTP 403')>=0 ? '이 키에는 모델 목록 조회 권한이 없습니다.'
           : m.indexOf('HTTP 429')>=0 ? '요청 한도를 초과했습니다. 잠시 후 다시 시도하십시오.'
           : '조회 실패: ' + safeErr(err), true);
    }finally{ b.disabled = false; }
  });
  $$('#view-set [data-mdl]').forEach(b => b.onclick = ()=>{
    const id = b.dataset.mdl;
    if(!AIRadio.validModel(id)) return;
    prefs.model = id; savePrefs(); buzz(15);
    notify(`사용 모델을 ${id} 로 바꿨습니다.`, 'ok');
    renderSettings();
  });
  on('#tgVoice','onclick', e => { prefs.voiceFeedback=!prefs.voiceFeedback; e.currentTarget.classList.toggle('on',prefs.voiceFeedback); savePrefs(); buzz(10); if(!prefs.voiceFeedback) VoiceIO.tts.cancel(); });
  on('#tgHaptic','onclick', e => { prefs.haptic=!prefs.haptic; e.currentTarget.classList.toggle('on',prefs.haptic); savePrefs(); buzz(10); });
  const applyRate = v => {
    const nv = Math.min(1.5, Math.max(0.8, Math.round(v*20)/20));
    VoiceIO.tts.setRate(nv);
    const sl = $('#rate'); if(sl) sl.value = nv;
    const lb = $('#rateVal'); if(lb) lb.textContent = nv.toFixed(2);
  };
  on('#rate','oninput', e => applyRate(parseFloat(e.target.value)));
  on('#rateDown','onclick', ()=>{ applyRate(prefs.rate - 0.05); buzz(10); VoiceIO.tts.speak('현재 속도입니다.'); });
  on('#rateUp','onclick',   ()=>{ applyRate(prefs.rate + 0.05); buzz(10); VoiceIO.tts.speak('현재 속도입니다.'); });
  on('#defRole','onchange', e => { prefs.role=e.target.value; S.cfg.role=e.target.value; savePrefs(); });
  on('#defDiff','onchange', e => { prefs.diff=e.target.value; S.cfg.diff=e.target.value; savePrefs(); });

  /* 2단계 추가 핸들러 */
  on('#tgStt','onclick', e => {
    prefs.sttEnabled=!prefs.sttEnabled; e.currentTarget.classList.toggle('on',prefs.sttEnabled);
    savePrefs(); buzz(10);
    if(prefs.sttEnabled) VoiceIO.micDenied = false;   // 권한을 허용한 뒤 재시도할 수 있게 리셋
    else VoiceIO.stt.abort();
    VoiceIO.refreshHint(); renderSettings();
  });
  on('#tgWaitSpeech','onclick', e => { prefs.waitAfterSpeech=!prefs.waitAfterSpeech; e.currentTarget.classList.toggle('on',prefs.waitAfterSpeech); savePrefs(); buzz(10); });
  on('#tgWinAuto','onclick', e => {
    prefs.respWindowMode = (prefs.respWindowMode==='auto') ? 'custom' : 'auto';
    e.currentTarget.classList.toggle('on', prefs.respWindowMode==='auto');
    $('#winCustom').style.display = prefs.respWindowMode==='custom' ? 'block' : 'none';
    savePrefs(); buzz(10);
  });
  on('#winSec','oninput', e => { prefs.respWindowSec=parseInt(e.target.value,10); $('#winVal').textContent=prefs.respWindowSec; savePrefs(); });
  on('#ttsTest','onclick', ()=> VoiceIO.tts.speak('상황실입니다. 지휘 바랍니다. 이상.'));

  /* AI 음성 목록 — 실제 사용 가능한 음성으로 동적 구성, 없으면 UI 숨김 */
  function fillVoices(){
    const sel = $('#voiceSel'), wrap = $('#voiceSelWrap');
    if(!sel || !wrap) return;
    const list = VoiceIO.koVoices.length ? VoiceIO.koVoices : VoiceIO.allVoices;
    if(!list.length){ wrap.style.display='none'; return; }
    wrap.style.display='block';
    sel.innerHTML = '<option value="">자동 선택</option>' +
      list.map(v=>`<option value="${esc(v.voiceURI)}" ${prefs.voiceURI===v.voiceURI?'selected':''}>${esc(v.name)} (${esc(v.lang)})</option>`).join('');
    sel.onchange = e => VoiceIO.tts.setVoice(e.target.value);
  }
  fillVoices();
  window.__onVoicesReady = ()=>{ if(S.tab==='set') fillVoices(); };   // 목록이 늦게 도착하는 경우 대비
  on('#tgMicBlock','onclick', e => {
    prefs.micBlocked = !prefs.micBlocked; e.currentTarget.classList.toggle('on', prefs.micBlocked);
    savePrefs(); buzz(15);
    if(prefs.micBlocked){ VoiceIO.stt.abort(); notify('마이크를 차단했습니다. 텍스트로만 송신합니다.', 'ok'); }
    else notify('마이크 차단을 해제했습니다.');
    VoiceIO.refreshHint();
  });
  on('#goManageSc','onclick', ()=>{ buzz(10); openManage('scenarios'); });
  on('#goManageTy','onclick', ()=>{ buzz(10); openManage('types'); });
  on('#goManageDoc','onclick', ()=>{ buzz(10); openManage('docs'); });
  on('#goManageTerm','onclick', ()=>{ buzz(10); openManage('terms'); });
  on('#sopLabel','onchange', e => { prefs.sopLabel = e.target.value.trim().slice(0,60); savePrefs(); });
  on('#tgTrend','onclick', e => { prefs.showTrend=!prefs.showTrend; e.currentTarget.classList.toggle('on',prefs.showTrend); savePrefs(); buzz(10); });

  on('#tgOffline','onclick', e => {
    prefs.aiOffline = !prefs.aiOffline; e.currentTarget.classList.toggle('on', prefs.aiOffline);
    savePrefs(); buzz(15);
    notify(prefs.aiOffline
      ? '오프라인 훈련 모드 — AI를 호출하지 않습니다. 외부 전송 0건.'
      : '오프라인 모드를 해제했습니다. 지휘멘트가 AI로 전송됩니다.', prefs.aiOffline ? 'ok' : null);
    renderSettings();
  });
  on('#tgAiGrade','onclick', e => {
    if(prefs.aiOffline) return;
    prefs.aiGrading = !prefs.aiGrading; e.currentTarget.classList.toggle('on', prefs.aiGrading);
    savePrefs(); buzz(10);
    notify(prefs.aiGrading ? 'AI 채점을 사용합니다.' : 'AI 채점을 껐습니다. 무전 기록 전문은 전송되지 않습니다.', 'ok');
    renderSettings();
  });

  /* ---- 데이터 보관 현황 ---- */
  async function refreshStorage(){
    const st = $('#storeStatus'), ct = $('#storeCounts');
    if(!st || !ct) return;
    if(!Store.available || Store.failed){
      st.innerHTML = `<span style="color:#ff9a9a">저장소를 사용할 수 없습니다(${esc(Store.lastError||'미지원')}). 훈련 기록이 앱을 닫으면 사라집니다.</span>`;
      ct.innerHTML = '';
      return;
    }
    const persisted = await Store.checkPersisted();
    const est = await Store.estimate();
    const pct = est && est.quota ? Math.min(100, est.usage / est.quota * 100) : 0;
    st.innerHTML =
      `<div class="kv"><span class="k">영구 보관</span><span class="v" style="color:${persisted?'var(--ok)':'var(--amber)'}">${persisted?'✅ 승인됨':'⚠ 미승인'}</span></div>` +
      (est ? `<div class="kv"><span class="k">사용 용량</span><span class="v">${fmtBytes(est.usage)} / ${fmtBytes(est.quota)}</span></div>
              <div class="meter"><i style="width:${pct.toFixed(2)}%"></i></div>` : '') +
      (persisted
        ? `<div class="muted xsmall" style="margin-top:8px">저장 공간이 부족해도 브라우저가 이 데이터를 임의로 지우지 않습니다.</div>`
        : `<div class="warnbox" style="margin-top:10px">브라우저가 저장 공간이 부족할 때 데이터를 지울 수 있습니다.
             <b>홈 화면에 추가</b>해서 사용하면 영구 보관이 승인될 가능성이 높아집니다.
             중요한 기록은 <b>백업 내보내기</b>로 따로 보관하십시오.
             <div style="height:8px"></div>
             <button class="btn sm ghost" id="persistBtn" style="width:100%">영구 보관 다시 요청</button>
           </div>`);
    const el = $('#persistBtn');
    if(el) el.onclick = async ()=>{
      const ok = await Store.requestPersist();
      notify(ok ? '영구 보관이 승인되었습니다.' : '브라우저가 영구 보관을 승인하지 않았습니다. 홈 화면에 추가한 뒤 다시 시도해 보십시오.', ok?'ok':'err');
      refreshStorage();
    };

    const labels = {situationTypes:'상황유형(사용자)', scenarios:'시나리오(사용자)', documents:'업로드 문서', sessions:'훈련 기록', settings:'앱 설정'};
    const rows = [];
    for(const n of Store.names){
      const c = await Store.count(n);
      rows.push(`<div class="kv"><span class="k">${labels[n]}</span><span class="v">${c}건</span>
        ${c ? `<button class="del" data-wipe="${n}">삭제</button>` : ''}</div>`);
    }
    ct.innerHTML = rows.join('');
    $$('#storeCounts [data-wipe]').forEach(b=> b.onclick = async ()=>{
      if(!confirm(`${labels[b.dataset.wipe]} 항목을 모두 삭제합니다. 계속할까요?`)) return;
      await Store.clear(b.dataset.wipe);
      if(b.dataset.wipe==='sessions'){ sessions=[]; S.viewingSession=null; }
      if(b.dataset.wipe==='situationTypes' || b.dataset.wipe==='scenarios'){
        await loadUserData();
        if(!allTypes().some(t=>t.key===S.cfg.type)) S.cfg.type = TYPES[0].key;
      }
      if(b.dataset.wipe==='documents') await loadDocs();
      buzz(30); notify('삭제했습니다.', 'ok');
      renderSettings();
    });
  }
  refreshStorage();

  /* ---- 백업 / 복원 ---- */
  on('#expBtn','onclick', async e => {
    const b = e.currentTarget; b.disabled = true;
    try{
      const r = await Backup.export();
      if(r) notify(`백업을 내보냈습니다. ${r.records}건 · ${fmtBytes(r.bytes)} — 다운로드 폴더를 확인하십시오.`, 'ok', 6000);
    }catch(err){ notify('백업 내보내기에 실패했습니다(' + safeErr(err) + ').', 'err'); }
    finally{ b.disabled = false; }
  });
  on('#impFile','onchange', async e => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if(!f) return;
    const mode = confirm('기존 데이터를 모두 지우고 백업 내용으로 바꾸시겠습니까?\n\n[확인] 전체 교체\n[취소] 기존 데이터에 합치기') ? 'replace' : 'merge';
    try{
      const r = await Backup.restore(f, mode);
      await loadUserData();
      await loadDocs();
      await loadCorrections();
      await loadSessionsFromStore();
      if(!allTypes().some(t=>t.key===S.cfg.type)) S.cfg.type = TYPES[0].key;
      notify(`복원 완료 — ${r.restored}건${r.exportedAt ? ' (백업 시점 ' + r.exportedAt.slice(0,10) + ')' : ''}`, 'ok', 6000);
      renderSettings();
    }catch(err){
      notify(String((err && err.message) || '복원에 실패했습니다.'), 'err', 8000);
    }
  });

  /* ---- 삭제 ---- */
  $('#clearBtn').onclick = async ()=>{
    if(!confirm('모든 훈련 기록을 삭제합니다. 계속할까요?')) return;
    await Store.clear('sessions');
    sessions=[]; S.viewingSession=null; buzz(40);
    notify('훈련 기록을 삭제했습니다.', 'ok');
    renderSettings();
  };
  on('#wipeBtn','onclick', async ()=>{
    if(!confirm('상황유형·시나리오·문서·훈련기록을 포함한 모든 데이터를 삭제합니다.\n되돌릴 수 없습니다. 계속할까요?')) return;
    const t = prompt('정말 초기화하려면 아래에 «초기화» 를 입력하십시오.');
    if(String(t||'').trim() !== '초기화'){ notify('초기화를 취소했습니다.'); return; }
    await Store.clearAll();
    sessions=[]; S.viewingSession=null;
    await loadUserData();
    await loadDocs();
    corrections = []; await loadCorrections();
    S.cfg.type = TYPES[0].key; S.cfg.scenarioId = SCENARIOS[0].id;
    buzz([40,60,40]);
    notify('모든 데이터를 초기화했습니다.', 'ok');
    renderSettings();
  });
}

/* ---------------------------------------------------------------
   13. 탭 전환 / PTT 바인딩
   --------------------------------------------------------------- */
const TAB_TITLE = {home:'지휘멘트 훈련', train:'훈련', log:'훈련 기록', set:'설정', manage:'내 자료 관리'};
const NAV_OF = {manage:'train'};          // 탭이 없는 화면은 어느 탭을 강조할지
function setTab(tab){
  S.tab = tab;
  const navKey = NAV_OF[tab] || tab;
  $$('nav button').forEach(b=> b.classList.toggle('on', b.dataset.tab===navKey));
  $$('.view').forEach(v=> v.classList.remove('on'));
  $('#view-'+tab).classList.add('on');
  $('#topTitle').textContent = TAB_TITLE[tab];
  $('#pttDock').classList.toggle('on', tab==='train' && S.trainStage==='run');
  window.scrollTo(0,0);

  if(tab==='home')   renderHome();
  if(tab==='log')    renderLogTab();
  if(tab==='set')    renderSettings();
  if(tab==='manage') renderManage();
  if(tab==='train'){
    if(S.trainStage==='run' && S.run) renderTrainRun();
    else if(S.trainStage==='result'){
      const s = sessions.find(x=>x.id===S.viewingSession);
      s ? renderResult(s) : (S.trainStage='setup', renderTrainSetup());
    }
    else renderTrainSetup();
  }
}
$$('nav button').forEach(b=> b.onclick = ()=>{
  if(S.run && b.dataset.tab!=='train'){
    if(!confirm('훈련이 진행 중입니다. 나가면 훈련이 종료됩니다.')) return;
    finishRun();
  }
  if(b.dataset.tab==='log') S.viewingSession=null;
  if(b.dataset.tab==='train' && S.mg) S.mg.edit = null;   // 관리 화면에서 탭을 누르면 편집기 닫기
  buzz(8);
  setTab(b.dataset.tab);
});

/* PTT — 1단계: 텍스트 입력 방식.
   2단계에서 pointerdown/up 구간에 SpeechRecognition을 연결합니다. */
const pttBtn=$('#pttBtn'), pttText=$('#pttText'), pttSend=$('#pttSend');
pttBtn.addEventListener('pointerdown', e=>{ e.preventDefault(); pttBtn.classList.add('active'); buzz(12); });
['pointerup','pointercancel','pointerleave'].forEach(ev=> pttBtn.addEventListener(ev, ()=> pttBtn.classList.remove('active')));
pttBtn.addEventListener('click', ()=>{ if(!VoiceIO.usingMic()) pttText.focus(); });  // 2단계: 음성 모드에선 키보드 미노출
pttSend.onclick = ()=>{
  cancelConfirm();
  const r = prepareTransmission(pttText.value);   // STEP4: 텍스트 입력에도 동일 해석 적용
  submitCommand(r.text, r.changes);
  pttText.value='';
};
pttText.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); pttSend.click(); } });

/* 2단계: 화면을 벗어나거나 앱이 백그라운드로 가면 음성 정리 */
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden){ VoiceIO.tts.cancel(); VoiceIO.stt.abort(); cancelConfirm(); }
});

/* 초기 렌더 — 저장소를 기다리지 않고 먼저 그린 뒤, 데이터가 오면 다시 그린다 */
setTab('home');
VoiceIO.refreshHint();

/* 4단계-STEP1: 저장소 부팅 */
(async function bootStore(){
  if(!Store.available){
    notify('이 브라우저는 영구 저장을 지원하지 않습니다. 훈련 기록이 앱을 닫으면 사라집니다.', 'err', 9000);
    return;
  }
  try{
    /* 1) 브라우저 자동 정리로부터 보호 요청 */
    await Store.requestPersist();

    /* 2) 저장된 사용자 자료와 훈련 기록 복구 */
    const u = await loadUserData();
    const dn = await loadDocs();
    await loadCorrections();
    await loadModelList();
    const n = await loadSessionsFromStore();
    if(n || u || dn){
      if(S.tab === 'home') renderHome();
      else if(S.tab === 'log') renderLogTab();
      else if(S.tab === 'train' && S.trainStage === 'setup') renderTrainSetup();
    }

    /* 3) 설정 백업본 기록 (백업/복원 대상) */
    await Store.put('settings', { key:'prefs', value: Object.assign({}, prefs), updatedAt: Date.now() });

    /* 4) 영구 보관이 거부됐고 아직 안내한 적 없으면 한 번만 알린다 */
    if(!Store.persisted && !prefs.voiceNoticeSeen){
      notify('브라우저가 저장 공간이 부족하면 데이터를 지울 수 있습니다. 홈 화면에 추가해서 사용하시면 안전합니다.', null, 7000);
    }
  }catch(e){
    logSafe('boot', safeErr(e));
    notify('저장소를 열지 못했습니다. 이번 세션의 기록은 앱을 닫으면 사라집니다.', 'err', 9000);
  }
})();

/* 설정이 바뀔 때마다 IndexedDB 사본도 갱신 (백업 대상 유지) */
(function mirrorPrefs(){
  const orig = savePrefs;
  let t = null;
  savePrefs = function(){
    orig();
    clearTimeout(t);
    t = setTimeout(()=>{ Store.put('settings', { key:'prefs', value: Object.assign({}, prefs), updatedAt: Date.now() }).catch(()=>{}); }, 600);
  };
})();
</script>
