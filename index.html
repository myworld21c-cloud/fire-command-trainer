<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0e0f12">
<title>지휘멘트 훈련</title>
<meta name="description" content="소방 현장지휘관 지휘멘트 반복 숙달 훈련 앱">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="지휘멘트 훈련">
<style>
/* ============================================================
   디자인 토큰 — 다크 테마 / 소방 레드 / 야간·장갑 착용 고려
   ============================================================ */
:root{
  --bg:#0e0f12;
  --surface:#171a20;
  --surface-2:#1f242c;
  --line:#2b323c;
  --red:#E23B3B;
  --red-dim:#8f2020;
  --amber:#F5842B;
  --text:#EDEFF2;
  --muted:#98A1AD;
  --ok:#3FBF6A;
  --nav-h:64px;
  --tap:56px;          /* 최소 터치 영역 */
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR","Malgun Gothic",sans-serif;
  font-size:16px;line-height:1.5;overscroll-behavior:none;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}

#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;position:relative}

/* ---------- 상단 바 ---------- */
.topbar{
  position:sticky;top:0;z-index:20;background:rgba(14,15,18,.94);backdrop-filter:blur(8px);
  padding:calc(var(--sat) + 10px) 16px 10px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;min-height:52px;
}
.topbar h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.3px}
.topbar .spacer{flex:1}
.badge{font-size:12px;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.badge.red{background:rgba(226,59,59,.15);color:#ff8f8f;border-color:var(--red-dim)}

/* ---------- 뷰 ---------- */
main{flex:1;padding:16px 16px calc(var(--nav-h) + var(--sab) + 24px)}
.view{display:none;animation:fade .18s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- 공통 컴포넌트 ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.card + .card{margin-top:12px}
.sect{margin:22px 0 10px;font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.4px}
.sect:first-child{margin-top:6px}
.row{display:flex;align-items:center;gap:10px}
.muted{color:var(--muted)}
.small{font-size:13px}
.xsmall{font-size:12px}

.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  min-height:var(--tap);padding:0 18px;border-radius:12px;
  background:var(--surface-2);border:1px solid var(--line);font-weight:600;width:100%;
}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{background:transparent}
.btn.danger{background:transparent;border-color:var(--red-dim);color:#ff8f8f}
.btn.sm{min-height:44px;font-size:14px;padding:0 14px;width:auto}
.btn[disabled]{opacity:.45;pointer-events:none}

.big-start{
  min-height:120px;border-radius:18px;background:linear-gradient(160deg,#E23B3B,#a82323);
  color:#fff;font-size:22px;font-weight:800;letter-spacing:-.5px;flex-direction:column;gap:4px;
  box-shadow:0 8px 30px rgba(226,59,59,.28);border:0;
}
.big-start small{font-weight:500;font-size:13px;opacity:.9}

/* 통계 카드 */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center}
.stat b{display:block;font-size:22px;font-weight:800;letter-spacing:-.5px}
.stat span{font-size:11px;color:var(--muted)}

/* 리스트 */
.list-item{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:var(--tap);
}
.list-item + .list-item{margin-top:8px}
.list-item .grow{flex:1;min-width:0}
.list-item .t{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-item .s{font-size:12px;color:var(--muted);margin-top:2px}
.score-chip{font-weight:800;font-size:18px;min-width:46px;text-align:right}

/* 선택 칩 */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  padding:0 14px;min-height:48px;display:flex;align-items:center;border-radius:12px;
  background:var(--surface);border:1px solid var(--line);font-size:15px;font-weight:600;
}
.chip.on{background:rgba(226,59,59,.16);border-color:var(--red);color:#ffb2b2}
.chip.grow{flex:1;justify-content:center}

/* 시나리오 선택 카드 */
.sc-item{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.sc-item + .sc-item{margin-top:8px}
.sc-item.on{border-color:var(--red);background:rgba(226,59,59,.1)}
.sc-item .t{font-weight:700;font-size:15px}
.sc-item .d{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.45}

/* 폼 */
label.f{display:block;font-size:13px;color:var(--muted);margin:0 0 6px}
.inp,select.inp{
  width:100%;min-height:var(--tap);background:var(--surface-2);border:1px solid var(--line);
  border-radius:12px;padding:0 14px;outline:none;
}
.inp:focus{border-color:var(--red)}
textarea.inp{padding:12px 14px;min-height:80px;resize:none;line-height:1.5}
.switch{display:flex;align-items:center;justify-content:space-between;min-height:var(--tap);gap:12px}
.switch .lbl{font-weight:600;font-size:15px}
.toggle{width:56px;height:32px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);position:relative;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#6b7480;transition:.16s}
.toggle.on{background:rgba(226,59,59,.3);border-color:var(--red)}
.toggle.on::after{left:27px;background:var(--red)}
.range{width:100%;accent-color:var(--red);height:44px}

/* ---------- 훈련 진행 ---------- */
.run-head{
  position:sticky;top:0;z-index:15;margin:-16px -16px 12px;padding:10px 14px;
  background:rgba(14,15,18,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;
}
.run-head .info{flex:1;min-width:0}
.run-head .nm{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.run-head .mt{font-size:11px;color:var(--muted)}
.clock{font-variant-numeric:tabular-nums;font-weight:800;font-size:19px;letter-spacing:-.5px}

#log{display:flex;flex-direction:column;gap:10px;padding-bottom:8px}
.msg{border-radius:12px;padding:11px 13px;font-size:15px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.msg .who{display:block;font-size:11px;font-weight:700;letter-spacing:.5px;margin-bottom:4px;opacity:.85}
.msg.dispatch{background:rgba(245,132,43,.08);border:1.5px solid var(--amber);color:#ffe3c9}
.msg.dispatch .who{color:var(--amber)}
.msg.me{background:var(--surface-2);border:1px solid var(--line);margin-left:28px}
.msg.me .who{color:var(--muted)}
.msg.sys{background:transparent;border:1px dashed var(--red-dim);color:#ff9a9a;font-size:13px;text-align:center;padding:8px}
.msg.thinking{background:var(--surface);border:1px solid var(--line);color:var(--muted);font-size:14px}

.waitbar{margin-top:4px}
.waitbar .cap{font-size:12px;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between}
.track{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.track > i{display:block;height:100%;background:var(--amber);width:0%;transition:width .2s linear}
.track.urgent > i{background:var(--red)}

/* PTT 영역 — 화면 하단 1/4 */
.ptt-dock{
  position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + var(--sab));z-index:18;
  max-width:560px;margin:0 auto;padding:10px 16px 12px;
  background:linear-gradient(to top,var(--bg) 55%,rgba(14,15,18,0));
  display:none;
}
.ptt-dock.on{display:block}
.ptt-wrap{display:flex;flex-direction:column;align-items:center;gap:8px}
.ptt{
  width:min(25vh,150px);height:min(25vh,150px);border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#f05a5a,#c02626 70%);
  color:#fff;font-weight:800;font-size:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  box-shadow:0 0 0 6px rgba(226,59,59,.16),0 10px 28px rgba(0,0,0,.5);
  border:0;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
}
.ptt small{font-size:11px;font-weight:600;opacity:.9}
.ptt.active{background:radial-gradient(circle at 35% 30%,#ff8080,#e23b3b 70%);box-shadow:0 0 0 12px rgba(226,59,59,.25)}
.ptt[disabled]{filter:grayscale(.6);opacity:.5}
.ptt-input{display:flex;gap:8px;width:100%}
.ptt-input .inp{flex:1;min-height:52px}
.ptt-input .btn{width:auto;min-width:76px;min-height:52px}

/* ---- 2단계 추가: 음성 상태 UI ---- */
.ptt.rec{
  background:radial-gradient(circle at 35% 30%,#ff9a9a,#e23b3b 70%);
  animation:pttPulse 1.1s ease-out infinite;
}
@keyframes pttPulse{
  0%{box-shadow:0 0 0 8px rgba(226,59,59,.35),0 10px 28px rgba(0,0,0,.5)}
  70%{box-shadow:0 0 0 26px rgba(226,59,59,0),0 10px 28px rgba(0,0,0,.5)}
  100%{box-shadow:0 0 0 8px rgba(226,59,59,0),0 10px 28px rgba(0,0,0,.5)}
}
.ptt-hint{
  min-height:20px;font-size:13px;color:var(--muted);text-align:center;line-height:1.4;
  width:100%;padding:0 4px;word-break:break-word;
}
.ptt-hint.err{color:#ff9a9a}
.ptt-hint .it{color:#c8ced6}
.ptt-confirm{
  display:none;width:100%;background:var(--surface);border:1px solid var(--amber);
  border-radius:12px;padding:10px 12px;
}
.ptt-confirm.on{display:block}
.ptt-confirm .ct{font-size:15px;line-height:1.45;word-break:break-word}
.ptt-confirm .cc{display:flex;align-items:center;gap:10px;margin-top:8px}
.ptt-confirm .cc .track{flex:1}
.ptt-confirm .cc .track > i{background:var(--amber);transition:width .1s linear}
.ptt-confirm .cbtn{font-size:13px;font-weight:700;color:var(--amber);padding:6px 10px;border:1px solid var(--line);border-radius:8px;flex:none}
.mic-off{opacity:.5}

/* 결과 리포트 */
.score-hero{text-align:center;padding:18px 14px}
.score-hero .n{font-size:56px;font-weight:900;line-height:1;letter-spacing:-2px}
.score-hero .g{font-size:14px;color:var(--muted);margin-top:6px}
.bar-row{margin-top:12px}
.bar-row .l{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--red)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:13px;padding:6px 10px;border-radius:8px;margin:0 6px 6px 0}
.tag.ok{background:rgba(63,191,106,.12);color:#7ee2a0;border:1px solid rgba(63,191,106,.3)}
.tag.miss{background:rgba(226,59,59,.12);color:#ff9a9a;border:1px solid var(--red-dim)}
.model-line{background:var(--surface-2);border-left:3px solid var(--amber);border-radius:0 10px 10px 0;padding:10px 12px;font-size:14px;line-height:1.6;margin-top:8px;white-space:pre-wrap}

/* ---------- 하단 탭 ---------- */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;max-width:560px;margin:0 auto;
  background:rgba(20,22,27,.97);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:var(--sab);
}
nav button{height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11px;font-weight:600}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--red)}

.empty{text-align:center;color:var(--muted);padding:34px 12px;font-size:14px;line-height:1.7}
.hr{height:1px;background:var(--line);margin:14px 0}
.notice{font-size:12px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;line-height:1.6}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <h1 id="topTitle">지휘멘트 훈련</h1>
    <span class="spacer"></span>
    <span class="badge" id="topBadge">v0.3</span>
  </div>

  <main>
    <!-- ================= 홈 ================= -->
    <section id="view-home" class="view on"></section>
    <!-- ================= 훈련 ================= -->
    <section id="view-train" class="view"></section>
    <!-- ================= 기록 ================= -->
    <section id="view-log" class="view"></section>
    <!-- ================= 설정 ================= -->
    <section id="view-set" class="view"></section>
  </main>

  <!-- PTT 도크 (훈련 진행 중에만 표시) -->
  <div class="ptt-dock" id="pttDock">
    <div class="ptt-wrap">
      <button class="ptt" id="pttBtn">송신<small id="pttSub">눌러서 입력</small></button>
      <div class="ptt-hint" id="pttHint"></div>
      <div class="ptt-confirm" id="pttConfirm">
        <div class="ct" id="confirmText"></div>
        <div class="cc">
          <div class="track"><i id="confirmFill" style="width:0%"></i></div>
          <button class="cbtn" id="confirmEdit">수정</button>
        </div>
      </div>
      <div class="ptt-input">
        <input class="inp" id="pttText" placeholder="지휘멘트를 입력하세요" autocomplete="off" enterkeyhint="send">
        <button class="btn primary" id="pttSend">전송</button>
      </div>
    </div>
  </div>

  <nav>
    <button data-tab="home" class="on"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>홈</button>
    <button data-tab="train"><svg viewBox="0 0 24 24"><path d="M12 3v9"/><path d="M12 12a4 4 0 0 0 4-4V6a4 4 0 0 0-8 0v2a4 4 0 0 0 4 4Z"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M8 21h8"/></svg>훈련</button>
    <button data-tab="log"><svg viewBox="0 0 24 24"><path d="M4 5h16v15a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1Z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>기록</button>
    <button data-tab="set"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 9 4.6h.1A1.6 1.6 0 0 0 10 3.1V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8v.1a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1Z"/></svg>설정</button>
  </nav>
</div>

<script>
/* ==========================================================================
   지휘멘트 훈련 웹앱 — 1단계 (골격 + 시나리오 + 텍스트 PTT + 상태머신)
   2단계: 음성인식/합성  3단계: Gemini 연동+채점  4단계: IndexedDB 저장·약점분석
   ========================================================================== */
'use strict';

/* ---------------------------------------------------------------
   1. 직무별 루브릭 (필수 요소 + 키워드 판정 규칙)
   --------------------------------------------------------------- */
const ROLES = {
  first: {
    name:'선착대장',
    desc:'최초 도착대 지휘관 — 초기 상황보고와 판단',
    items:[
      {key:'도착보고', label:'도착 보고(호출부호+현장도착)', re:/(도착|현착|현장\s*도착|진입로|여기는)/},
      {key:'현장개요', label:'건물·현장 개요(용도·층수·규모)', re:/(층|건물|주택|공장|상가|용도|규모|평|㎡|동|아파트|차량|산림|지하)/},
      {key:'연소범위', label:'연소·상황 범위', re:/(연소|화염|불길|연기|확대|확산|전소|외벽|천장|누출|전복|매몰|침수)/},
      {key:'인명정보', label:'인명 정보(요구조자 유무)', re:/(요구조자|인명|대피|미확인|갇힘|고립|거주자|재실|부상|사상|환자|구조대상)/},
      {key:'지원요청', label:'추가 지원 요청 여부', re:/(지원|증원|추가\s*출동|응원|구조대\s*요청|구급대\s*요청|대응\s*[1-3]|굴절|사다리차\s*요청)/}
    ]
  },
  cmd: {
    name:'지휘대장',
    desc:'현장지휘관 — 지휘권 인수와 전술 지시',
    items:[
      {key:'지휘권인수', label:'지휘권 인수 선언', re:/(지휘권|지휘\s*인수|지휘\s*개시|현장지휘|지휘를\s*맡|본인이\s*지휘)/},

function judgeLocal(text, roleKey, sc, turnIdx){
  const items = ROLES[roleKey].items;
  const checked=[], missed=[];
  items.forEach(it => (it.re.test(text) ? checked : missed).push(it.key));

  // 무전 응답 생성
  let reply;
  if(checked.length===0){
    reply = '상황실입니다. 송신 내용 불명확합니다. 호출부호와 지시사항 다시 송신 바랍니다.';
  }else if(checked.length >= items.length-1){
    reply = `${sc.facts.call} 수신 완료. 지시대로 시행하겠습니다. 각 대 복창합니다. 이상.`;
  }else{
    const q = ROLES[roleKey].items.find(i=>missed.includes(i.key));
    const asks = {
      '도착보고':'호출부호와 현장 도착 여부를 다시 확인 바랍니다.',
      '현장개요':'건물 용도와 층수, 규모를 추가로 보고 바랍니다.',
      '연소범위':'연소 범위와 확대 방향을 알려주십시오.',
      '인명정보':'요구조자 유무는 어떻게 됩니까?',
      '지원요청':'추가 지원이 필요합니까?',
      '지휘권인수':'현장 지휘권 인수 여부를 명확히 해주십시오.',
      '임무부여':'각 대별 임무를 구체적으로 지정해 주십시오.',
      '안전관리':'진입대 안전관리 지시가 필요합니다.',
      '검색우선':'인명검색 우선순위를 지정해 주십시오.',
      '재평가':'현재 전략을 유지합니까, 전환합니까?',
      '통제단가동':'통제단 가동 여부를 알려주십시오.',
      '유관기관':'유관기관 협조는 어디까지 요청할까요?',
      '자원배분':'가용 자원 배치 지시 바랍니다.',
      '대외보고':'본부 상황보고 주기를 지정해 주십시오.',
      '장기전':'교대 및 보급 계획을 지시해 주십시오.'
    };
    reply = `수신했습니다. ${asks[q.key] || '추가 지시 바랍니다.'} 이상.`;
  }
  return { radio_reply: reply, checked_items: checked, missed_items: missed };
}

/* 무전 규칙(20) + 상황 적합성(10) — 1단계 로컬 산출 */
function radioRuleScore(texts){
  if(!texts.length) return 0;
  let s = 0;
  const all = texts.join(' ');
  const avgLen = texts.reduce((a,t)=>a+t.length,0)/texts.length;
  if(avgLen <= 160) s += 8; else if(avgLen <= 240) s += 5; else s += 2;      // 간결성
  if(/(호차|지휘|본부|상황실|구조\d|구급\d|여기는|소대)/.test(all)) s += 7;   // 호출부호
  if(/(이상|바람|바랍니다|복창|시행하라|확인하라|보고하라)/.test(all)) s += 5; // 복창 유도
  return Math.min(20, s);
}
function relevanceScore(texts, sc){
  if(!texts.length) return 0;
  const all = texts.join(' ');
  const t = TACTICS[sc.type];
  const bag = (sc.title+' '+sc.detail+' '+t.tasks+' '+t.safety).match(/[가-힣]{2,}/g) || [];
  const uniq = Array.from(new Set(bag)).slice(0,60);
  const hit = uniq.filter(w => all.includes(w)).length;
  return Math.min(10, Math.round(hit/Math.max(6,uniq.length*0.18)*10));
}

/* ===============================================================
   6.4 AIRadio — Gemini 연동 (3단계 신규)
   · API 키는 코드에 없다. 설정 화면에서 입력받아 sessionStorage에만 보관한다.
   · 실패하면 예외를 던지지 않고 로컬 판정(judgeLocal)으로 되돌아간다.
   =============================================================== */
const AIRadio = (function(){
  const ENDPOINT = 'https://generativelanguage.googleapis.com/v1beta/models/';
  const KEY_NAME = 'gemini_api_key';
  const TIMEOUT  = 25000;

  const api = { lastError:'', lastLatency:0, callCount:0 };

  api.getKey  = ()=> (sessionStorage.getItem(KEY_NAME) || '').trim();
  api.setKey  = v => { v ? sessionStorage.setItem(KEY_NAME, String(v).trim()) : sessionStorage.removeItem(KEY_NAME); };
  api.enabled = ()=> !!api.getKey();
  api.model   = ()=> (prefs.model || 'gemini-flash-latest').trim();

  /* ---- 저수준 호출 ---- */
  async function generate(systemText, userText, schema){
    const key = api.getKey();
    if(!key) throw new Error('NO_KEY');

    const ctl = new AbortController();
    const to  = setTimeout(()=> ctl.abort(), TIMEOUT);
    const t0  = Date.now();
    try{
      const body = {
        systemInstruction:{ parts:[{ text: systemText }] },
        contents:[{ role:'user', parts:[{ text: userText }] }],
        generationConfig:{
          temperature: 0.85,
          maxOutputTokens: 1200,
          responseMimeType: 'application/json',
          responseSchema: schema
        },
        safetySettings:[
          'HARM_CATEGORY_HARASSMENT','HARM_CATEGORY_HATE_SPEECH',
          'HARM_CATEGORY_SEXUALLY_EXPLICIT','HARM_CATEGORY_DANGEROUS_CONTENT'
        ].map(c=>({ category:c, threshold:'BLOCK_ONLY_HIGH' }))
      };
      /* 키는 URL 쿼리스트링이 아니라 헤더로 보낸다 (브라우저 히스토리·리퍼러·프록시 로그 노출 방지) */
      const res = await fetch(ENDPOINT + encodeURIComponent(api.model()) + ':generateContent', {
        method:'POST',
        headers:{ 'Content-Type':'application/json', 'x-goog-api-key': key },
        referrerPolicy:'no-referrer',
        body: JSON.stringify(body), signal: ctl.signal
      });
      if(!res.ok){
        const t = await res.text().catch(()=> '');
        throw new Error('HTTP ' + res.status + (t ? ' — ' + t.slice(0,180) : ''));
      }
      const data = await res.json();
      const cand = (data.candidates || [])[0] || {};
      const parts = ((cand.content || {}).parts || []);
      let txt = parts.map(p => p.text || '').join('').trim();
      if(!txt) throw new Error('EMPTY_RESPONSE');
      txt = txt.replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '').trim();
      api.lastLatency = Date.now() - t0;
      api.callCount++;
      return JSON.parse(txt);
    } finally {
      clearTimeout(to);
    }
  }

  /* ---- 공통 프롬프트 조각 ---- */

/* 필수 요소 key 화이트리스트 검증 — AI가 엉뚱한 문자열을 보내도 점수가 깨지지 않게 */
function sanitizeItems(roleKey, arr){
  const valid = ROLES[roleKey].items.map(i=>i.key);
  const set = new Set();
  (Array.isArray(arr) ? arr : []).forEach(k=>{
    const s = String(k||'').trim();
    if(valid.includes(s)) set.add(s);
    else {                                   // 라벨로 보내온 경우 역매핑
      const hit = ROLES[roleKey].items.find(i => i.label === s || s.indexOf(i.key) >= 0);
      if(hit) set.add(hit.key);
    }
  });
  return Array.from(set);
}

/* 턴 판정 통합 진입점 — AI 우선, 실패 시 로컬 판정으로 폴백
   judgeLocal(text, roleKey, sc, turnIdx)의 시그니처와 반환 형태를 그대로 따른다. */
async function judgeTurn(text, roleKey, sc, turnIdx, run){
  if(AIRadio.enabled()){
    try{
      const r = await AIRadio.turn(text, roleKey, sc, turnIdx, run);
      const checked = sanitizeItems(roleKey, r.checked_items);
      const reply = String(r.radio_reply || '').trim();
      if(reply){
        return {
          radio_reply: reply,
          checked_items: checked,
          missed_items: ROLES[roleKey].items.map(i=>i.key).filter(k=>!checked.includes(k)),
          next_situation: String(r.next_situation || '').trim(),
          _ai: true
        };
      }
      throw new Error('EMPTY_REPLY');
    }catch(e){
      AIRadio.lastError = String((e && e.message) || e);
      console.warn('[AIRadio.turn] 폴백:', AIRadio.lastError);
    }
  }
  const local = judgeLocal(text, roleKey, sc, turnIdx);
  local.next_situation = '';
  local._ai = false;
  return local;
}

/* ===============================================================
   6.5 VoiceIO — 음성 입출력 모듈 (2단계 신규)
   기존 코드와 이름이 겹치지 않도록 모든 상태를 이 객체 안에 캡슐화한다.
     VoiceIO.state : 'idle' | 'listening' | 'speaking'
     VoiceIO.tts   : supported / speak / cancel / setVoice / setRate
     VoiceIO.stt   : supported / start / stop / abort / onResult / onError
   =============================================================== */
const VoiceIO = (function(){

  const SR    = window.SpeechRecognition || window.webkitSpeechRecognition || null;
  const synth = window.speechSynthesis || null;

  /* https(또는 localhost)가 아니면 마이크 권한 자체를 얻을 수 없다 */
  const secure = (location.protocol === 'https:' ||
                  location.hostname === 'localhost' ||
                  location.hostname === '127.0.0.1');

  const api = {
    state:'idle',
    secure: secure,
    micDenied:false,
    lastError:'',
    allVoices:[], koVoices:[],
    stt:{}, tts:{}
  };

  /* ---- 상태 전이 단일 지점 ---- */
  let endCbs = [];                       // 발화/인식 종료 대기 콜백 (일회성)
  function setState(s){
    if(api.state === s) return;
    api.state = s;
    refreshHint();
    if(s === 'idle') flushEndCbs();
  }
  function flushEndCbs(){
    const list = endCbs; endCbs = [];
    list.forEach(fn => { try{ fn(); }catch(e){ console.warn(e); } });
  }
  /* TTS/STT가 모두 끝난 시점에 콜백 실행 (이미 idle이면 즉시) */
  function whenIdle(cb){
    if(api.state === 'idle'){ cb(); return; }
    endCbs.push(cb);
  }

  /* =============== TTS =============== */
  const ttsSupported = !!(synth && window.SpeechSynthesisUtterance);
  let watchdog = null, speakSeq = 0;

  function loadVoices(){
    if(!ttsSupported) return;
    let list = [];
    try{ list = synth.getVoices() || []; }catch(e){ list = []; }
    api.allVoices = list;
    api.koVoices  = list.filter(v => /^ko([-_]|$)/i.test(v.lang || ''));
    if(typeof window.__onVoicesReady === 'function') window.__onVoicesReady();
  }
  if(ttsSupported){
    loadVoices();
    try{ synth.addEventListener('voiceschanged', loadVoices); }catch(e){ synth.onvoiceschanged = loadVoices; }
    /* voiceschanged가 끝내 안 오는 안드로이드 빌드 대비 재시도 */
    [120, 500, 1500, 3000].forEach(ms => setTimeout(loadVoices, ms));
  }

  function pickVoice(){
    if(!api.allVoices.length) return null;
    if(prefs.voiceURI){
      const hit = api.allVoices.find(v => v.voiceURI === prefs.voiceURI);
      if(hit) return hit;
    }
    return api.koVoices[0] || null;      // 없으면 null → 브라우저 기본 음성
  }

  /* Chrome의 긴 발화 끊김(약 15초) 대비: 문장 단위 분할 + resume 워치독 */
  function splitText(t){
    const clean = String(t || '').replace(/\s+/g, ' ').trim();
    if(!clean) return [];
    const sents = clean.match(/[^.!?…]+[.!?…]*/g) || [clean];
    const out = [];
    let buf = '';
    sents.forEach(s => {
      s = s.trim(); if(!s) return;
      if((buf + ' ' + s).trim().length > 110){ if(buf) out.push(buf.trim()); buf = s; }
      else buf = (buf + ' ' + s).trim();
    });
    if(buf) out.push(buf);
    return out.length ? out : [clean];
  }
  function startWatchdog(){
    stopWatchdog();
    watchdog = setInterval(()=>{
      if(!synth) return;
      try{ if(synth.speaking){ synth.pause(); synth.resume(); } }catch(e){}
    }, 7000);
  }
  function stopWatchdog(){ if(watchdog){ clearInterval(watchdog); watchdog = null; } }

  api.tts.supported = ttsSupported;
  api.tts.enabled   = ()=> ttsSupported && !!prefs.voiceFeedback;
  api.tts.setVoice  = uri => { prefs.voiceURI = uri || ''; savePrefs(); };
  api.tts.setRate   = r   => { prefs.rate = Math.min(2, Math.max(0.5, parseFloat(r) || 1)); savePrefs(); };

  api.tts.speak = function(text, onDone){
    const finish = ()=>{ if(typeof onDone === 'function') onDone(); };
    if(!api.tts.enabled() || !text){ setTimeout(finish, 0); return; }
    if(api.state === 'listening'){ setTimeout(finish, 0); return; }  // 인식 중에는 발화하지 않음(에코 차단)

    try{ synth.cancel(); }catch(e){}                                  // 이전 큐 비우기
    const chunks = splitText(text);
    if(!chunks.length){ setTimeout(finish, 0); return; }

    const seq = ++speakSeq;
    let i = 0, ended = false;
    setState('speaking');
    startWatchdog();

    const done = ()=>{
      if(ended || seq !== speakSeq) return;
      ended = true; stopWatchdog();
      if(api.state === 'speaking') setState('idle');
      finish();
    };
    const next = ()=>{
      if(seq !== speakSeq) return;                                    // cancel/재발화로 무효화
      if(i >= chunks.length){ done(); return; }
      const u = new SpeechSynthesisUtterance(chunks[i++]);
      const v = pickVoice();
      if(v) u.voice = v;
      u.lang   = (v && v.lang) || 'ko-KR';
      u.rate   = Math.min(2, Math.max(0.5, parseFloat(prefs.rate) || 1));
      u.pitch  = 1; u.volume = 1;
      u.onend   = next;
      u.onerror = next;                                               // 에러도 다음으로 넘겨 앱이 멈추지 않게
      try{ synth.speak(u); }
      catch(e){ done(); }
    };
    next();
    /* onend가 끝내 안 오는 기기 대비 안전망 (글자수 기반 추정 + 여유) */
    const est = chunks.join('').length * 110 + 4000;
    setTimeout(()=>{ if(seq === speakSeq) done(); }, Math.min(est, 60000));
  };

  api.tts.cancel = function(){
    speakSeq++;                       // 진행 중 발화 무효화
    stopWatchdog();
    if(synth){ try{ synth.cancel(); }catch(e){} }
    if(api.state === 'speaking') setState('idle');
  };
  api.isSpeaking = ()=> api.state === 'speaking';

  /* =============== STT =============== */
  const sttAvailable = !!SR;
  let rec = null, running = false, finalText = '', interimText = '', discard = false;

  api.stt.supported = sttAvailable && secure;
  api.stt.onResult  = null;
  api.stt.onError   = null;

  function build(){
    if(rec) return rec;
    rec = new SR();
    rec.lang = 'ko-KR';
    rec.continuous = false;             // PTT 방식
    rec.interimResults = true;
    rec.maxAlternatives = 1;

    rec.onstart = ()=>{ running = true; setState('listening'); };

    rec.onresult = e => {
      let fin = '', itr = '';
      for(let i = e.resultIndex; i < e.results.length; i++){
        const t = e.results[i][0].transcript;
        if(e.results[i].isFinal) fin += t; else itr += t;
      }
      if(fin) finalText += fin;
      interimText = itr;
      showInterim((finalText + ' ' + interimText).trim());
    };

    rec.onerror = e => {
      const code = (e && e.error) || 'unknown';
      api.lastError = code;
      if(code === 'no-speech'){                       // 정상 상황 — 조용히 재시도 유도
        hint('음성이 감지되지 않았습니다. 버튼을 길게 누른 채 말씀하십시오.', false);
      }else if(code === 'aborted'){
        /* 사용자가 취소 — 무시 */
      }else if(code === 'not-allowed' || code === 'service-not-allowed'){
        api.micDenied = true;
        prefs.sttEnabled = false; savePrefs();
        hint('마이크 권한이 거부되었습니다. 아래 입력창으로 송신하십시오.', true);
      }else if(code === 'audio-capture'){
        api.micDenied = true;
        hint('마이크를 찾을 수 없습니다. 텍스트로 입력하십시오.', true);
      }else if(code === 'network'){
        hint('음성인식 네트워크 오류입니다. 텍스트로 입력하십시오.', true);
      }else{
        hint('음성인식 오류(' + code + '). 텍스트로 입력하십시오.', true);
      }
      if(typeof api.stt.onError === 'function') api.stt.onError(code);
    };

    rec.onend = ()=>{
      running = false;
      if(api.state === 'listening') setState('idle');
      const txt = (finalText + ' ' + interimText).trim();
      finalText = ''; interimText = '';
      if(discard){ discard = false; showInterim(''); return; }
      showInterim('');
      if(typeof api.stt.onResult === 'function') api.stt.onResult(txt);
    };
    return rec;
  }

  api.stt.start = function(){
    if(!api.stt.supported || api.micDenied) return false;
    if(running) return false;                     // InvalidStateError 방지
    if(api.state === 'speaking') api.tts.cancel();// 에코 차단: 발화 중엔 먼저 중단
    finalText = ''; interimText = ''; discard = false;
    try{ build().start(); return true; }
    catch(e){                                     // 이미 시작됨 등
      running = false;
      if(String(e && e.name) !== 'InvalidStateError'){
        hint('음성인식을 시작할 수 없습니다. 텍스트로 입력하십시오.', true);
      }
      return false;
    }
  };
  api.stt.stop  = function(){ if(running && rec){ try{ rec.stop();  }catch(e){} } };
  api.stt.abort = function(){ discard = true; if(running && rec){ try{ rec.abort(); }catch(e){} } };
  api.isListening = ()=> api.state === 'listening';

  /* =============== 화면 힌트 =============== */
  function hintEl(){ return document.getElementById('pttHint'); }
  let hintTimer = null;
  function hint(msg, isErr){
    const el = hintEl(); if(!el) return;
    el.className = 'ptt-hint' + (isErr ? ' err' : '');
    el.textContent = msg || '';
    clearTimeout(hintTimer);
    if(msg) hintTimer = setTimeout(()=>{ if(hintEl() === el && el.textContent === msg) refreshHint(); }, 4000);
  }
  function showInterim(t){
    const el = hintEl(); if(!el) return;
    if(!t){ refreshHint(); return; }
    clearTimeout(hintTimer);
    el.className = 'ptt-hint';
    el.innerHTML = '<span class="it">' + esc(t) + '</span>';
  }
  function refreshHint(){
    const el = hintEl(); if(!el) return;
    clearTimeout(hintTimer);
    el.className = 'ptt-hint';
    if(api.state === 'listening')      el.textContent = '듣는 중… 버튼을 누른 채 말씀하십시오';
    else if(api.state === 'speaking')  el.textContent = api.usingMic()
                                          ? '상황실 송신 중 — 누르면 끊고 바로 말할 수 있습니다'
                                          : '상황실 송신 중 — 누르면 즉시 중단합니다';
    else if(!api.usingMic())           el.textContent = api.micReason();
    else                               el.textContent = '';
    const b = document.getElementById('pttBtn');
    if(b) b.classList.toggle('rec', api.state === 'listening');
  }
  api.refreshHint = refreshHint;

  /* 현재 마이크 입력을 쓰는 상태인가 */
  api.usingMic = ()=> !!(api.stt.supported && prefs.sttEnabled && !api.micDenied);
  /* 지원 불가 사유 (설정·홈 안내용 — 사용자 on/off와 무관) */
  api.unsupportedReason = function(){
    if(!sttAvailable) return '이 브라우저는 음성인식을 지원하지 않습니다';
    if(!secure)       return '음성인식은 https 접속에서만 작동합니다 (현재 ' + location.protocol + ')';
    if(api.micDenied) return '마이크 권한이 거부되었습니다';
    if(!api.stt.supported) return '이 환경에서는 음성인식을 사용할 수 없습니다';
    return '';
  };
  /* PTT 하단 힌트용 — 사용자가 직접 끈 경우는 안내하지 않는다 */
  api.micReason = function(){
    if(!prefs.sttEnabled) return '';
    const r = api.unsupportedReason();
    return r ? (r + ' — 텍스트로 입력하십시오') : '';
  };
  api.hint = function(enabled){
    if(!enabled) return '대기 중';
    return api.usingMic() ? '길게 눌러 말하기' : '눌러서 입력';
  };
  api.whenIdle = whenIdle;

  return api;
})();

/* ---------------------------------------------------------------
   6.6 음성 ↔ 훈련 루프 연결 (기존 함수는 건드리지 않고 여기서 조립)
   --------------------------------------------------------------- */

/* 지휘 대기 카운트다운 일시정지 / 재개 — 사용자가 말하는 동안 시간이 깎이지 않게 */
function pauseAwaitBar(){
  const r = S.run;
  if(r && r.state === 'await' && r.bar){ r.awaitLeft = r.bar.left; stopBar(); }
}
function resumeAwaitBar(){
  const r = S.run;
  if(!r || r.state !== 'await' || r.bar || !r.awaitStart) return;
  const left = (typeof r.awaitLeft === 'number') ? r.awaitLeft : r.awaitWindow;
  r.awaitLeft = null;
  r.awaitStart(Math.max(3, Math.round(left)));
}

/* 인식 결과 확인 단계: 1.2초 노출 후 자동 전송, 탭하면 수정 */
let confirmTimer = null, confirmRAF = null;
function cancelConfirm(){
  clearInterval(confirmRAF); confirmRAF = null;
  clearTimeout(confirmTimer); confirmTimer = null;
  const box = document.getElementById('pttConfirm');
  if(box) box.classList.remove('on');
}
function showConfirm(text){
  const box = document.getElementById('pttConfirm');
  const txt = document.getElementById('confirmText');
  const fill= document.getElementById('confirmFill');
  if(!box || !txt || !fill){ submitCommand(text); return; }
  cancelConfirm();
  txt.textContent = text;
  fill.style.width = '0%';
  box.classList.add('on');

  const DUR = 1200, t0 = Date.now();
  confirmRAF = setInterval(()=>{
    const p = Math.min(1, (Date.now() - t0) / DUR);
    fill.style.width = (p * 100) + '%';
  }, 60);
  confirmTimer = setTimeout(()=>{
    cancelConfirm();
    submitCommand(text);
  }, DUR);
}
function editConfirm(){
  const txt = document.getElementById('confirmText');
  const val = txt ? txt.textContent : '';
  cancelConfirm();
  const inp = document.getElementById('pttText');
  if(inp){ inp.value = val; inp.focus(); try{ inp.setSelectionRange(val.length, val.length); }catch(e){} }
  resumeAwaitBar();
}

VoiceIO.stt.onResult = function(text){
  const t = (text || '').trim();
  if(!t){ resumeAwaitBar(); VoiceIO.refreshHint(); return; }
  if(!S.run || S.run.state !== 'await'){ VoiceIO.refreshHint(); return; }
  buzz(15);
  showConfirm(t);
};
VoiceIO.stt.onError = function(){ resumeAwaitBar(); };

/* PTT 제스처 — 기존 핸들러는 그대로 두고 리스너를 추가로 등록한다 */
(function bindVoicePTT(){
  const btn = document.getElementById('pttBtn');
  if(!btn) return;
  let pressAt = 0, pressing = false;
  const MIN_PRESS = 150;   // 오작동 방지

  btn.addEventListener('contextmenu', e => e.preventDefault());

  btn.addEventListener('pointerdown', e => {
    if(btn.disabled) return;
    cancelConfirm();
    VoiceIO.tts.cancel();                 // barge-in: AI 발화 즉시 중단
    if(!VoiceIO.usingMic()){ VoiceIO.refreshHint(); return; }
    pressing = true; pressAt = Date.now();
    try{ btn.setPointerCapture(e.pointerId); }catch(err){}
    pauseAwaitBar();
    VoiceIO.stt.start();
  });

  function release(cancelled){
    if(!pressing) return;
    pressing = false;
    const dur = Date.now() - pressAt;
    btn.classList.remove('rec');
    if(cancelled || dur < MIN_PRESS){
      VoiceIO.stt.abort();                // 결과 버림
      resumeAwaitBar();
      if(!cancelled) VoiceIO.refreshHint();
    }else{
      VoiceIO.stt.stop();                 // 최종 결과 수신
    }
  }
  btn.addEventListener('pointerup',     ()=> release(false));
  btn.addEventListener('pointercancel', ()=> release(true));
  btn.addEventListener('pointerleave',  ()=> release(false));
})();

/* 확인 단계 버튼 */
(function bindConfirm(){
  const box = document.getElementById('pttConfirm');
  const btn = document.getElementById('confirmEdit');
  if(btn) btn.addEventListener('click', e => { e.stopPropagation(); editConfirm(); });
  if(box) box.addEventListener('click', editConfirm);
})();

/* ---------------------------------------------------------------
   7. 렌더 — 홈
   --------------------------------------------------------------- */
function aggregate(){
  const n = sessions.length;
  const avg = n ? Math.round(sessions.reduce((a,s)=>a+s.score.total,0)/n) : 0;
  const dur = sessions.reduce((a,s)=>a+s.durationSec,0);
  const missCount = {};
  sessions.forEach(s => (s.score.missed||[]).forEach(k => missCount[k]=(missCount[k]||0)+1));
  const top = Object.entries(missCount).sort((a,b)=>b[1]-a[1]).slice(0,3);
  return {n, avg, dur, top};
}
function labelOf(key){
  for(const r of Object.values(ROLES)){
    const it = r.items.find(i=>i.key===key);
    if(it) return it.label;
  }
  return key;
}

      : `<div class="empty">아직 훈련 기록이 없습니다.<br>훈련을 시작해 보세요.</div>`}

        : `설정에서 <b>Gemini API 키</b>를 입력하면 AI 상황실과 실제로 무전을 주고받을 수 있습니다. 키가 없으면 미리 준비된 시나리오와 로컬 임시 채점으로 훈련합니다.`}

/* ---------------------------------------------------------------
   8. 렌더 — 훈련 설정
   --------------------------------------------------------------- */
function renderTrainSetup(){
  const cfg = S.cfg;
  const list = SCENARIOS.filter(s=>s.type===cfg.type);
  if(!list.some(s=>s.id===cfg.scenarioId)) cfg.scenarioId = list[0].id;

  $('#view-train').innerHTML = `
    <div class="sect">1. 직무 선택 <span style="color:var(--red)">*</span></div>
    <div class="chips" id="roleChips">
      ${Object.entries(ROLES).map(([k,r])=>`<button class="chip grow ${cfg.role===k?'on':''}" data-role="${k}">${r.name}</button>`).join('')}
    </div>
    <div class="muted xsmall" style="margin-top:6px">${esc(ROLES[cfg.role].desc)}</div>

/* ---------------------------------------------------------------
   9. 훈련 진행 — 상태 머신
      states: brief(상황부여) → await(지휘대기) → judge(AI판정) → gap(대기타이머) → …
   --------------------------------------------------------------- */
const TOTAL_TURNS_MIN = 5;

function startRun(){
  const sc = scenarioById(S.cfg.scenarioId);
  const d = DIFFS[S.cfg.diff];
  S.run = {
    id: 'S'+Date.now(),
    role:S.cfg.role, diff:S.cfg.diff, scenario:sc,
    startedAt: Date.now(), elapsed:0,
    turn:0, totalTurns: Math.min(sc.turns.length+1, 6),
    worseIdx:0, noResponse:0,
    log:[],                 // {who:'dispatch'|'me'|'sys', text, ts}
    myTexts:[],
    checkedAll:new Set(), missedAll:new Set(),
    state:'idle', timers:{}
  };
  S.trainStage='run';
  renderTrainRun();
  setTab('train');
  buzz(30);

  // 최초 상황 부여
  const f = sc.facts;
  pushLog('dispatch', `상황실입니다. ${sc.detail} 출동대 현장 도착했습니다. ${ROLES[S.cfg.role].name}님, 지휘 바랍니다.`);
  startAwait();
  startClock();
}

function pushLog(who, text){
  S.run.log.push({who, text, ts:Date.now()});
  if(who==='me') S.run.myTexts.push(text);
  renderLog();
  if(who==='dispatch') VoiceIO.tts.speak(text);   // 2단계 추가: 상황실 메시지 음성 출력
}

function startClock(){
  clearInterval(S.run.timers.clock);
  S.run.timers.clock = setInterval(()=>{
    if(!S.run) return;
    S.run.elapsed = Math.floor((Date.now()-S.run.startedAt)/1000);
    const el = $('#clock'); if(el) el.textContent = mmss(S.run.elapsed);
  }, 1000);
}

/* 지휘 응답 대기 (제한시간 내 미송신 → 악화 상황) */
function startAwait(){
  const r = S.run; if(!r) return;
  r.state='await';

  // 응답 없음 처리 (기존 로직 그대로)
  const onTimeout = ()=>{
    const rr = S.run; if(!rr) return;
    rr.noResponse++;
    pushLog('sys', '⚠ 지휘 응답 없음 — 상황이 악화됩니다');
    buzz([40,60,40]);
    const w2 = rr.scenario.worse[rr.worseIdx % rr.scenario.worse.length]; rr.worseIdx++;
    rr.turn++;
    pushLog('dispatch', w2);
    if(rr.turn >= rr.totalTurns) return finishRun();
    startAwait();
  };

  // 2단계: 제한시간을 설정값에서 읽고, 일시정지/재개가 가능하도록 시작 함수를 보관
  r.awaitWindow = respWindowFor(r.diff);
  r.awaitLeft   = null;
  r.awaitStart  = sec => { if(S.run === r && r.state==='await') runBar('지휘 응답 대기 — 송신하십시오', sec, true, onTimeout); };

  setPTTEnabled(true);

  // AI 발화가 끝난 뒤 카운트다운 시작 (설정에서 끌 수 있음)
  if(prefs.waitAfterSpeech && VoiceIO.state !== 'idle'){
    VoiceIO.whenIdle(()=>{ if(S.run === r && r.state==='await' && !r.bar) r.awaitStart(r.awaitWindow); });
  }else{
    r.awaitStart(r.awaitWindow);
  }
}

/* 후속 상황까지의 대기 */
function startGap(){
  const r = S.run; if(!r) return;
  r.state='gap';
  setPTTEnabled(false);
  const ti=$('#turnInd'); if(ti) ti.textContent = Math.min(r.turn+1, r.totalTurns);
  runBar('현장에서 새로운 상황 접수 중...', DIFFS[r.diff].gap, false, ()=>{
    if(!S.run) return;
    if(r.turn >= r.totalTurns) return finishRun();
    const idx = Math.min(r.turn-1, r.scenario.turns.length-1);
    const nx = r.aiNext; r.aiNext = null;                    // 3단계: AI가 만든 후속 상황 우선
    pushLog('dispatch', nx || r.scenario.turns[idx]);
    buzz(25);
    startAwait();
  });
}

/* 진행바 공용 */
function runBar(caption, seconds, urgent, done){
  const r = S.run; if(!r) return;
  clearInterval(r.timers.bar);
  r.bar = {caption, total:seconds, left:seconds, urgent};
  renderWait();
  r.timers.bar = setInterval(()=>{
    if(!S.run){ clearInterval(r.timers.bar); return; }
    r.bar.left = Math.max(0, r.bar.left - 0.1);
    updateWaitBar();
    if(r.bar.left <= 0){ clearInterval(r.timers.bar); r.bar=null; renderWait(); done(); }
  }, 100);
}
function stopBar(){ if(S.run){ clearInterval(S.run.timers.bar); S.run.bar=null; renderWait(); } }

function renderTrainRun(){
  const r = S.run, sc = r.scenario;
  $('#view-train').innerHTML = `
    <div class="run-head">
      <div class="info">
        <div class="nm">${esc(sc.title)}</div>
        <div class="mt">${ROLES[r.role].name} · ${DIFFS[r.diff].name} · <span id="turnInd">1</span>/${r.totalTurns}턴</div>
      </div>
      <div class="clock" id="clock">00:00</div>
      <button class="btn danger sm" id="endRun">종료</button>
    </div>
    <div id="waitZone"></div>
    <div id="log"></div>
    <div style="height:calc(min(25vh,150px) + 90px)"></div>
  `;
  $('#endRun').onclick = ()=>{ if(confirm('훈련을 종료하고 결과를 확인하시겠습니까?')) finishRun(); };
  $('#pttDock').classList.add('on');
  renderLog(); renderWait();
}

function renderLog(){
  const box = $('#log'); if(!box || !S.run) return;
  box.innerHTML = S.run.log.map(m=>{
    const who = m.who==='dispatch' ? '상황실 / 현장' : m.who==='me' ? '나 (지휘)' : '';
    if(m.who==='sys') return `<div class="msg sys">${esc(m.text)}</div>`;
    return `<div class="msg ${m.who}"><span class="who">${who}</span>${esc(m.text)}</div>`;
  }).join('');
  const t = $('#turnInd'); if(t) t.textContent = Math.min(S.run.turn+1, S.run.totalTurns);
  window.scrollTo({top:document.body.scrollHeight, behavior:'smooth'});
}

function renderWait(){
  const z = $('#waitZone'); if(!z || !S.run) return;
  const b = S.run.bar;
  if(!b){ z.innerHTML=''; return; }
  z.innerHTML = `
    <div class="waitbar">
      <div class="cap"><span>${esc(b.caption)}</span><span id="barLeft">${Math.ceil(b.left)}초</span></div>
      <div class="track ${b.urgent?'urgent':''}"><i id="barFill" style="width:${b.urgent? (b.left/b.total*100) : (100-b.left/b.total*100)}%"></i></div>
    </div>`;
}
function updateWaitBar(){
  const b = S.run && S.run.bar; if(!b) return;
  const fill = $('#barFill'), left = $('#barLeft');
  if(fill) fill.style.width = (b.urgent ? (b.left/b.total*100) : (100-b.left/b.total*100)) + '%';
  if(left) left.textContent = Math.ceil(b.left)+'초';
}

/* 송신 처리 */
function submitCommand(text){
  const r = S.run;
  if(!r || r.state!=='await') return;
  text = (text||'').trim();
  if(!text) return;
  stopBar();
  setPTTEnabled(false);
  buzz(20);
  pushLog('me', text);

  r.state='judge';
  const th = document.createElement('div');
  th.className='msg thinking';
  th.textContent = AIRadio.enabled() ? '상황실 응답 중... (AI 판정)' : '상황실 응답 중...';
  $('#log').appendChild(th);
  window.scrollTo({top:document.body.scrollHeight, behavior:'smooth'});

  // 3단계: AI 판정 우선, 실패 시 로컬 판정으로 자동 폴백
  const t0 = Date.now();
  judgeTurn(text, r.role, r.scenario, r.turn, r).then(res=>{
    if(!S.run || S.run !== r) return;                       // 도중에 훈련이 끝났으면 폐기
    const wait = Math.max(0, 500 - (Date.now() - t0));      // 너무 즉답이면 부자연스러우므로 최소 대기
    setTimeout(()=>{
      if(!S.run || S.run !== r) return;
      (res.checked_items||[]).forEach(k=>r.checkedAll.add(k));
      r.missedAll = new Set(ROLES[r.role].items.map(i=>i.key).filter(k=>!r.checkedAll.has(k)));
      if(res.next_situation) r.aiNext = res.next_situation;  // AI가 만든 후속 상황
      if(res._ai) r.aiTurns = (r.aiTurns||0) + 1;
      th.remove();
      pushLog('dispatch', res.radio_reply);
      r.turn++;
      if(r.turn >= r.totalTurns) return finishRun();
      startGap();
    }, wait);
  });
}

function setPTTEnabled(on){
  const b=$('#pttBtn'), i=$('#pttText'), s=$('#pttSend');
  if(!b) return;
  b.disabled=!on; i.disabled=!on; s.disabled=!on;
  $('#pttSub').textContent = VoiceIO.hint(on);    // 2단계: 음성/텍스트 모드에 따라 안내 문구
  if(!on){ cancelConfirm(); VoiceIO.stt.abort(); }
  VoiceIO.refreshHint();
}

/* ---------------------------------------------------------------
   10. 종료 및 결과 리포트
   --------------------------------------------------------------- */
function finishRun(){
  const r = S.run; if(!r) return;
  clearInterval(r.timers.clock); clearInterval(r.timers.bar);
  VoiceIO.tts.cancel(); VoiceIO.stt.abort(); cancelConfirm();   // 2단계: 음성 정리
  $('#pttDock').classList.remove('on');

  const items = ROLES[r.role].items;
  const checked = items.map(i=>i.key).filter(k=>r.checkedAll.has(k));
  const missed  = items.map(i=>i.key).filter(k=>!r.checkedAll.has(k));
  const base = Math.round(checked.length/items.length*70);
  const radio = radioRuleScore(r.myTexts);
  const rel = relevanceScore(r.myTexts, r.scenario);
  let total = base+radio+rel;
  total = Math.max(0, total - r.noResponse*5);  // 무응답 패널티

  const sess = {
    id:r.id, role:r.role, diff:r.diff,
    scenarioId:r.scenario.id, scenarioTitle:r.scenario.title,
    startedAt:r.startedAt, durationSec:Math.max(1, Math.floor((Date.now()-r.startedAt)/1000)),
    log:r.log.slice(),
    score:{ total, base, radio, rel, checked, missed, noResponse:r.noResponse, itemCount:items.length },
    review: buildReview(r, checked, missed, total),
    modelText: modelTransmission(r.role, r.scenario)
  };
  sess.aiTurns = r.aiTurns || 0;
  sess.aiPending = AIRadio.enabled() && sess.log.some(l=>l.who==='me');
  sessions.push(sess);           // 4단계: IndexedDB 저장으로 교체
  S.run = null;
  S.trainStage='result';
  S.viewingSession = sess.id;
  renderResult(sess);
  buzz([30,50,30]);
  if(sess.aiPending) enhanceSessionWithAI(sess);   // 3단계: AI 채점·총평 (비동기, 실패해도 로컬 결과 유지)
}

/* AI 총평으로 결과를 덮어쓴다. 실패하면 로컬 채점 결과가 그대로 남는다. */
async function enhanceSessionWithAI(sess){
  try{
    const r = await AIRadio.evaluate(sess);
    const items   = ROLES[sess.role].items;
    const checked = sanitizeItems(sess.role, r.checked_items);
    const missed  = items.map(i=>i.key).filter(k=>!checked.includes(k));
    const base    = Math.round(checked.length / items.length * 70);
    const radio   = Math.max(0, Math.min(20, parseInt(r.radio_score, 10) || 0));
    const rel     = Math.max(0, Math.min(10, parseInt(r.relevance_score, 10) || 0));

    sess.score.checked = checked;
    sess.score.missed  = missed;
    sess.score.base    = base;
    sess.score.radio   = radio;
    sess.score.rel     = rel;
    sess.score.total   = Math.max(0, base + radio + rel - sess.score.noResponse * 5);
    if(String(r.review||'').trim())             sess.review    = String(r.review).trim();
    if(String(r.model_transmission||'').trim()) sess.modelText = String(r.model_transmission).trim();
    sess.aiGraded = true;
  }catch(e){
    AIRadio.lastError = String((e && e.message) || e);
    console.warn('[AIRadio.evaluate] 폴백:', AIRadio.lastError);
    sess.aiError = AIRadio.lastError;
  }finally{
    sess.aiPending = false;
    if(S.tab==='train' && S.trainStage==='result' && S.viewingSession===sess.id) renderResult(sess);
    else if(S.tab==='log' && S.viewingSession===sess.id) renderSessionDetail(sess);
    else if(S.tab==='home') renderHome();
  }
}

function buildReview(r, checked, missed, total){
  const lines=[];
  lines.push(total>=85 ? '전반적으로 체계적인 지휘였습니다.' : total>=70 ? '기본 골격은 갖췄으나 일부 요소가 빠졌습니다.' : '필수 요소 누락이 많습니다. 표준 양식부터 숙달이 필요합니다.');
  if(missed.length) lines.push(`특히 ${missed.map(labelOf).join(', ')} 항목이 확인되지 않았습니다.`);
  if(r.noResponse) lines.push(`지휘 응답 없음이 ${r.noResponse}회 발생했습니다. 판단이 늦어지면 상황은 계속 악화됩니다.`);
  if(r.myTexts.length && r.myTexts.reduce((a,t)=>a+t.length,0)/r.myTexts.length > 200) lines.push('무전 문장이 깁니다. 핵심만 2~3문장으로 끊어 송신하십시오.');
  if(!/이상|바랍니다|바람/.test(r.myTexts.join(' '))) lines.push('무전 종료어(이상)와 복창 유도 표현을 사용하십시오.');
  return lines.join(' ');
}

      <div class="g">${esc(s.scenarioTitle)} · ${ROLES[s.role].name} · ${DIFFS[s.diff].name}</div>
      <div class="g">소요 ${humanDur(s.durationSec)} · 송신 ${s.log.filter(l=>l.who==='me').length}회</div>

    </div>

    <div class="sect">항목별 점수</div>
    <div class="card">
      ${bar('필수 요소 충족', s.score.base, 70, `${s.score.checked.length}/${s.score.itemCount}`)}
      ${bar('무전 규칙 준수', s.score.radio, 20)}
      ${bar('상황 적합성', s.score.rel, 10)}
      ${s.score.noResponse? `<div class="small" style="color:#ff9a9a;margin-top:10px">지휘 응답 없음 ${s.score.noResponse}회 · -${s.score.noResponse*5}점</div>`:''}
    </div>

    <div class="sect">충족 / 누락 요소</div>
    <div class="card">
      ${s.score.checked.map(k=>`<span class="tag ok">✓ ${esc(labelOf(k))}</span>`).join('')}
      ${s.score.missed.map(k=>`<span class="tag miss">✕ ${esc(labelOf(k))}</span>`).join('')}
      ${!s.score.checked.length && !s.score.missed.length ? '<span class="muted small">데이터 없음</span>':''}
    </div>

    <div class="sect">총평</div>
    <div class="card small" style="line-height:1.7">${esc(s.review)}</div>

    <div class="sect">모범 지휘멘트 (${ROLES[s.role].name})</div>
    <div class="model-line">${esc(s.modelText)}</div>

    <div style="height:18px"></div>
    <button class="btn primary" id="againBtn">같은 조건으로 다시 훈련</button>
    <div style="height:8px"></div>
    <button class="btn ghost" id="detailBtn">전체 무전 로그 보기</button>
    <div style="height:8px"></div>
    <button class="btn ghost" id="homeBtn">홈으로</button>
    <div style="height:20px"></div>
  `;
  $('#againBtn').onclick = ()=> startRun();
  $('#detailBtn').onclick = ()=> openSession(s.id);
  $('#homeBtn').onclick = ()=>{ S.trainStage='setup'; setTab('home'); };
}
/* 채점 출처 배지 — AI 채점 / 로컬 임시 채점 구분 */
function gradeBadge(s){
  if(s.aiPending) return `<span class="badge">AI 채점 중…</span>`;
  if(s.aiGraded)  return `<span class="badge red">AI 채점 · ${esc(prefs.model)}</span>`;
  if(s.aiError)   return `<span class="badge">로컬 임시 채점 (AI 오류: ${esc(String(s.aiError).slice(0,40))})</span>`;
  return `<span class="badge">로컬 임시 채점 · API 키 미설정</span>`;
}
function bar(label, val, max, note){
  return `<div class="bar-row">
    <div class="l"><span>${label}${note?` <span class="muted">${note}</span>`:''}</span><b>${val} / ${max}</b></div>
    <div class="bar"><i style="width:${Math.round(val/max*100)}%"></i></div>
  </div>`;
}

/* ---------------------------------------------------------------
   11. 기록 탭
   --------------------------------------------------------------- */
function renderLogTab(){
  if(S.viewingSession && S.tab==='log'){
    const s = sessions.find(x=>x.id===S.viewingSession);
    if(s) return renderSessionDetail(s);
  }
  const list = sessions.slice().reverse();
  $('#view-log').innerHTML = `
    <div class="sect">훈련 기록 (${list.length}건)</div>
    ${list.length ? list.map(s=>`
      <button class="list-item" data-open="${s.id}">
        <div class="grow">
          <div class="t">${esc(s.scenarioTitle)}</div>
          <div class="s">${ROLES[s.role].name} · ${DIFFS[s.diff].name} · ${fmtDate(s.startedAt)} · ${humanDur(s.durationSec)}</div>
        </div>
        <div class="score-chip" style="color:${s.score.total>=80?'var(--ok)':s.score.total>=60?'var(--amber)':'var(--red)'}">${s.score.total}</div>
      </button>`).join('')
      : `<div class="empty">저장된 훈련 기록이 없습니다.</div>`}
    <div style="height:14px"></div>
    <div class="notice">1단계에서는 기록이 메모리에만 남아 새로고침하면 사라집니다. 4단계에서 IndexedDB 영구 저장으로 교체됩니다.</div>
  `;
  $$('#view-log [data-open]').forEach(b=> b.onclick = ()=> openSession(b.dataset.open));
}
function openSession(id){
  S.viewingSession = id;
  setTab('log');
}
function renderSessionDetail(s){
  $('#view-log').innerHTML = `
    <button class="btn ghost sm" id="backBtn" style="margin-bottom:12px">‹ 목록으로</button>
    <div class="card score-hero">
      <div class="n" style="color:${s.score.total>=80?'var(--ok)':s.score.total>=60?'var(--amber)':'var(--red)'}">${s.score.total}</div>
      <div class="g">${esc(s.scenarioTitle)} · ${ROLES[s.role].name} · ${DIFFS[s.diff].name}</div>
      <div class="g">${fmtDate(s.startedAt)} · ${humanDur(s.durationSec)}</div>
      <div style="margin-top:10px">${gradeBadge(s)}</div>
    </div>

    <div class="sect">항목별 점수</div>
    <div class="card">
      ${bar('필수 요소 충족', s.score.base, 70, `${s.score.checked.length}/${s.score.itemCount}`)}
      ${bar('무전 규칙 준수', s.score.radio, 20)}
      ${bar('상황 적합성', s.score.rel, 10)}
    </div>

    <div class="sect">누락 요소</div>
    <div class="card">
      ${s.score.missed.length ? s.score.missed.map(k=>`<span class="tag miss">✕ ${esc(labelOf(k))}</span>`).join('') : '<span class="tag ok">✓ 누락 없음</span>'}
    </div>

    <div class="sect">AI 총평</div>
    <div class="card small" style="line-height:1.7">${esc(s.review)}</div>

    <div class="sect">모범 지휘멘트</div>
    <div class="model-line">${esc(s.modelText)}</div>

    <div class="sect">전체 무전 로그</div>
    <div id="log" style="display:flex;flex-direction:column;gap:10px">
      ${s.log.map(m=>{
        if(m.who==='sys') return `<div class="msg sys">${esc(m.text)}</div>`;
        const who = m.who==='dispatch' ? '상황실 / 현장' : '나 (지휘)';
        return `<div class="msg ${m.who}"><span class="who">${who}</span>${esc(m.text)}</div>`;
      }).join('')}
    </div>
    <div style="height:20px"></div>
  `;
  $('#backBtn').onclick = ()=>{ S.viewingSession=null; renderLogTab(); };
}

/* ---------------------------------------------------------------
   12. 설정 탭
   --------------------------------------------------------------- */
function renderSettings(){
  const key = AIRadio.getKey();
  $('#view-set').innerHTML = `
    <div class="sect">AI 연동 (Gemini)</div>
    <div class="card">
      <div class="row" style="margin-bottom:8px">
        <span class="badge ${key?'red':''}">${key?'API 키 입력됨 — AI 판정 사용':'API 키 없음 — 로컬 임시 채점'}</span>
      </div>
      <label class="f">Gemini API 키</label>
      <input class="inp" id="apiKey" type="password" placeholder="AIza... (붙여넣기)" value="${esc(key)}" autocomplete="off" spellcheck="false">
      <div style="height:8px"></div>
      <div class="row" style="gap:8px">
        <button class="btn sm ghost" id="apiTest" style="flex:1">연결 테스트</button>
        <button class="btn sm danger" id="apiClear" style="flex:1">키 삭제</button>
      </div>
      <div class="small" id="apiMsg" style="margin-top:8px;min-height:20px"></div>
      <div class="hr"></div>
      <label class="f">사용 모델</label>
      <input class="inp" id="modelName" value="${esc(prefs.model)}" autocomplete="off" spellcheck="false">
      <div style="height:10px"></div>
      <div class="notice">키는 <b>이 브라우저 탭의 메모리(sessionStorage)</b>에만 보관되며 코드나 서버에 저장되지 않습니다. 탭을 닫으면 자동으로 지워지므로 다음에 다시 입력해야 합니다.</div>
    </div>

    <div class="sect">음성 출력 (AI 무전)</div>
    <div class="card">
      ${VoiceIO.tts.supported ? `
        <div class="switch"><span class="lbl">음성 피드백</span><button class="toggle ${prefs.voiceFeedback?'on':''}" id="tgVoice"></button></div>
        <div class="hr"></div>
        <div id="voiceSelWrap" style="display:${VoiceIO.allVoices.length?'block':'none'}">
          <label class="f">AI 음성 ${VoiceIO.koVoices.length?'(한국어 음성 우선)':'(한국어 음성 없음 — 기본 음성 사용)'}</label>
          <select class="inp" id="voiceSel"></select>
          <div style="height:12px"></div>
        </div>
        <label class="f">발화 속도 <b id="rateVal">${Number(prefs.rate).toFixed(2)}</b>배 <span class="muted">(느림 0.8 ~ 1.5 빠름)</span></label>
        <div class="row" style="gap:8px">
          <button class="btn sm" id="rateDown" style="width:64px;min-height:52px;font-size:22px;font-weight:800">−</button>
          <input class="range" type="range" id="rate" min="0.8" max="1.5" step="0.05" value="${Math.min(1.5,Math.max(0.8,prefs.rate))}" style="flex:1">
          <button class="btn sm" id="rateUp" style="width:64px;min-height:52px;font-size:22px;font-weight:800">＋</button>
        </div>
        <div style="height:8px"></div>
        <button class="btn sm ghost" id="ttsTest" style="width:100%">현재 속도로 테스트 재생</button>
      ` : `<div class="muted small">이 브라우저는 음성 출력을 지원하지 않습니다.</div>`}
    </div>

    <div class="sect">음성 인식 (지휘멘트 입력)</div>
    <div class="card">
      ${VoiceIO.stt.supported ? `
        <div class="switch"><span class="lbl">PTT 음성인식 사용</span><button class="toggle ${prefs.sttEnabled?'on':''}" id="tgStt"></button></div>
        <div class="muted xsmall" style="margin-top:4px">끄면 1단계와 동일하게 텍스트 입력으로만 송신합니다.</div>
      ` : `<div class="muted small">${esc(VoiceIO.unsupportedReason())}</div>
           <div class="muted xsmall" style="margin-top:6px">텍스트 입력 방식은 그대로 사용할 수 있습니다.</div>`}
      ${VoiceIO.stt.supported && VoiceIO.micDenied ? `<div class="hr"></div><div class="small" style="color:#ff9a9a">마이크 권한이 거부된 상태입니다. 브라우저 주소창의 자물쇠 아이콘에서 마이크를 허용한 뒤 위 스위치를 다시 켜십시오.</div>` : ''}
    </div>

    <div class="sect">지휘 응답 제한시간</div>
    <div class="card">
      <div class="switch"><span class="lbl">난이도 기본값 사용</span><button class="toggle ${prefs.respWindowMode==='auto'?'on':''}" id="tgWinAuto"></button></div>
      <div class="muted xsmall">초급 ${DIFFS.basic.window}초 · 중급 ${DIFFS.inter.window}초 · 고급 ${DIFFS.adv.window}초</div>
      <div id="winCustom" style="display:${prefs.respWindowMode==='custom'?'block':'none'}">
        <div class="hr"></div>
        <label class="f">직접 지정 <b id="winVal">${prefs.respWindowSec}</b>초 (모든 난이도 공통)</label>
        <input class="range" type="range" id="winSec" min="10" max="120" step="5" value="${prefs.respWindowSec}">
      </div>
      <div class="hr"></div>
      <div class="switch"><span class="lbl">AI 발화 후 카운트다운 시작</span><button class="toggle ${prefs.waitAfterSpeech?'on':''}" id="tgWaitSpeech"></button></div>
      <div class="muted xsmall">켜면 상황실 무전이 끝난 뒤부터 제한시간이 흐릅니다.</div>
    </div>

    <div class="sect">훈련 기본값</div>
    <div class="card">
      <label class="f">기본 직무</label>
      <select class="inp" id="defRole">${Object.entries(ROLES).map(([k,r])=>`<option value="${k}" ${prefs.role===k?'selected':''}>${r.name}</option>`).join('')}</select>
      <div style="height:12px"></div>
      <label class="f">기본 난이도</label>
      <select class="inp" id="defDiff">${Object.entries(DIFFS).map(([k,d])=>`<option value="${k}" ${prefs.diff===k?'selected':''}>${d.name} (${d.sub})</option>`).join('')}</select>
      <div class="hr"></div>
      <div class="switch"><span class="lbl">햅틱 진동</span><button class="toggle ${prefs.haptic?'on':''}" id="tgHaptic"></button></div>
    </div>

    <div class="sect">데이터</div>
    <div class="card">
      <button class="btn danger" id="clearBtn">훈련 기록 전체 삭제</button>
    </div>
    <div style="height:20px"></div>
    <div class="muted xsmall" style="text-align:center">지휘멘트 훈련 v0.3 · 3단계 AI 연동<br>접속 방식: ${esc(location.protocol)}${VoiceIO.secure?' (음성인식 가능)':' (음성인식 불가 — https 필요)'}</div>
    <div style="height:20px"></div>
  `;

  const on = (sel, ev, fn) => { const el = $(sel); if(el) el[ev] = fn; };

  const apiMsg = (t, err) => { const el = $('#apiMsg'); if(el){ el.textContent = t; el.style.color = err ? '#ff9a9a' : 'var(--ok)'; } };

  on('#apiKey','onchange', e => { AIRadio.setKey(e.target.value); apiMsg(e.target.value.trim() ? '키를 저장했습니다. 연결 테스트를 눌러 확인하십시오.' : '키를 삭제했습니다.'); });
  on('#apiClear','onclick', ()=>{ AIRadio.setKey(''); buzz(20); renderSettings(); });
  on('#apiTest','onclick', async e => {
    const b = e.currentTarget;
    if(!AIRadio.enabled()){ apiMsg('먼저 API 키를 입력하십시오.', true); return; }
    b.disabled = true; apiMsg('연결 확인 중...');
    try{
      const r = await AIRadio.test();
      apiMsg(r.ok ? `연결 정상 · 응답 ${r.ms}ms · 모델 ${AIRadio.model()}` : '응답이 올바르지 않습니다.', !r.ok);
    }catch(err){
      const m = String((err && err.message) || err);
      apiMsg(m.indexOf('HTTP 400')>=0 ? '키 또는 모델명이 올바르지 않습니다. ' + m.slice(0,80)
           : m.indexOf('HTTP 403')>=0 ? '키 권한이 없습니다. Google AI Studio에서 키를 다시 확인하십시오.'
           : m.indexOf('HTTP 429')>=0 ? '요청 한도를 초과했습니다. 잠시 후 다시 시도하십시오.'
           : '연결 실패: ' + m.slice(0,120), true);
    }finally{ b.disabled = false; }
  });
  on('#modelName','onchange', e => { prefs.model = e.target.value.trim() || 'gemini-flash-latest'; savePrefs(); apiMsg('모델을 변경했습니다. 연결 테스트를 권장합니다.'); });
  on('#tgVoice','onclick', e => { prefs.voiceFeedback=!prefs.voiceFeedback; e.currentTarget.classList.toggle('on',prefs.voiceFeedback); savePrefs(); buzz(10); if(!prefs.voiceFeedback) VoiceIO.tts.cancel(); });
  on('#tgHaptic','onclick', e => { prefs.haptic=!prefs.haptic; e.currentTarget.classList.toggle('on',prefs.haptic); savePrefs(); buzz(10); });
  const applyRate = v => {
    const nv = Math.min(1.5, Math.max(0.8, Math.round(v*20)/20));
    VoiceIO.tts.setRate(nv);
    const sl = $('#rate'); if(sl) sl.value = nv;
    const lb = $('#rateVal'); if(lb) lb.textContent = nv.toFixed(2);
  };
  on('#rate','oninput', e => applyRate(parseFloat(e.target.value)));
  on('#rateDown','onclick', ()=>{ applyRate(prefs.rate - 0.05); buzz(10); VoiceIO.tts.speak('현재 속도입니다.'); });
  on('#rateUp','onclick',   ()=>{ applyRate(prefs.rate + 0.05); buzz(10); VoiceIO.tts.speak('현재 속도입니다.'); });
  on('#defRole','onchange', e => { prefs.role=e.target.value; S.cfg.role=e.target.value; savePrefs(); });
  on('#defDiff','onchange', e => { prefs.diff=e.target.value; S.cfg.diff=e.target.value; savePrefs(); });

  /* 2단계 추가 핸들러 */
  on('#tgStt','onclick', e => {
    prefs.sttEnabled=!prefs.sttEnabled; e.currentTarget.classList.toggle('on',prefs.sttEnabled);
    savePrefs(); buzz(10);
    if(prefs.sttEnabled) VoiceIO.micDenied = false;   // 권한을 허용한 뒤 재시도할 수 있게 리셋
    else VoiceIO.stt.abort();
    VoiceIO.refreshHint(); renderSettings();
  });
  on('#tgWaitSpeech','onclick', e => { prefs.waitAfterSpeech=!prefs.waitAfterSpeech; e.currentTarget.classList.toggle('on',prefs.waitAfterSpeech); savePrefs(); buzz(10); });
  on('#tgWinAuto','onclick', e => {
    prefs.respWindowMode = (prefs.respWindowMode==='auto') ? 'custom' : 'auto';
    e.currentTarget.classList.toggle('on', prefs.respWindowMode==='auto');
    $('#winCustom').style.display = prefs.respWindowMode==='custom' ? 'block' : 'none';
    savePrefs(); buzz(10);
  });
  on('#winSec','oninput', e => { prefs.respWindowSec=parseInt(e.target.value,10); $('#winVal').textContent=prefs.respWindowSec; savePrefs(); });
  on('#ttsTest','onclick', ()=> VoiceIO.tts.speak('상황실입니다. 지휘 바랍니다. 이상.'));

  /* AI 음성 목록 — 실제 사용 가능한 음성으로 동적 구성, 없으면 UI 숨김 */
  function fillVoices(){
    const sel = $('#voiceSel'), wrap = $('#voiceSelWrap');
    if(!sel || !wrap) return;
    const list = VoiceIO.koVoices.length ? VoiceIO.koVoices : VoiceIO.allVoices;
    if(!list.length){ wrap.style.display='none'; return; }
    wrap.style.display='block';
    sel.innerHTML = '<option value="">자동 선택</option>' +
      list.map(v=>`<option value="${esc(v.voiceURI)}" ${prefs.voiceURI===v.voiceURI?'selected':''}>${esc(v.name)} (${esc(v.lang)})</option>`).join('');
    sel.onchange = e => VoiceIO.tts.setVoice(e.target.value);
  }
  fillVoices();
  window.__onVoicesReady = ()=>{ if(S.tab==='set') fillVoices(); };   // 목록이 늦게 도착하는 경우 대비
  $('#clearBtn').onclick = ()=>{ if(confirm('모든 훈련 기록을 삭제합니다. 계속할까요?')){ sessions=[]; S.viewingSession=null; buzz(40); alert('삭제했습니다.'); } };
}

/* ---------------------------------------------------------------
   13. 탭 전환 / PTT 바인딩
   --------------------------------------------------------------- */
const TAB_TITLE = {home:'지휘멘트 훈련', train:'훈련', log:'훈련 기록', set:'설정'};
function setTab(tab){
  S.tab = tab;
  $$('nav button').forEach(b=> b.classList.toggle('on', b.dataset.tab===tab));
  $$('.view').forEach(v=> v.classList.remove('on'));
  $('#view-'+tab).classList.add('on');
  $('#topTitle').textContent = TAB_TITLE[tab];
  $('#pttDock').classList.toggle('on', tab==='train' && S.trainStage==='run');
  window.scrollTo(0,0);

  if(tab==='home') renderHome();
  if(tab==='log')  renderLogTab();
  if(tab==='set')  renderSettings();
  if(tab==='train'){
    if(S.trainStage==='run' && S.run) renderTrainRun();
    else if(S.trainStage==='result'){
      const s = sessions.find(x=>x.id===S.viewingSession);
      s ? renderResult(s) : (S.trainStage='setup', renderTrainSetup());
    }
    else renderTrainSetup();
  }
}
$$('nav button').forEach(b=> b.onclick = ()=>{
  if(S.run && b.dataset.tab!=='train'){
    if(!confirm('훈련이 진행 중입니다. 나가면 훈련이 종료됩니다.')) return;
    finishRun();
  }
  if(b.dataset.tab==='log') S.viewingSession=null;
  buzz(8);
  setTab(b.dataset.tab);
});

/* PTT — 1단계: 텍스트 입력 방식.
   2단계에서 pointerdown/up 구간에 SpeechRecognition을 연결합니다. */
const pttBtn=$('#pttBtn'), pttText=$('#pttText'), pttSend=$('#pttSend');
pttBtn.addEventListener('pointerdown', e=>{ e.preventDefault(); pttBtn.classList.add('active'); buzz(12); });
['pointerup','pointercancel','pointerleave'].forEach(ev=> pttBtn.addEventListener(ev, ()=> pttBtn.classList.remove('active')));
pttBtn.addEventListener('click', ()=>{ if(!VoiceIO.usingMic()) pttText.focus(); });  // 2단계: 음성 모드에선 키보드 미노출
pttSend.onclick = ()=>{ cancelConfirm(); submitCommand(pttText.value); pttText.value=''; };
pttText.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); pttSend.click(); } });

/* 2단계: 화면을 벗어나거나 앱이 백그라운드로 가면 음성 정리 */
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden){ VoiceIO.tts.cancel(); VoiceIO.stt.abort(); cancelConfirm(); }
});

/* 초기 렌더 */
setTab('home');
VoiceIO.refreshHint();
</script>
